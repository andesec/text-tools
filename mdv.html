<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Markdown Explorer</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
		rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						sans: ['Inter', 'sans-serif'],
					},
				}
			}
		}
	</script>
	<script src="vendor/marked.min.js"></script>
	<link rel="stylesheet" href="vendor/katex/katex.min.css">
	<script src="vendor/katex/katex.min.js"></script>
	<script src="vendor/purify.min.js"></script>
	<link href="vendor/prism-tomorrow.min.css" rel="stylesheet" />
	<script src="vendor/prism.min.js"></script>
	<script src="vendor/prism-markdown.min.js"></script>
	<script src="vendor/prism-bash.min.js"></script>
	<script src="vendor/prism-javascript.min.js"></script>
	<script src="vendor/prism-python.min.js"></script>
	<link rel="stylesheet" href="mdv-comments.css">
	<link rel="stylesheet" href="theme.css">

	<style>
		:root {
			--reader-font-size: 1rem;
		}

		@media (max-width: 640px) {
			:root {
				--reader-font-size: 0.875rem;
			}
		}

		.prose {
			max-width: none;
			color: var(--text-primary) !important;
			font-size: var(--reader-font-size);
			line-height: 1.7;
			word-wrap: break-word;
		}

		.prose p,
		.prose ul,
		.prose ol,
		.prose blockquote,
		.prose pre,
		.prose table {
			margin-top: 1.25em;
			margin-bottom: 1.25em;
		}

		.prose h1 {
			font-size: clamp(1.5rem, 4vw, 2.5em);
			line-height: 1.2;
			margin-top: 0;
			margin-bottom: 0.8em;
			border-bottom: 2px solid var(--border-default);
			padding-bottom: 0.3em;
			color: var(--text-primary);
		}

		.prose h2 {
			font-size: clamp(1.25rem, 3vw, 1.8em);
			line-height: 1.3;
			margin-top: 2em;
			margin-bottom: 1em;
			border-bottom: 1px solid var(--border-subtle);
			padding-bottom: 0.2em;
			color: var(--text-primary);
		}

		.prose h3 {
			font-size: clamp(1.1rem, 2vw, 1.4em);
			margin-top: 1.6em;
			margin-bottom: 0.6em;
			color: var(--text-secondary);
		}

		.prose ul {
			list-style-type: disc;
			padding-left: 1.5em;
		}

		.prose ol {
			list-style-type: decimal;
			padding-left: 1.5em;
		}

		.prose li {
			margin-top: 0.5em;
			margin-bottom: 0.5em;
			padding-left: 0.25em;
		}

		.prose li>p {
			margin-top: 0.5em;
			margin-bottom: 0.5em;
		}

		.prose blockquote {
			border-left: 4px solid var(--border-default);
			padding-left: 1.25em;
			font-style: italic;
			color: var(--text-secondary);
		}

		/* Code Handling */
		.prose :not(pre)>code {
			background-color: var(--code-inline-bg);
			padding: 0.2em 0.4em;
			border-radius: 0.25rem;
			font-family: var(--font-mono);
			font-size: 0.85em;
			color: var(--code-inline-text);
		}

		.prose pre {
			background-color: var(--code-bg) !important;
			padding: 1rem !important;
			border-radius: var(--radius-lg);
			overflow-x: auto;
			border: 1px solid var(--border-default);
		}

		.prose pre code {
			background: transparent !important;
			padding: 0 !important;
			border-radius: 0 !important;
			font-size: 0.85em !important;
			line-height: 1.5 !important;
			color: var(--text-primary) !important;
			font-family: var(--font-mono) !important;
		}

		/* Tables */
		.prose table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9em;
			display: block;
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		.prose th {
			background-color: var(--bg-surface-hover);
			text-align: left;
		}

		.prose th,
		.prose td {
			border: 1px solid var(--border-default);
			padding: 0.75em;
		}

		/* Responsive Media */
		.prose img,
		.prose video,
		.prose iframe {
			max-width: 100%;
			height: auto;
			border-radius: var(--radius-md);
		}

		/* KaTeX Math Styling */
		.katex-display {
			margin: 1.5em 0 !important;
			overflow-x: auto;
			overflow-y: hidden;
			padding: 0.5em 0;
		}

		.katex {
			font-size: 1.1em;
		}

		@media (prefers-color-scheme: dark) {
			body {
				background-color: var(--bg-root);
				color: var(--text-primary);
			}

			.sidebar {
				background-color: var(--bg-surface);
				border-color: var(--border-default);
			}

			.prose {
				color: var(--text-primary);
			}

			.prose h1 {
				color: var(--text-primary);
				border-color: var(--border-default);
			}

			.prose h2 {
				color: var(--text-primary);
				border-color: var(--border-subtle);
			}

			.prose h3 {
				color: var(--text-secondary);
			}

			.prose :not(pre)>code {
				background-color: var(--code-inline-bg);
				color: var(--code-inline-text);
			}

			.prose blockquote {
				border-color: var(--border-default);
				color: var(--text-secondary);
			}

			.prose th {
				background-color: var(--bg-surface-hover);
			}

			.prose th,
			.prose td {
				border-color: var(--border-default);
			}

			.file-item:hover {
				background-color: var(--bg-surface-hover);
			}
		}

		.file-item.active {
			background-color: var(--accent) !important;
			color: white !important;
		}

		.mobile-sidebar-active #sidebar {
			display: flex !important;
			position: fixed;
			inset: 0;
			z-index: 60;
			width: 100%;
		}

		#editor-container {
			min-height: 0;
			display: flex;
			flex-direction: column;
			transition: all var(--transition-slow);
		}

		#editor-container.hidden {
			display: none !important;
		}

		#content {
			transition: all var(--transition-slow);
		}

		#editor {
			flex: 1;
			min-height: 0;
		}

		.cm-editor {
			height: 100% !important;
		}

		.cm-scroller {
			overflow: auto !important;
		}

		.no-scrollbar::-webkit-scrollbar {
			display: none;
		}

		.no-scrollbar {
			-ms-overflow-style: none;
			scrollbar-width: none;
		}

		.transition-all {
			transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
		}
	</style>
</head>

<body class="h-screen flex flex-col overflow-hidden transition-colors duration-200">
	<header class="app-header z-50 shrink-0">
		<div class="app-header-row">
			<div class="flex items-center gap-2">
				<a href="index.html" class="btn-icon" title="Home">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
						</path>
					</svg>
				</a>
				<div class="p-1.5 rounded-lg shadow-sm"
					style="background: linear-gradient(to bottom right, #2563eb, #4338ca);">
					<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
						</path>
					</svg>
				</div>
				<h1 class="text-sm font-bold uppercase tracking-tight sm:text-lg sm:normal-case">MD Explorer</h1>
			</div>

			<div class="flex items-center gap-1.5 sm:gap-2">
				<input type="file" id="file-input" multiple accept=".md,.markdown,.txt,text/markdown,text/plain"
					class="hidden" />
				<button id="open-btn"
					class="btn btn-gradient-blue btn-sm sm:px-4 sm:py-2 sm:text-sm shadow-sm hover:shadow-md transition-all transform active:scale-95">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
					</svg>
					<span class="hidden sm:inline" id="btn-text">Open</span>
				</button>
				<button id="paste-btn" class="btn btn-sm sm:px-4 sm:py-2 sm:text-sm">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
						</path>
					</svg>
					<span class="hidden sm:inline">Paste</span>
				</button>
				<div class="save-dropdown-wrapper" id="save-dropdown-wrapper">
					<button id="save-main-btn"
						class="save-main-btn btn btn-gradient-green btn-sm sm:px-4 sm:py-2 sm:text-sm shadow-sm hover:shadow-md transition-all transform active:scale-95">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
						</svg>
						<span class="hidden sm:inline">Save</span>
					</button>
					<button id="save-chevron-btn"
						class="save-chevron-btn btn btn-gradient-green btn-sm sm:py-2 sm:text-sm shadow-sm hover:shadow-md transition-all transform active:scale-95">
						<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
							</path>
						</svg>
					</button>
					<div id="save-dropdown-menu" class="save-dropdown-menu">
						<button class="save-dropdown-item" onclick="saveMarkdownOnly()">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
							</svg>
							Save Markdown
						</button>
						<button class="save-dropdown-item" onclick="saveMarkdownWithComments()">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
								</path>
							</svg>
							Save MD + Comments
						</button>
						<div class="save-dropdown-divider"></div>
						<button class="save-dropdown-item" onclick="copyMarkdownOnly()">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
								</path>
							</svg>
							Copy Markdown
						</button>
						<button class="save-dropdown-item" onclick="copyMarkdownWithComments()">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3">
								</path>
							</svg>
							Copy MD + Comments
						</button>
						<div class="save-dropdown-divider"></div>
						<button class="save-dropdown-item" onclick="exportComments(false)">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
								</path>
							</svg>
							Export Comments
						</button>
						<button class="save-dropdown-item" onclick="exportComments(true)">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z">
								</path>
							</svg>
							Export with Quotes
						</button>
						<div class="save-dropdown-divider"></div>
						<button class="save-dropdown-item" onclick="copyCommentsToClipboard(false)">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2">
								</path>
							</svg>
							Copy Comments
						</button>
						<button class="save-dropdown-item" onclick="copyCommentsToClipboard(true)">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z">
								</path>
							</svg>
							Copy with Quotes
						</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Bottom Row: Secondary Toolbar (Responsive) -->
		<div class="app-header-toolbar">
			<div
				class="flex items-center border border-[var(--border-default)] rounded-md overflow-hidden bg-[var(--bg-surface)] shrink-0">
				<button onclick="changeZoom(-0.1)"
					class="px-2 py-1 hover:bg-[var(--bg-surface-hover)] border-r border-[var(--border-default)] transition-colors">−</button>
				<span id="zoom-level" class="px-2 text-[10px] font-mono min-w-[2.5rem] text-center">100%</span>
				<button onclick="changeZoom(0.1)"
					class="px-2 py-1 hover:bg-[var(--bg-surface-hover)] border-l border-[var(--border-default)] transition-colors">+</button>
				<button onclick="toggleWrap()" id="wrap-toggle-btn" title="Toggle Line Wrap"
					class="px-2 py-1 hover:bg-[var(--bg-surface-hover)] border-l border-[var(--border-default)] transition-colors text-[10px] font-bold">W</button>
			</div>

			<div id="edit-controls" class="flex items-center gap-2 shrink-0">
				<button onclick="resolveNewlines()" title="Resolve Newlines and Unicode Escapes"
					class="btn btn-sm">Resolve Escapes</button>
				<button id="toggle-edit-btn" class="btn btn-sm">
					<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
						</path>
					</svg>
					<span id="toggle-text">View</span>
				</button>
			</div>
		</div>
	</header>

	<div class="flex-1 flex overflow-hidden">
		<aside id="sidebar" class="w-72 app-sidebar flex flex-col shrink-0 hidden md:flex">
			<!-- Documents Panel (collapsed by default) -->
			<div id="documents-panel" class="sidebar-panel collapsed">
				<div class="sidebar-panel-header" data-panel="documents">
					<svg class="sidebar-panel-caret" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
					</svg>
					<span class="sidebar-panel-title">Documents</span>
					<button id="close-sidebar" class="md:hidden btn-icon ml-auto">
						<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M6 18L18 6M6 6l12 12"></path>
						</svg>
					</button>
				</div>
				<div class="sidebar-panel-body">
					<div id="file-list" class="flex-1 overflow-y-auto p-2 space-y-0.5">
						<div class="text-[var(--text-tertiary)] text-xs italic p-8 text-center">Open files to begin.
						</div>
					</div>
				</div>
			</div>

			<div class="sidebar-resizer" data-resizer="0"></div>

			<!-- Outline Panel -->
			<div id="outline-panel" class="sidebar-panel">
				<div class="sidebar-panel-header" data-panel="outline">
					<svg class="sidebar-panel-caret" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
					</svg>
					<span class="sidebar-panel-title">Outline</span>
				</div>
				<div class="sidebar-panel-body">
					<div id="outline-list" class="flex-1 overflow-y-auto p-2 space-y-0.5 no-scrollbar">
						<div class="text-[var(--text-tertiary)] text-xs italic p-8 text-center">Select a document.</div>
					</div>
				</div>
			</div>

			<div class="sidebar-resizer" data-resizer="1"></div>

			<!-- Comments Panel -->
			<div id="sidebar-comments-panel" class="sidebar-panel">
				<div class="sidebar-panel-header" data-panel="sidebar-comments">
					<svg class="sidebar-panel-caret" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
					</svg>
					<span class="sidebar-panel-title">Comments</span>
					<span id="sidebar-comment-count" class="sidebar-panel-badge"></span>
				</div>
				<div class="sidebar-panel-body">
					<div id="sidebar-comments-list" class="flex-1 overflow-y-auto p-2 space-y-0.5 no-scrollbar">
						<div class="text-[var(--text-tertiary)] text-xs italic p-8 text-center">No comments yet.</div>
					</div>
				</div>
			</div>
		</aside>

		<main class="flex-1 overflow-hidden bg-[var(--bg-root)] relative">
			<div id="editor-container" class="w-full h-full bg-[var(--bg-surface)] px-0 sm:px-4 py-1 sm:py-4">
				<div id="editor" class="h-full border border-[var(--border-default)] rounded-lg overflow-hidden">
				</div>
			</div>
			<article id="content"
				class="prose dark:prose-invert hidden bg-[var(--bg-surface)] p-4 sm:p-8 md:p-16 h-full border-x border-transparent sm:border-[var(--border-default)] overflow-y-auto overflow-x-hidden w-full">
			</article>
		</main>
	</div>

	<!-- Comment System UI -->
	<button id="comment-bubble" class="comment-bubble-btn"> Comment</button>

	<div id="comment-panel" class="comment-panel">
		<div id="comment-panel-quote" class="comment-panel-quote"></div>
		<textarea id="comment-panel-input" class="comment-panel-textarea" placeholder="Write your comment…"></textarea>
		<div class="comment-panel-actions">
			<button id="comment-cancel-btn" class="btn btn-sm">Cancel</button>
			<button id="comment-save-btn" class="btn btn-gradient-blue btn-sm shadow-sm">Save Comment</button>
		</div>
	</div>

	<div id="comment-tooltip" class="comment-tooltip">
		<button id="comment-tooltip-close" class="comment-tooltip-delete">×</button>
		<div id="comment-tooltip-text" class="comment-tooltip-text"></div>
		<div id="comment-tooltip-meta" class="comment-tooltip-meta"></div>
	</div>

	<div id="comment-toast" class="comment-toast"></div>

	<button id="mobile-menu" class="fixed bottom-6 right-6 md:hidden text-white p-4 rounded-full shadow-2xl z-50"
		style="background: var(--accent);">
		<svg id="menu-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
			<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
		</svg>
	</button>

	<script src="vendor/cm-md-bundle.js"></script>
	<script>
		const { EditorView, basicSetup, markdown, oneDark } = window.CM_MD;

		const openBtn = document.getElementById("open-btn");
		const pasteBtn = document.getElementById("paste-btn");
		const fileInput = document.getElementById("file-input");
		const fileListContainer = document.getElementById("file-list");
		const contentArea = document.getElementById("content");
		const editorContainer = document.getElementById("editor-container");
		const editorEl = document.getElementById("editor");
		const emptyState = document.getElementById("empty-state");
		const sidebar = document.getElementById("sidebar");
		const mobileMenu = document.getElementById("mobile-menu");
		const closeSidebar = document.getElementById("close-sidebar");
		const zoomLabel = document.getElementById("zoom-level");
		const editControls = document.getElementById("edit-controls");
		const toggleEditBtn = document.getElementById("toggle-edit-btn");
		const toggleText = document.getElementById("toggle-text");
		let loadedFiles = new Map();
		let currentZoom = 1.0;
		var isEditing = true;
		var currentFileName = "Untitled.md";
		var editor = null;
		let lineWrap = true;
		const isFileSystemApiSupported = "showDirectoryPicker" in window;

		// Initialize CodeMirror
		function initEditor(initialValue = "") {
			if (editor) {
				editor.destroy();
			}

			const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
			const extensions = [
				basicSetup,
				markdown(),
				isDark ? oneDark : [],
				EditorView.theme({
					"&": { height: "100%", fontSize: "var(--editor-font-size)", backgroundColor: "var(--bg-surface)" },
					".cm-scroller": { overflow: "auto", fontFamily: "var(--font-mono)" },
					".cm-content": { fontWeight: "400 !important", fontFamily: "var(--font-mono) !important" },
					".cm-line": { fontWeight: "400 !important" },
					".ͼ1 .cm-keyword": { fontWeight: "500 !important" },
					".ͼ1 .cm-variableName": { fontWeight: "400 !important" },
					".ͼ1 .cm-typeName": { fontWeight: "500 !important" },
					".cm-gutters": { backgroundColor: "var(--bg-surface)", borderRightColor: "var(--border-subtle)", color: "var(--text-tertiary)" }
				}),
				EditorView.updateListener.of((update) => {
					if (update.docChanged) {
						updatePreview();
					}
				})
			];

			if (lineWrap) {
				extensions.push(EditorView.lineWrapping);
			}

			editor = new EditorView({
				doc: initialValue,
				extensions: extensions,
				parent: editorEl
			});
		}

		function updatePreview() {
			if (editor) {
				const text = editor.state.doc.toString();
				contentArea.innerHTML = DOMPurify.sanitize(marked.parse(text));
				updateOutline();
				Prism.highlightAllUnder(contentArea);
				if (window.MdvComments) MdvComments.applyHighlights();
			}
		}

		function updateOutline() {
			if (!editor) return;
			const text = editor.state.doc.toString();
			const outlineList = document.getElementById("outline-list");
			const headings = [];

			const lines = text.split("\n");
			lines.forEach((line, index) => {
				const match = line.match(/^(#{1,6})\s+(.+)$/);
				if (match) {
					headings.push({ level: match[1].length, text: match[2].trim(), line: index });
				}
			});

			if (headings.length === 0) {
				outlineList.innerHTML = '<div class="text-gray-400 text-xs italic p-8 text-center">No headings found.</div>';
				return;
			}

			outlineList.innerHTML = headings.map(h => `
				<button 
					onclick="scrollToHeading(${h.line}, '${h.text.replace(/'/g, "\\'")}')"
					class="w-full text-left px-3 py-1.5 rounded-md text-[11px] transition-all truncate hover:bg-[var(--bg-surface-hover)]"
					style="padding-left: ${h.level * 0.75}rem; color: var(--text-secondary);"
				>
					${h.text}
				</button>
			`).join("");
		}

		window.scrollToHeading = (line, originalText) => {
			if (isEditing && editor) {
				const pos = editor.state.doc.line(line + 1).from;
				editor.dispatch({
					selection: { anchor: pos, head: pos },
					scrollIntoView: true
				});
				editor.focus();
			} else {
				// Find heading in contentArea
				const headers = contentArea.querySelectorAll("h1, h2, h3, h4, h5, h6");
				for (const h of headers) {
					if (h.textContent.trim() === originalText) {
						h.scrollIntoView({ behavior: "smooth", block: "start" });
						break;
					}
				}
			}
		};

		window.toggleWrap = function () {
			lineWrap = !lineWrap;
			const btn = document.getElementById("wrap-toggle-btn");
			if (lineWrap) {
				btn.style.background = "var(--accent)";
				btn.style.color = "#fff";
			} else {
				btn.style.background = "";
				btn.style.color = "";
			}
			if (editor) {
				const currentDoc = editor.state.doc.toString();
				initEditor(currentDoc);
			}
		};

		// Initialize wrap button state
		const wrapBtn = document.getElementById("wrap-toggle-btn");
		wrapBtn.style.background = "var(--accent)";
		wrapBtn.style.color = "#fff";

		const toggleSidebar = () => {
			document.body.classList.toggle("mobile-sidebar-active");
			const isActive = document.body.classList.contains("mobile-sidebar-active");
			document.getElementById("menu-icon").innerHTML = isActive
				? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>'
				: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>';
		};

		mobileMenu.onclick = toggleSidebar;
		closeSidebar.onclick = toggleSidebar;

		if (isFileSystemApiSupported) {
			document.getElementById("btn-text").textContent = "Directory";
		}

		const mathExtension = {
			name: 'math',
			level: 'inline',
			start(src) { return src.indexOf('$'); },
			tokenizer(src, tokens) {
				const blockRule = /^\$\$\n?([\s\S]+?)\n?\$\$/;
				const inlineRule = /^\$((?:\S)|(?:\S[\s\S]*?\S))\$(?!\d)/;

				let match;
				if (match = blockRule.exec(src)) {
					return {
						type: 'math',
						raw: match[0],
						text: match[1].trim(),
						displayMode: true
					};
				} else if (match = inlineRule.exec(src)) {
					return {
						type: 'math',
						raw: match[0],
						text: match[1].trim(),
						displayMode: false
					};
				}
			},
			renderer(token) {
				try {
					return katex.renderToString(token.text, {
						displayMode: token.displayMode,
						throwOnError: false
					});
				} catch (e) {
					console.error('KaTeX error:', e);
					return token.raw;
				}
			}
		};

		marked.use({ extensions: [mathExtension] });

		marked.setOptions({
			highlight: (code, lang) => {
				if (Prism.languages[lang]) {
					return Prism.highlight(code, Prism.languages[lang], lang);
				}
				return code;
			},
			breaks: true,
			gfm: true
		});

		window.changeZoom = function (delta) {
			currentZoom = Math.min(Math.max(0.5, currentZoom + delta), 2.5);
			document.documentElement.style.setProperty("--reader-font-size", `${currentZoom}rem`);
			zoomLabel.textContent = `${Math.round(currentZoom * 100)}%`;
		};

		async function handleFileSelect(files) {
			fileListContainer.innerHTML = "";
			loadedFiles.clear();
			Array.from(files).forEach((file) => {
				const lower = file.name.toLowerCase();
				if (lower.endsWith(".md") || lower.endsWith(".markdown") || lower.endsWith(".txt")) {
					loadedFiles.set(file.name, file);
					renderFileListItem(file.name);
				}
			});
			if (loadedFiles.size === 0) {
				fileListContainer.innerHTML = '<div class="p-4 text-center text-xs text-red-500">No Markdown or text files found.</div>';
			} else if (loadedFiles.size === 1) {
				const firstBtn = fileListContainer.querySelector('.file-item');
				if (firstBtn) firstBtn.click();
			}
		}

		function renderFileListItem(name) {
			const btn = document.createElement("button");
			btn.className = "file-item";
			btn.innerHTML = `<svg class="w-4 h-4 shrink-0" style="color:var(--text-tertiary)" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 012-2h4.586A1 1 0 0111.293 2.707l2 2A1 1 0 0113.586 6H16a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"></path></svg><span class="truncate">${name}</span>`;
			btn.onclick = () => displayFile(name, btn);
			fileListContainer.appendChild(btn);
		}

		async function displayFile(name, element) {
			const file = loadedFiles.get(name);
			let text = await (file.text ? file.text() : readFileAsText(file));
			currentFileName = name;

			// Parse embedded comments if present
			if (window.MdvComments) {
				const parsed = MdvComments.parseFromMarkdown(text);
				text = parsed.markdown;
				MdvComments.setComments(parsed.comments);
			}

			document.querySelectorAll(".file-item").forEach((el) => el.classList.remove("active"));
			if (element) element.classList.add("active");

			// Initialize editor with current text
			initEditor(text);
			updatePreview();

			if (window.innerWidth < 1024) {
				isEditing = false;
				updateViewMode();
			}

			if (window.innerWidth < 768 && document.body.classList.contains("mobile-sidebar-active")) toggleSidebar();
		}

		function updateViewMode() {
			if (isEditing) {
				contentArea.classList.add("hidden");
				editorContainer.classList.remove("hidden");
				toggleText.textContent = "View";
				toggleEditBtn.style.background = "var(--accent)";
				toggleEditBtn.style.color = "#fff";
				toggleEditBtn.style.borderColor = "var(--accent)";
			} else {
				contentArea.classList.remove("hidden");
				editorContainer.classList.add("hidden");
				toggleText.textContent = "Edit";
				toggleEditBtn.style.background = "";
				toggleEditBtn.style.color = "";
				toggleEditBtn.style.borderColor = "";
			}
			updatePreview();
		}

		toggleEditBtn.onclick = () => {
			isEditing = !isEditing;
			updateViewMode();
		};

		window.addEventListener('resize', updateViewMode);



		function readFileAsText(file) {
			return new Promise((resolve) => {
				const reader = new FileReader();
				reader.onload = (e) => resolve(e.target.result);
				reader.readAsText(file);
			});
		}

		openBtn.onclick = async () => {
			if (isFileSystemApiSupported) {
				try {
					const dirHandle = await window.showDirectoryPicker();
					fileListContainer.innerHTML = "";
					loadedFiles.clear();
					for await (const entry of dirHandle.values()) {
						if (entry.kind === "file" && (entry.name.toLowerCase().endsWith(".md") || entry.name.toLowerCase().endsWith(".markdown"))) {
							const file = await entry.getFile();
							loadedFiles.set(entry.name, file);
							renderFileListItem(entry.name);
						}
					}
				} catch (e) {
					if (e.name !== "AbortError") console.error(e);
				}
			} else {
				fileInput.click();
			}
		};

		if (pasteBtn) {
			pasteBtn.onclick = async () => {
				try {
					let text = await navigator.clipboard.readText();
					if (text !== undefined && text !== null) {
						// Parse embedded comments if present
						if (window.MdvComments) {
							const parsed = MdvComments.parseFromMarkdown(text);
							text = parsed.markdown;
							MdvComments.setComments(parsed.comments);
						}
						if (!editor) {
							initEditor(text);
						} else {
							const transaction = editor.state.update({
								changes: { from: 0, to: editor.state.doc.length, insert: text },
								selection: { anchor: text.length }
							});
							editor.dispatch(transaction);
						}

						if (!editor.hasFocus) {
							setTimeout(() => editor.focus(), 10);
						}
						updatePreview();
					}
				} catch (err) {
					console.error('Failed to read clipboard contents: ', err);
					alert("Clipboard permission denied or unsupported");
				}
			};
		}

		fileInput.onchange = (e) => handleFileSelect(e.target.files);

		// ── Sidebar Panel Toggle & Resize ──────────────────
		(function () {
			const sidebarEl = document.getElementById("sidebar");
			const panels = Array.from(sidebarEl.querySelectorAll(".sidebar-panel"));
			const resizers = Array.from(sidebarEl.querySelectorAll(".sidebar-resizer"));

			// Toggle panel collapse
			panels.forEach(panel => {
				const header = panel.querySelector(".sidebar-panel-header");
				header.addEventListener("click", (e) => {
					// Don't toggle when clicking the close-sidebar button
					if (e.target.closest('#close-sidebar')) return;
					panel.classList.toggle("collapsed");
				});
			});

			// Resizer drag logic
			let activeResizer = null;
			let resizerAbove = null;
			let resizerBelow = null;
			let startY = 0;
			let startAboveH = 0;
			let startBelowH = 0;

			function getExpandedNeighbors(resizerEl) {
				let above = null, below = null;
				let prev = resizerEl.previousElementSibling;
				while (prev) {
					if (prev.classList.contains('sidebar-panel') && !prev.classList.contains('collapsed')) {
						above = prev; break;
					}
					prev = prev.previousElementSibling;
				}
				let next = resizerEl.nextElementSibling;
				while (next) {
					if (next.classList.contains('sidebar-panel') && !next.classList.contains('collapsed')) {
						below = next; break;
					}
					next = next.nextElementSibling;
				}
				return { above, below };
			}

			resizers.forEach(r => {
				r.addEventListener("mousedown", (e) => {
					const neighbors = getExpandedNeighbors(r);
					if (!neighbors.above || !neighbors.below) return;
					activeResizer = r;
					resizerAbove = neighbors.above;
					resizerBelow = neighbors.below;
					startY = e.clientY;
					startAboveH = resizerAbove.getBoundingClientRect().height;
					startBelowH = resizerBelow.getBoundingClientRect().height;
					document.body.style.cursor = "ns-resize";
					document.body.classList.add("select-none");
					e.preventDefault();
				});
			});

			document.addEventListener("mousemove", (e) => {
				if (!activeResizer) return;
				const delta = e.clientY - startY;
				const newAbove = Math.max(40, startAboveH + delta);
				const newBelow = Math.max(40, startBelowH - delta);
				resizerAbove.style.flex = `0 0 ${newAbove}px`;
				resizerBelow.style.flex = `0 0 ${newBelow}px`;
			});

			document.addEventListener("mouseup", () => {
				if (activeResizer) {
					activeResizer = null;
					resizerAbove = null;
					resizerBelow = null;
					document.body.style.cursor = "";
					document.body.classList.remove("select-none");
				}
			});
		})();

		window.resolveNewlines = function () {
			if (editor) {
				const currentText = editor.state.doc.toString();
				const newText = currentText.replace(/\\n/g, '\n')
					.replace(/\\r/g, '\r')
					.replace(/\\t/g, '\t')
					.replace(/\\"/g, '"')
					.replace(/\\u([0-9a-fA-F]{4})/g, (match, grp) => {
						return String.fromCharCode(parseInt(grp, 16));
					});
				if (currentText !== newText) {
					editor.dispatch({
						changes: { from: 0, to: currentText.length, insert: newText }
					});
				}
			}
		};

		// Initial setup
		initEditor("");
		updateViewMode();
	</script>
	<script src="mdv-comments.js"></script>
	<script>MdvComments.init();</script>
</body>
