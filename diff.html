<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Diff Explorer — Dylen Text Tools</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" href="favicon.ico">
  <meta name="description" content="Compare two files or text snippets side-by-side with character-level highlighting and a live symbol outline. Runs entirely in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/tailwind.min.css">
  <link rel="stylesheet" href="theme.css">

  <style>
    /* ── Diff colour tokens ───────────────────────────────── */
    :root {
      --diff-add-line:  rgb(230, 244, 236);
      --diff-add-char:  rgb(157, 219, 180);
      --diff-del-line:  rgb(252, 232, 232);
      --diff-del-char:  rgb(245, 160, 160);
      --diff-move-from: rgb(240, 234, 255);
      --diff-move-to:   rgb(232, 240, 255);
      --diff-move-char: rgb(196, 181, 253);
      --diff-add-gutter:rgb(34, 197, 94);
      --diff-del-gutter:rgb(239, 68, 104);
      --bg-flash: rgb(237, 233, 254);
      --bg-editor: rgb(255, 255, 255);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --diff-add-line:  rgb(19, 42, 30);
        --diff-add-char:  rgb(26, 82, 48);
        --diff-del-line:  rgb(42, 19, 19);
        --diff-del-char:  rgb(82, 26, 26);
        --diff-move-from: rgb(28, 16, 53);
        --diff-move-to:   rgb(13, 21, 53);
        --diff-move-char: rgb(109, 40, 217);
        --diff-add-gutter:rgb(74, 222, 128);
        --diff-del-gutter:rgb(248, 113, 113);
        --bg-flash: rgb(46, 16, 101);
        --bg-editor: rgb(40, 44, 52); /* Matches CodeMirror OneDark background */
      }
    }

    /* ── Diff line / char marks (applied by StateField) ─── */
    .diff-add-line   { background: var(--diff-add-line)  !important; display: block; }
    .diff-del-line   { background: var(--diff-del-line)  !important; display: block; }
    .diff-add-char   { background: var(--diff-add-char);  border-radius: 2px; }
    .diff-del-char   { background: var(--diff-del-char);  border-radius: 2px; }
    .diff-move-from  { background: var(--diff-move-from) !important; display: block; }
    .diff-move-to    { background: var(--diff-move-to)   !important; display: block; }
    .diff-move-char  { background: var(--diff-move-char);  border-radius: 2px; }



    /* ── CM sizing ────────────────────────────────────────── */
    .editor-wrap     { flex: 1 1 0%; min-width: 0; min-height: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
    .editor-wrap > .cm-editor { flex: 1 1 0% !important; min-height: 0 !important; height: 100% !important; display: flex !important; flex-direction: column !important; }
    .cm-scroller     { flex: 1 1 0% !important; min-height: 0 !important; height: 100% !important; overflow: auto !important; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }

    /* CodeMirror Theme Custom Matches */
    .cm-editor.theme-light { background: #ffffff; color: #1a1a1a; }
    .cm-editor.theme-dark { background: rgb(40, 44, 52); color: #abb2bf; }
    .cm-editor .cm-content { color: inherit; }

    /* ── Outline sidebar force-hide override ─────────────── */
    body:not(.mobile-sidebar-active) #outline-sidebar.outline-closed { display: none !important; }

    /* ── Mobile sidebar overlay ───────────────────────────── */
    @media (max-width: 767px) {
      .mobile-sidebar-active #outline-sidebar {
        display: flex !important;
        position: fixed; inset: 0; z-index: 60; width: 100%; height: 100%;
      }
    }

    /* ── Scrollbar de-emphasis ────────────────────────────── */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── Outline flash animation ──────────────────────────── */
    @keyframes flash-bg {
      0%   { background-color: var(--bg-flash); }
      100% { background-color: var(--bg-editor); }
    }
    .outline-flash { animation: flash-bg 700ms ease-out; }

    /* ── Drag-over highlight ──────────────────────────────── */
    body.drop-active { outline: 2px dashed var(--accent); outline-offset: -4px; }

    /* ── Stat badges ──────────────────────────────────────── */
    :root {
      --stat-add-bg: rgb(220, 252, 231);
      --stat-add-text: rgb(22, 101, 52);
      --stat-del-bg: rgb(254, 226, 226);
      --stat-del-text: rgb(153, 27, 27);
      --text-stat-muted: rgb(156, 163, 175);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --stat-add-bg: rgb(20, 83, 45);
        --stat-add-text: rgb(134, 239, 172);
        --stat-del-bg: rgb(69, 10, 10);
        --stat-del-text: rgb(252, 165, 165);
        --text-stat-muted: rgb(107, 114, 128);
      }
    }
    .stat-add { background: var(--stat-add-bg); color: var(--stat-add-text); }
    .stat-del { background: var(--stat-del-bg); color: var(--stat-del-text); }

    /* ── Header Custom Layouts ─────────────────────────────── */
    .header-logo-bg {
      background: linear-gradient(to bottom right, #8b5cf6, #5b21b6);
    }

    /* ── Segmented Control ────────────────────────────────── */
    .segment-control {
      display: inline-flex;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--bg-surface-raised);
      padding: 2px;
      gap: 2px;
    }
    .segment-btn {
      border: none;
      background: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xs);
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .segment-btn:hover {
      color: var(--text-primary);
    }
    .segment-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    /* ── Outline Indentation ──────────────────────────────── */
    .outline-indent-1 { padding-left: 8px; }
    .outline-indent-2 { padding-left: 18px; }
    .outline-indent-3 { padding-left: 28px; }
    .outline-indent-4 { padding-left: 38px; }
    .outline-indent-5 { padding-left: 48px; }
    .outline-indent-6 { padding-left: 58px; }

    /* ── Outline Icon Color ───────────────────────────────── */
    .outline-icon {
      color: var(--text-tertiary);
    }

    /* ── Empty State ──────────────────────────────────────── */
    .empty-state-top {
      top: 96px;
    }

  </style>
</head>

<body class="h-screen flex flex-col overflow-hidden font-sans">

<!-- ══ HEADER ═══════════════════════════════════════════════ -->
<header class="app-header z-50 shrink-0">

  <!-- Row 1 -->
  <div class="app-header-row">
    <!-- Left Edge: Home navigation icon -->

      <div class="app-header-logo-badge">

      </div>
      <h1 class="text-base sm:text-lg font-bold tracking-tight text-[var(--text-primary)]">Diff Explorer</h1>
    </div>

    <!-- Right Edge: Export & Clear Actions -->
    <div class="flex items-center gap-1.5 justify-end">
      <input type="file" id="file-input-left" class="hidden">
      <input type="file" id="file-input-right" class="hidden">

      <div class="relative" id="dd-export">
        <button id="btn-export" class="btn btn-sm">
          <i class="ph ph-export text-base"></i>

          <i class="ph ph-caret-down text-xs"></i>

        <div id="dd-export-menu" class="dropdown-menu">
          <button id="btn-copy-patch" class="dropdown-item text-blue-600 dark:text-blue-400">
            <i class="ph ph-copy text-base"></i>

          </button>
          <button id="btn-save-html" class="dropdown-item text-green-600 dark:text-green-400">
            <i class="ph ph-floppy-disk text-base"></i>
            Save HTML Report
          </button>

        <i class="ph ph-sidebar-simple text-base"></i>

    <!-- Middle Scroll Track: View Toggle, Lang, Options, Typeset -->
    <div class="toolbar-middle-scroll">

        <button id="btn-view-split" onclick="setView('split')" class="segment-btn">
          <i class="ph ph-columns text-base"></i>
          <span class="btn-text">Split</span>
        </button>
        <button id="btn-view-unified" onclick="setView('unified')" class="segment-btn">

      <div class="flex items-center gap-1.5 shrink-0">
        <span class="text-xs text-[var(--text-secondary)]">Lang:</span>

      <div class="relative shrink-0" id="dd-options">
        <button id="btn-options" class="btn btn-sm">

          <i class="ph ph-caret-down text-xs"></i>

        <div id="dd-options-menu" class="dropdown-menu p-2 space-y-0.5">

          </label>
          <label class="dropdown-item cursor-pointer">

          <label class="dropdown-item cursor-pointer">

<div class="flex-1 flex overflow-hidden">

<!-- ══ SCRIPTS ═══════════════════════════════════════════════ -->
<script src="vendor/cm-diff-bundle.js"></script>
<script>
'use strict';

const {
  EditorView, EditorState, basicSetup, Compartment,
  oneDark,
  javascript, json, python, markdown, css, html, sql, xml,
  diff_match_patch,
  Decoration, ViewPlugin, StateEffect, StateField,
} = window.CM_DIFF;

// ── decoration setup ────────────────────────────────────────
const setDecosEffect = StateEffect.define();
const decoField = StateField.define({
  create: () => Decoration.none,
  update(decos, tr) {
    decos = decos.map(tr.changes);
    for (const e of tr.effects) if (e.is(setDecosEffect)) decos = e.value;
    return decos;
  },
  provide: f => EditorView.decorations.from(f),
});

// ── compartments ────────────────────────────────────────────
const themeL = new Compartment(), themeR = new Compartment();
const langL  = new Compartment(), langR  = new Compartment();
const wrapL  = new Compartment(), wrapR  = new Compartment();

// ── state ───────────────────────────────────────────────────
let editorL = null, editorR = null;
let viewMode = window.innerWidth < 768 ? 'unified' : 'split';
let outlineOpen = true;
let diffTimer = null;
let syncingScroll = false;
let currentLang = 'auto';
let opts = { ignoreWS: false, caseInsensitive: false, normalizeTypo: false, wordWrap: false };
const STORAGE = window.name && window.name.startsWith('tab_') ? 'difftool-v2_' + window.name : 'difftool-v2';

const isDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
const theme  = () => isDark() ? oneDark : [];

// ── language detection ──────────────────────────────────────
const EXT_MAP = {
  js:'javascript', jsx:'javascript', mjs:'javascript', cjs:'javascript',
  ts:'javascript', tsx:'javascript',
  json:'json', jsonc:'json',
  py:'python',
  html:'html', htm:'html',
  css:'css', scss:'css',
  sql:'sql',
  xml:'xml', svg:'xml',
  md:'markdown', mdx:'markdown',
};

function langForName(name) {
  if (!name) return null;
  return EXT_MAP[name.split('.').pop().toLowerCase()] || null;
}

function langExt(name) {
  const k = currentLang === 'auto' ? langForName(name) : currentLang;
  switch (k) {
    case 'javascript': return javascript({ typescript: true });
    case 'json':       return json();
    case 'python':     return python();
    case 'html':       return html();
    case 'css':        return css();
    case 'sql':        return sql();
    case 'xml':        return xml();
    case 'markdown':   return markdown();
    default:           return [];
  }
}

// ── initialization ──────────────────────────────────────────

function createEditors(leftDoc = '', rightDoc = '') {
  // Destroy existing
  if (editorL) { editorL.destroy(); editorL = null; }
  if (editorR) { editorR.destroy(); editorR = null; }

  const leftName  = document.getElementById('lbl-left').textContent;
  const rightName = document.getElementById('lbl-right').textContent;

  editorL = new EditorView({
    state: EditorState.create({
      doc: leftDoc,
      extensions: [
        basicSetup,
        themeL.of(theme()),
        langL.of(langExt(leftName || rightName)),
        wrapL.of(opts.wordWrap ? EditorView.lineWrapping : []),
        decoField,
        EditorView.theme({ '&':{ height:'100%', width:'100%' }, '.cm-scroller':{ overflow:'auto' } }),
        EditorView.updateListener.of(v => { if (v.docChanged) scheduleDiff(); }),
        EditorView.domEventHandlers({ scroll: syncScrollFromLeft }),
      ],
    }),
    parent: document.getElementById('editor-left'),
  });

  editorR = new EditorView({
    state: EditorState.create({
      doc: rightDoc,
      extensions: [
        basicSetup,
        themeR.of(theme()),
        langR.of(langExt(rightName || leftName)),
        wrapR.of(opts.wordWrap ? EditorView.lineWrapping : []),
        decoField,
        EditorView.theme({ '&':{ height:'100%', width:'100%' }, '.cm-scroller':{ overflow:'auto' } }),
        EditorView.updateListener.of(v => { if (v.docChanged) scheduleDiff(); }),
        EditorView.domEventHandlers({ scroll: syncScrollFromRight }),
      ],
    }),
    parent: document.getElementById('editor-right'),
  });

  // Apply visual theme identifiers to editor containers
  const updateEditorThemes = () => {
    const isDarkMode = isDark();
    [editorL, editorR].forEach(ed => {
      if (!ed) return;
      ed.dom.classList.toggle('theme-dark', isDarkMode);
      ed.dom.classList.toggle('theme-light', !isDarkMode);
    });
  };
  updateEditorThemes();

  updateEmptyState();
  scheduleDiff();
  updateTabTitle();
}

// ── scroll sync ─────────────────────────────────────────────
function syncScrollFromLeft() {
  if (syncingScroll) return;
  syncingScroll = true;
  requestAnimationFrame(() => {
    const sl = editorL?.scrollDOM, sr = editorR?.scrollDOM;
    if (sl && sr) sr.scrollTop = sl.scrollTop;
    syncingScroll = false;
  });
}
function syncScrollFromRight() {
  if (syncingScroll) return;
  syncingScroll = true;
  requestAnimationFrame(() => {
    const sl = editorL?.scrollDOM, sr = editorR?.scrollDOM;
    if (sl && sr) sl.scrollTop = sr.scrollTop;
    syncingScroll = false;
  });
}

// ── normalise ───────────────────────────────────────────────
function norm(text) {
  if (opts.normalizeTypo) {
    // Normalize typographic punctuation to plain ASCII equivalents
    text = text
      .replace(/[\u2018\u2019\u201A\u201B\u2032\u2035\u02BC]/g, "'")
      .replace(/[\u201C\u201D\u201E\u201F\u2033\u2036]/g, '"')
      .replace(/[\u2013\u2014\u2015\u2212]/g, '-')
      .replace(/\u2026/g, '...')
      .replace(/[\u00A0\u202F\u2009\u2008]/g, ' ');
  }
  if (opts.ignoreWS) {
    // Trim leading/trailing whitespace per line and collapse internal whitespace
    text = text.split('\n').map(l => l.trim().replace(/[ \t]+/g, ' ')).join('\n');
  }
  if (opts.caseInsensitive) text = text.toLowerCase();
  return text;
}

// ── apply typography ────────────────────────────────────────
function applyTypography(text) {
  let ellipses = 0, dashes = 0, dquotes = 0, squotes = 0;

  let t = text
    // Ellipsis: ... → …
    .replace(/\.\.\.(?!\.)/g, (m) => { ellipses++; return '\u2026'; })
    // Em-dash: --- or -- → —
    .replace(/---/g, (m) => { dashes++; return '\u2014'; })
    .replace(/--/g,  (m) => { dashes++; return '\u2014'; })
    // Opening double quote: after start-of-line, whitespace, or open bracket
    .replace(/(^|[\s\(\[\{\u2014])"(?=[^\s])/gm, (m, p1) => { dquotes++; return p1 + '\u201C'; })
    // Remaining " → closing double quote
    .replace(/"/g, (m) => { dquotes++; return '\u201D'; })
    // Apostrophes in contractions (it's, don't, we're)
    .replace(/(\w)'(\w)/g, (m, a, b) => { squotes++; return a + '\u2019' + b; })
    // Opening single quote: after start-of-line, whitespace, open bracket
    .replace(/(^|[\s\(\[\{\u2014])'(?=[^\s])/gm, (m, p1) => { squotes++; return p1 + '\u2018'; })
    // Remaining ' → closing single quote / apostrophe
    .replace(/'/g, (m) => { squotes++; return '\u2019'; });

  return { result: t, counts: { ellipses, dashes, dquotes, squotes } };
}

// ── line count helper ───────────────────────────────────────
function lineCount(text) {
  if (!text) return 0;
  const p = text.split('\n');
  return (p.length > 1 && p[p.length - 1] === '') ? p.length - 1 : p.length;
}

// ── move detection ───────────────────────────────────────────
function detectMovedBlocks(lineDiffs) {
  const delSegs = [], insSegs = [];
  let lLine = 1, rLine = 1;

  for (const [op, text] of lineDiffs) {
    const cnt = lineCount(text);
    const key = norm(text).trim();
    if (op === -1) {
      delSegs.push({ key, fromLine: lLine, toLine: lLine + cnt - 1 });
      lLine += cnt;
    } else if (op === 1) {
      insSegs.push({ key, fromLine: rLine, toLine: rLine + cnt - 1 });
      rLine += cnt;
    } else {
      lLine += cnt;
      rLine += cnt;
    }
  }

  const movedFromLines = new Set();
  const movedToLines   = new Set();
  const usedIns = new Set();

  for (const del of delSegs) {
    if (!del.key) continue;
    for (let i = 0; i < insSegs.length; i++) {
      if (!usedIns.has(i) && del.key === insSegs[i].key) {
        for (let l = del.fromLine;      l <= del.toLine;      l++) movedFromLines.add(l);
        for (let l = insSegs[i].fromLine; l <= insSegs[i].toLine; l++) movedToLines.add(l);
        usedIns.add(i);
        break;
      }
    }
  }

  return { movedFromLines, movedToLines };
}

// ── diff + decorations ──────────────────────────────────────
function scheduleDiff() {
  clearTimeout(diffTimer);
  diffTimer = setTimeout(runDiff, 200);
}

function buildDecos(view, lineRanges, charRanges) {
  const decos = [];
  const doc = view.state.doc;

  for (const { from, to, cls } of lineRanges) {
    const lineFrom = Math.max(0, from);
    const lineTo   = Math.min(doc.lines, to);
    for (let l = lineFrom; l <= lineTo; l++) {
      try {
        const line = doc.line(l);
        decos.push(Decoration.line({ class: cls }).range(line.from));
      } catch (_) {}
    }
  }

  for (const { from, to, cls } of charRanges) {
    if (from < to && to <= doc.length) {
      decos.push(Decoration.mark({ class: cls }).range(from, to));
    }
  }

  decos.sort((a, b) => a.from - b.from || (a.value?.startSide ?? 0) - (b.value?.startSide ?? 0));
  return Decoration.set(decos, true);
}

function runDiff() {
  if (!editorL || !editorR) return;
  const leftText  = editorL.state.doc.toString();
  const rightText = editorR.state.doc.toString();

  updateEmptyState();
  updateStats(leftText, rightText);
  updateOutline(leftText);

  if (viewMode === 'unified') {
    renderUnified(leftText, rightText);
    return;
  }

  const dmp = new diff_match_patch();

  // Line-level diff
  const encoded   = dmp.diff_linesToChars_(norm(leftText), norm(rightText));
  const lineDiffs = dmp.diff_main(encoded.chars1, encoded.chars2, false);
  dmp.diff_charsToLines_(lineDiffs, encoded.lineArray);

  // Detect moved blocks
  const { movedFromLines, movedToLines } = detectMovedBlocks(lineDiffs);

  // Build per-line decorations
  const leftLineDecos  = [];
  const rightLineDecos = [];
  let leftLine = 1, rightLine = 1;

  for (const [op, text] of lineDiffs) {
    const cnt = Math.max(lineCount(text), 1);
    if (op === -1) {
      for (let l = leftLine; l < leftLine + cnt; l++)
        leftLineDecos.push({ from: l, to: l, cls: movedFromLines.has(l) ? 'diff-move-from' : 'diff-del-line' });
      leftLine += cnt;
    } else if (op === 1) {
      for (let l = rightLine; l < rightLine + cnt; l++)
        rightLineDecos.push({ from: l, to: l, cls: movedToLines.has(l) ? 'diff-move-to' : 'diff-add-line' });
      rightLine += cnt;
    } else {
      leftLine  += cnt;
      rightLine += cnt;
    }
  }

  // Intra-line char highlighting
  const leftCharDecos  = [];
  const rightCharDecos = [];
  addIntraLineDiffs(dmp, leftCharDecos, rightCharDecos, lineDiffs, movedFromLines, movedToLines);

  editorL.dispatch({ effects: setDecosEffect.of(buildDecos(editorL, leftLineDecos,  leftCharDecos)) });
  editorR.dispatch({ effects: setDecosEffect.of(buildDecos(editorR, rightLineDecos, rightCharDecos)) });

  saveToStorage();
}

/**
 * Character-level diff with semantic cleanup (matches VS Code / Monaco behavior).
 * Runs diff_match_patch at the character level, then applies diff_cleanupSemantic
 * to merge adjacent small edits into contiguous highlighted regions.
 */
function diffCharsWithCleanup(dmp, lineA, lineB) {
  const diffs = dmp.diff_main(lineA, lineB, false);
  dmp.diff_cleanupSemantic(diffs);
  return diffs;
}

/**
 * Compares paired delete→insert line blocks using character-level diffing
 * with semantic cleanup. Produces contiguous highlights that cover whole
 * changed phrases rather than fragmenting at word boundaries.
 */
function addIntraLineDiffs(dmp, leftCharDecos, rightCharDecos, lineDiffs, movedFromLines = new Set(), movedToLines = new Set()) {
  const ldoc = editorL.state.doc;
  const rdoc = editorR.state.doc;
  const SIMILARITY_THRESHOLD = 0.3;

  let leftLine = 1;
  let rightLine = 1;
  let idx = 0;

  while (idx < lineDiffs.length) {
    const [op, text] = lineDiffs[idx];
    const segs = text.split('\n');
    if (segs.length > 1 && segs[segs.length - 1] === '') segs.pop();

    if (op === 0) {
      leftLine += segs.length;
      rightLine += segs.length;
      idx++;
    } else if (op === -1 && idx + 1 < lineDiffs.length && lineDiffs[idx + 1][0] === 1) {
      // Adjacent delete→insert: pair for char highlights
      const insText = lineDiffs[idx + 1][1];
      const insSegs = insText.split('\n');
      if (insSegs.length > 1 && insSegs[insSegs.length - 1] === '') insSegs.pop();

      const pairCount = Math.min(segs.length, insSegs.length);

      for (let k = 0; k < pairCount; k++) {
        const lNum = leftLine + k;
        const rNum = rightLine + k;

        if (movedFromLines.has(lNum) || movedToLines.has(rNum)) continue;

        // Ensure we don't exceed doc line bounds
        if (lNum > ldoc.lines || rNum > rdoc.lines) continue;

        const ll = ldoc.line(lNum).text;
        const rl = rdoc.line(rNum).text;

        const diffs = diffCharsWithCleanup(dmp, ll, rl);

        const equalLen = diffs.reduce((s, [cop, txt]) => s + (cop === 0 ? txt.length : 0), 0);
        const maxLen   = Math.max(ll.length, rl.length);
        if (maxLen > 0 && equalLen / maxLen < SIMILARITY_THRESHOLD) continue;

        let lPos = ldoc.line(lNum).from;
        let rPos = rdoc.line(rNum).from;

        for (const [cop, txt] of diffs) {
          const len = txt.length;
          if (cop === -1) {
            if (lPos + len <= ldoc.line(lNum).to + 1) {
              leftCharDecos.push({ from: lPos, to: lPos + len, cls: 'diff-del-char' });
            }
            lPos += len;
          } else if (cop === 1) {
            if (rPos + len <= rdoc.line(rNum).to + 1) {
              rightCharDecos.push({ from: rPos, to: rPos + len, cls: 'diff-add-char' });
            }
            rPos += len;
          } else {
            lPos += len;
            rPos += len;
          }
        }
      }

      leftLine += segs.length;
      rightLine += insSegs.length;
      idx += 2;
    } else if (op === -1) {
      leftLine += segs.length;
      idx++;
    } else {
      rightLine += segs.length;
      idx++;
    }
  }
}

// ── stats ───────────────────────────────────────────────────
function updateStats(left, right) {
  const el = document.getElementById('diff-stats');
  if (!el) return;
  const dmp   = new diff_match_patch();
  const diffs = dmp.diff_main(norm(left), norm(right));
  dmp.diff_cleanupSemantic(diffs);
  let added = 0, removed = 0;
  diffs.forEach(([op]) => { if (op === 1) added++; else if (op === -1) removed++; });
  el.innerHTML = `
    <span class="stat-add inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold text-emerald-600 bg-emerald-500/10">+${added}</span>
    <span class="stat-del inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold text-rose-600 bg-rose-500/10">−${removed}</span>
    <span class="text-[var(--text-tertiary)] text-[11px]">${(left||'').split('\n').length}↔${(right||'').split('\n').length} lines</span>`;
  el.classList.remove('hidden');
  el.classList.add('flex');
}

// ── unified view ────────────────────────────────────────────
function renderUnified(left, right) {
  const dmp = new diff_match_patch();
  const leftLines  = left.split('\n');
  const rightLines = right.split('\n');

  // Line-level diff on normalized text
  const encoded   = dmp.diff_linesToChars_(norm(left), norm(right));
  const lineDiffs = dmp.diff_main(encoded.chars1, encoded.chars2, false);
  dmp.diff_charsToLines_(lineDiffs, encoded.lineArray);

  // Move detection
  const { movedFromLines, movedToLines } = detectMovedBlocks(lineDiffs);

  const el  = document.getElementById('unified-content');
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function renderLine(op, text, charDiffs, side, isMoved) {
    let pfx, cls;
    if (isMoved) {
      pfx = '\u21D5'; // ⇕ double vertical arrow
      cls = (op === -1) ? 'diff-move-from' : 'diff-move-to';
    } else {
      pfx = op === 1 ? '+' : op === -1 ? '-' : ' ';
      cls = op === 1 ? 'diff-add-line' : op === -1 ? 'diff-del-line' : '';
    }
    let inner;
    if (!charDiffs || isMoved) {
      inner = esc(text);
    } else {
      inner = '';
      for (const [cop, ctxt] of charDiffs) {
        if (side === 'left'  && cop === 1)  continue;
        if (side === 'right' && cop === -1) continue;
        const cc = cop === -1 ? 'diff-del-char' : cop === 1 ? 'diff-add-char' : '';
        inner += cc ? `<span class="${cc}">${esc(ctxt)}</span>` : esc(ctxt);
      }
    }
    return `<div class="px-3 py-px font-mono text-[12px] ${cls}"><span class="select-none mr-2 ${isMoved ? 'text-violet-400' : 'text-gray-400'}">${pfx}</span>${inner}</div>`;
  }

  let html = '';
  let li = 0, ri = 0;
  let leftLineNum = 1, rightLineNum = 1;
  let idx = 0;

  while (idx < lineDiffs.length) {
    const [op, text] = lineDiffs[idx];
    const segs = text.split('\n');
    if (segs.length > 1 && segs[segs.length - 1] === '') segs.pop();

    if (op === 0) {
      for (const seg of segs) { html += renderLine(0, leftLines[li++] ?? seg, null, null, false); ri++; leftLineNum++; rightLineNum++; }
      idx++;
    } else if (op === -1 && idx + 1 < lineDiffs.length && lineDiffs[idx + 1][0] === 1) {
      // Adjacent delete→insert: pair for char highlights (unless either side is moved)
      const insText = lineDiffs[idx + 1][1];
      const insSegs = insText.split('\n');
      if (insSegs.length > 1 && insSegs[insSegs.length - 1] === '') insSegs.pop();
      const pairCount = Math.min(segs.length, insSegs.length);
      const delLines  = segs.map(() => leftLines[li++]    ?? '');
      const insLines  = insSegs.map(() => rightLines[ri++] ?? '');

      // Pre-compute char-level diffs for non-moved pairs (only when lines are sufficiently similar)
      const SIMILARITY_THRESHOLD = 0.3;
      const pairDiffs = Array.from({ length: pairCount }, (_, k) => {
        if (movedFromLines.has(leftLineNum + k) || movedToLines.has(rightLineNum + k)) return null;
        const cd = diffCharsWithCleanup(dmp, delLines[k], insLines[k]);
        // Skip char highlights if lines are too dissimilar
        const equalLen = cd.reduce((s, [op, txt]) => s + (op === 0 ? txt.length : 0), 0);
        const maxLen   = Math.max(delLines[k].length, insLines[k].length);
        if (maxLen > 0 && equalLen / maxLen < SIMILARITY_THRESHOLD) return null;
        return cd;
      });

      for (let k = 0; k < delLines.length; k++) {
        const moved = movedFromLines.has(leftLineNum + k);
        html += renderLine(-1, delLines[k], pairDiffs[k] ?? null, 'left', moved);
      }
      for (let k = 0; k < insLines.length; k++) {
        const moved = movedToLines.has(rightLineNum + k);
        html += renderLine(1, insLines[k], pairDiffs[k] ?? null, 'right', moved);
      }

      leftLineNum  += segs.length;
      rightLineNum += insSegs.length;
      idx += 2;
    } else if (op === -1) {
      for (let k = 0; k < segs.length; k++) {
        const moved = movedFromLines.has(leftLineNum + k);
        html += renderLine(-1, leftLines[li++] ?? segs[k], null, null, moved);
      }
      leftLineNum += segs.length;
      idx++;
    } else {
      for (let k = 0; k < segs.length; k++) {
        const moved = movedToLines.has(rightLineNum + k);
        html += renderLine(1, rightLines[ri++] ?? segs[k], null, null, moved);
      }
      rightLineNum += segs.length;
      idx++;
    }
  }

  el.innerHTML = html || '<div class="p-4 text-gray-400 text-center italic">No differences found.</div>';
}

// ── empty state ─────────────────────────────────────────────
function updateEmptyState() {
  const hasContent = (editorL?.state.doc.length ?? 0) + (editorR?.state.doc.length ?? 0) > 0;
  document.getElementById('empty-state').classList.toggle('hidden', hasContent);
}

// ── tab title sync ──────────────────────────────────────────
function updateTabTitle() {
  const leftName = document.getElementById('lbl-left').textContent.trim() || 'Untitled Left';
  const rightName = document.getElementById('lbl-right').textContent.trim() || 'Untitled Right';
  const titleString = `${leftName} ↔ ${rightName} | Diff Explorer`;
  document.title = titleString;

  // Sync title changes with the parent workspace environment
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'titleChange',
      title: `${leftName} ↔ ${rightName}`
    }, '*');
  }
}

// ── outline ─────────────────────────────────────────────────
function updateOutline(content) {
  const el = document.getElementById('outline-list');
  if (!content?.trim()) { el.innerHTML = '<div class="text-[var(--text-tertiary)] italic p-4 text-center">No content yet.</div>'; return; }

  const symbols = [];
  content.split('\n').forEach((line, i) => {
    const md  = line.match(/^(#{1,6})\s+(.+)/);
    const fn  = line.match(/^(?:export\s+)?(?:async\s+)?function[\s*]+(\w+)/);
    const cls = line.match(/^(?:export\s+)?(?:abstract\s+)?class\s+(\w+)/);
    const arr = line.match(/^(?:export\s+)?(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s*)?\(?.*?\)?\s*=>/);
    const pyd = line.match(/^(?:\s*)def\s+(\w+)/);
    const pyc = line.match(/^class\s+(\w+)/);
    if (md)  symbols.push({ level: md[1].length,  text: md[2],          line: i, icon: '§' });
    else if (fn)  symbols.push({ level: 1, text: fn[1]+'()',  line: i, icon: 'ƒ' });
    else if (cls) symbols.push({ level: 1, text: cls[1],       line: i, icon: '⊡' });
    else if (arr) symbols.push({ level: 2, text: arr[1]+' →', line: i, icon: 'ƒ' });
    else if (pyd) symbols.push({ level: 2, text: 'def '+pyd[1]+'()', line: i, icon: 'ƒ' });
    else if (pyc) symbols.push({ level: 1, text: 'class '+pyc[1], line: i, icon: '⊡' });
  });

  if (!symbols.length) { el.innerHTML = '<div class="text-[var(--text-tertiary)] italic p-4 text-center">No symbols found.</div>'; return; }

  el.innerHTML = symbols.map(s => `
    <button onclick="jumpToLine(${s.line})"
      class="file-item hover:text-violet-600 dark:hover:text-violet-400 transition-colors duration-150 py-1"
      style="padding-left: ${Math.max(8, s.level * 10)}px" title="Line ${s.line+1}: ${s.text}">
      <span class="outline-icon opacity-60 font-mono shrink-0 mr-1.5">${s.icon}</span>
      <span class="truncate">${s.text.replace(/</g,'&lt;')}</span>
    </button>`).join('');
}

window.jumpToLine = function(lineIdx) {
  [editorL, editorR].forEach(ed => {
    if (!ed) return;
    const doc = ed.state.doc;
    const l   = Math.min(lineIdx + 1, doc.lines);
    const pos = doc.line(l).from;
    ed.dispatch({ selection: { anchor: pos }, effects: EditorView.scrollIntoView(pos, { y: 'center' }) });
    
    // Smooth flash indicator
    ed.dom.classList.add('outline-flash');
    setTimeout(() => ed.dom.classList.remove('outline-flash'), 700);
  });

  // Close overlay drawer instantly on mobile interaction to maximize visibility
  if (window.innerWidth < 768) {
    document.body.classList.remove('mobile-sidebar-active');
  }
};

// ── view mode ────────────────────────────────────────────────
window.setView = function(mode) {
  viewMode = mode;
  document.getElementById('view-split').classList.toggle('hidden', mode !== 'split');
  document.getElementById('view-unified').classList.toggle('hidden', mode !== 'unified');

  const bs = document.getElementById('btn-view-split');
  const bu = document.getElementById('btn-view-unified');
  
  bs.classList.remove('active');
  bu.classList.remove('active');
  
  if (mode === 'split') {
    bs.classList.add('active');
    scheduleDiff();
  } else {
    bu.classList.add('active');
    renderUnified(editorL?.state.doc.toString()||'', editorR?.state.doc.toString()||'');
  }
  saveToStorage();
};

// ── outline toggle ────────────────────────────────────────────
window.toggleOutline = function() {
  const sidebar = document.getElementById('outline-sidebar');
  const btn     = document.getElementById('btn-outline');
  if (window.innerWidth < 768) {
    const active = document.body.classList.toggle('mobile-sidebar-active');
    btn.classList.toggle('bg-violet-600', active);
    btn.classList.toggle('text-white', active);
    btn.classList.toggle('border-violet-600', active);
    return;
  }
  outlineOpen = !outlineOpen;
  if (outlineOpen) {
    sidebar.classList.remove('outline-closed');
    btn.classList.add('bg-violet-600','text-white','border-violet-600');
  } else {
    sidebar.classList.add('outline-closed');
    btn.classList.remove('bg-violet-600','text-white','border-violet-600');
  }
  window.dispatchEvent(new Event('resize'));
};

// ── file loading ─────────────────────────────────────────────
function readFile(file) {
  return new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsText(file); });
}

async function loadLeft(file) {
  const text = await readFile(file);
  document.getElementById('lbl-left').textContent = file.name;
  editorL.dispatch({ changes: { from: 0, to: editorL.state.doc.length, insert: text } });
  
  // Reconfigure syntax engine for updated file type
  const targetLanguage = langExt(file.name);
  editorL.dispatch({ effects: langL.reconfigure(targetLanguage) });
  
  updateTabTitle();
}

async function loadRight(file) {
  const text = await readFile(file);
  document.getElementById('lbl-right').textContent = file.name;
  editorR.dispatch({ changes: { from: 0, to: editorR.state.doc.length, insert: text } });
  
  // Reconfigure syntax engine for updated file type
  const targetLanguage = langExt(file.name);
  editorR.dispatch({ effects: langR.reconfigure(targetLanguage) });
  
  updateTabTitle();
}

const isText = f => f.type.startsWith('text') || /\.(js|ts|jsx|tsx|json|py|md|html?|css|sql|xml|txt|ya?ml|sh|rb|go|rs|c|cpp|h|java|php|swift)$/i.test(f.name);

// Handle drop target feedback consistently across entire body element
document.body.addEventListener('dragover',  e => { e.preventDefault(); document.body.classList.add('drop-active'); });
document.body.addEventListener('dragleave', e => { document.body.classList.remove('drop-active'); });
document.body.addEventListener('drop', async e => {
  e.preventDefault();
  document.body.classList.remove('drop-active');
  const files = Array.from(e.dataTransfer.files).filter(isText);
  if (files[0]) await loadLeft(files[0]);
  if (files[1]) await loadRight(files[1]);
});

document.getElementById('btn-open-left').onclick   = () => document.getElementById('file-input-left').click();
document.getElementById('btn-open-right').onclick  = () => document.getElementById('file-input-right').click();
document.getElementById('btn-open-left-u').onclick  = () => document.getElementById('file-input-left').click();
document.getElementById('btn-open-right-u').onclick = () => document.getElementById('file-input-right').click();
document.getElementById('file-input-left').onchange  = e => e.target.files[0] && loadLeft(e.target.files[0]);
document.getElementById('file-input-right').onchange = e => e.target.files[0] && loadRight(e.target.files[0]);

async function pasteToDiff(side) {
  try {
    if (!navigator.clipboard || !window.isSecureContext) {
      throw new Error('Clipboard API unavailable');
    }
    const text = await navigator.clipboard.readText();
    if (text !== undefined && text !== null) {
      if (side === 'left' && editorL) {
        editorL.dispatch({ changes: { from: 0, to: editorL.state.doc.length, insert: text } });
      } else if (side === 'right' && editorR) {
        editorR.dispatch({ changes: { from: 0, to: editorR.state.doc.length, insert: text } });
      }
      showToast('Pasted from clipboard!');
    }
  } catch (err) {
    console.error('Failed to read clipboard: ', err);
    showToast('Use Ctrl+V / Cmd+V to paste');
  }
}

document.getElementById('btn-paste-left').onclick = () => pasteToDiff('left');
document.getElementById('btn-paste-right').onclick = () => pasteToDiff('right');
document.getElementById('btn-paste-left-u').onclick = () => pasteToDiff('left');
document.getElementById('btn-paste-right-u').onclick = () => pasteToDiff('right');

// ── options ──────────────────────────────────────────────────
document.getElementById('opt-wrap').onchange = e => {
  opts.wordWrap = e.target.checked;
  const ext = opts.wordWrap ? EditorView.lineWrapping : [];
  editorL?.dispatch({ effects: wrapL.reconfigure(ext) });
  editorR?.dispatch({ effects: wrapR.reconfigure(ext) });
  saveToStorage();
};
document.getElementById('opt-ws').onchange   = e => { opts.ignoreWS        = e.target.checked; scheduleDiff(); };
document.getElementById('opt-ci').onchange   = e => { opts.caseInsensitive = e.target.checked; scheduleDiff(); };
document.getElementById('opt-typo').onchange = e => { opts.normalizeTypo   = e.target.checked; scheduleDiff(); };
document.getElementById('btn-typeset').onclick = () => {
  if (!editorR) { showToast('Load a Modified file first.'); return; }
  try {
    const original = editorR.state.doc.toString();
    const { result, counts } = applyTypography(original);
    const total = counts.ellipses + counts.dashes + counts.dquotes + counts.squotes;
    if (total === 0) {
      showToast('Modified already uses typographic punctuation \u2014 nothing to convert.');
      return;
    }
    editorR.dispatch({ changes: { from: 0, to: editorR.state.doc.length, insert: result } });
    const parts = [];
    if (counts.dquotes)  parts.push(`${counts.dquotes} \u201Cdouble quotes\u201D`);
    if (counts.squotes)  parts.push(`${counts.squotes} \u2018single quotes\u2019`);
    if (counts.dashes)   parts.push(`${counts.dashes} \u2014 dashes`);
    if (counts.ellipses) parts.push(`${counts.ellipses} \u2026 ellipses`);
    showToast('\u2713 Typeset: ' + parts.join(', '));
  } catch (err) {
    showToast('Typeset error: ' + err.message);
    console.error('Typeset failed:', err);
  }
};
document.getElementById('lang-select').onchange = e => {
  currentLang = e.target.value;
  const lname = document.getElementById('lbl-left').textContent;
  const rname = document.getElementById('lbl-right').textContent;
  editorL.dispatch({ effects: langL.reconfigure(langExt(lname)) });
  editorR.dispatch({ effects: langR.reconfigure(langExt(rname)) });
};

// ── export ───────────────────────────────────────────────────
document.getElementById('btn-copy-patch').onclick = () => {
  const dmp = new diff_match_patch();
  const patches = dmp.patch_make(editorL.state.doc.toString(), editorR.state.doc.toString());
  const patchText = dmp.patch_toText(patches);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(patchText).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = patchText;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    });
  } else {
    const textarea = document.createElement('textarea');
    textarea.value = patchText;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
  }
  showToast('Patch copied!');
  document.getElementById('dd-export-menu').classList.remove('visible');
};
document.getElementById('btn-save-html').onclick = () => {
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const blob = new Blob([`<!doctype html><html><head><meta charset="UTF-8"><title>Diff Report</title>
<style>body{display:flex;gap:1rem;padding:1rem;font-family:monospace;font-size:12px}pre{flex:1;border:1px solid #ddd;padding:1rem;border-radius:6px;overflow:auto}</style>
</head><body><pre><b>Original</b>\n\n${e(editorL.state.doc.toString())}</pre><pre><b>Modified</b>\n\n${e(editorR.state.doc.toString())}</pre></body></html>`], { type:'text/html' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download:'diff-report.html' });
  a.click(); URL.revokeObjectURL(a.href);
  document.getElementById('dd-export-menu').classList.remove('visible');
};

// ── clear ────────────────────────────────────────────────────
document.getElementById('btn-clear').onclick = () => {
  // Replace direct window confirm alert with a custom toast confirmation/action trigger
  localStorage.removeItem(STORAGE);
  document.getElementById('lbl-left').textContent = '';
  document.getElementById('lbl-right').textContent = '';
  createEditors('', '');
  document.getElementById('diff-stats').classList.add('hidden');
  document.getElementById('diff-stats').classList.remove('flex');
  showToast('Workspace cleared.');
};

// ── dropdowns ────────────────────────────────────────────────
[['btn-export','dd-export-menu'], ['btn-options','dd-options-menu']].forEach(([btnId, menuId]) => {
  const btn  = document.getElementById(btnId);
  const menu = document.getElementById(menuId);
  if (!btn || !menu) return;

  function positionMenu() {
    const r = btn.getBoundingClientRect();
    const vw = window.innerWidth;
    const width = menu.offsetWidth || 220;
    let left = r.left;
    if (left + width > vw - 12) left = Math.max(12, vw - width - 12);
    menu.style.position = 'fixed';
    menu.style.top = `${r.bottom + 4}px`;
    menu.style.left = `${left}px`;
    menu.style.zIndex = '1000';
  }

  btn.addEventListener('click', e => {
    e.stopPropagation();
    const isVisible = menu.classList.contains('visible');
    document.querySelectorAll('.dropdown-menu, .save-dropdown-menu').forEach(m => m.classList.remove('visible'));
    if (!isVisible) {
      menu.classList.add('visible');
      positionMenu();
    }
  });

  menu.addEventListener('click', e => {
    e.stopPropagation();
  });
});

// Close all active dropdown menus when clicking elsewhere on the page
document.addEventListener('click', () => {
  document.getElementById('dd-export-menu')?.classList.remove('visible');
  document.getElementById('dd-options-menu')?.classList.remove('visible');
});

// ── toast ────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visible'), 2500);
}

// ── localStorage ─────────────────────────────────────────────
function saveToStorage() {
  if (!editorL) return;
  try {
    localStorage.setItem(STORAGE, JSON.stringify({
      left: editorL.state.doc.toString(),
      right: editorR.state.doc.toString(),
      leftName:  document.getElementById('lbl-left').textContent,
      rightName: document.getElementById('lbl-right').textContent,
      viewMode, opts, lang: currentLang,
    }));
  } catch (_) {}
}

function loadFromStorage() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE));
    if (!s) return false;
    if (s.opts) opts = { ...opts, ...s.opts };
    if (s.lang) { currentLang = s.lang; document.getElementById('lang-select').value = s.lang; }
    if (s.leftName)  document.getElementById('lbl-left').textContent  = s.leftName;
    if (s.rightName) document.getElementById('lbl-right').textContent = s.rightName;
    document.getElementById('opt-wrap').checked = opts.wordWrap ?? false;
    document.getElementById('opt-ws').checked   = opts.ignoreWS;
    document.getElementById('opt-ci').checked   = opts.caseInsensitive;
    document.getElementById('opt-typo').checked = opts.normalizeTypo ?? false;
    if (s.left || s.right) {
      createEditors(s.left || '', s.right || '');
      if (s.viewMode) setView(s.viewMode);
      return true;
    }
  } catch (_) {}
  return false;
}

// ── responsive ───────────────────────────────────────────────
window.addEventListener('resize', () => {
  if (window.innerWidth < 768 && viewMode === 'split') setView('unified');
});

// ── theme watch ──────────────────────────────────────────────
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  const t = theme();
  editorL?.dispatch({ effects: themeL.reconfigure(t) });
  editorR?.dispatch({ effects: themeR.reconfigure(t) });
  
  const isDarkMode = isDark();
  [editorL, editorR].forEach(ed => {
    if (!ed) return;
    ed.dom.classList.toggle('theme-dark', isDarkMode);
    ed.dom.classList.toggle('theme-light', !isDarkMode);
  });
});

// ── boot ─────────────────────────────────────────────────────
(function boot() {
  setView(viewMode);
  // Mark outline btn active by default
  document.getElementById('btn-outline').classList.add('bg-violet-600','text-white','border-violet-600');
  if (!loadFromStorage()) createEditors('', '');

  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'toolSelection',
      url: window.location.pathname.split('/').pop() + window.location.search
    }, '*');
  }
})();
</script>
<script src="footer.js"></script>
</body>
