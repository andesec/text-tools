<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Markdown Explorer</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
		rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						sans: ['Inter', 'sans-serif'],
					},
				}
			}
		}
	</script>
	<script src="vendor/marked.min.js"></script>
	<link rel="stylesheet" href="vendor/katex/katex.min.css">
	<script src="vendor/katex/katex.min.js"></script>
	<script src="vendor/purify.min.js"></script>
	<link href="vendor/prism-tomorrow.min.css" rel="stylesheet" />
	<script src="vendor/prism.min.js"></script>
	<script src="vendor/prism-markdown.min.js"></script>
	<script src="vendor/prism-bash.min.js"></script>
	<script src="vendor/prism-javascript.min.js"></script>
	<script src="vendor/prism-python.min.js"></script>
	<link rel="stylesheet" href="mdv-comments.css">
	<link rel="stylesheet" href="theme.css">

	<style>
		:root {
			--reader-font-size: 1rem;
			--link-color: #58a6ff;
			--link-color-hover: #79c0ff;
		}

		@media (max-width: 640px) {
			:root {
				--reader-font-size: 0.875rem;
			}
		}

		@media (prefers-color-scheme: light) {
			:root {
				--link-color: #0969da;
				--link-color-hover: #0550ae;
			}
		}

		/* ── GitHub-style Markdown Body ── */
		.prose {
			max-width: none;
			color: var(--text-primary) !important;
			font-size: var(--reader-font-size);
			line-height: 1.5;
			word-wrap: break-word;
			font-kerning: normal;
		}

		.prose p,
		.prose ul,
		.prose ol,
		.prose dl,
		.prose table,
		.prose pre,
		.prose details {
			margin-top: 0;
			margin-bottom: 1rem;
		}

		.prose blockquote {
			margin-top: 0;
			margin-bottom: 1rem;
		}

		/* ── Headings ── */
		.prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
			font-weight: 500;
			line-height: 1.25;
			margin-top: 1.5rem;
			margin-bottom: 1rem;
		}

		.prose h1 {
			font-size: 2em;
			margin-top: 0;
			margin-bottom: 1rem;
			padding-bottom: 0.3em;
			border-bottom: 1px solid var(--border-default);
			color: var(--text-primary);
		}

		.prose h2 {
			font-size: 1.5em;
			padding-bottom: 0.3em;
			border-bottom: 1px solid var(--border-default);
			color: var(--text-primary);
		}

		.prose h3 {
			font-size: 1.25em;
			color: var(--text-primary);
		}

		.prose h4 {
			font-size: 1em;
			color: var(--text-primary);
		}

		.prose h5 {
			font-size: 0.875em;
			color: var(--text-primary);
		}

		.prose h6 {
			font-size: 0.85em;
			color: var(--text-secondary);
		}

		.prose h1 .anchor,
		.prose h2 .anchor,
		.prose h3 .anchor,
		.prose h4 .anchor,
		.prose h5 .anchor,
		.prose h6 .anchor {
			float: left;
			margin-left: -1.25rem;
			padding-right: 0.25rem;
			line-height: 1;
			opacity: 0;
			transition: opacity var(--transition-fast);
			text-decoration: none;
			color: var(--link-color);
		}

		.prose h1:hover .anchor,
		.prose h2:hover .anchor,
		.prose h3:hover .anchor,
		.prose h4:hover .anchor,
		.prose h5:hover .anchor,
		.prose h6:hover .anchor {
			opacity: 1;
		}

		.prose h1 .anchor svg,
		.prose h2 .anchor svg,
		.prose h3 .anchor svg,
		.prose h4 .anchor svg,
		.prose h5 .anchor svg,
		.prose h6 .anchor svg {
			display: inline-block;
			width: 1rem;
			height: 1rem;
			fill: currentColor;
		}

		/* ── Links ── */
		.prose a {
			color: var(--link-color);
			text-decoration: none;
		}

		.prose a:hover {
			text-decoration: underline;
		}

		/* ── Lists ── */
		.prose ul {
			list-style-type: disc;
			padding-left: 2em;
		}

		.prose ol {
			list-style-type: decimal;
			padding-left: 2em;
		}

		.prose ul ul,
		.prose ul ol,
		.prose ol ol,
		.prose ol ul {
			margin-top: 0;
			margin-bottom: 0;
		}

		.prose li {
			margin-top: 0;
			padding-left: 0;
			word-wrap: break-word;
		}

		.prose li+li {
			margin-top: 0.25em;
		}

		.prose li>p {
			margin-top: 1rem;
		}

		.prose li>p:first-child {
			margin-top: 0;
		}

		/* ── Task Lists ── */
		.prose .task-list-item {
			list-style-type: none;
		}

		.prose .task-list-item input[type="checkbox"] {
			margin: 0 .2em .25em -1.4em;
			vertical-align: middle;
		}

		.prose .contains-task-list {
			padding-left: 0;
		}

		/* ── Blockquotes ── */
		.prose blockquote {
			padding: 0 1em;
			color: var(--text-secondary);
			border-left: 0.25em solid var(--border-default);
		}

		.prose blockquote>:first-child {
			margin-top: 0;
		}

		.prose blockquote>:last-child {
			margin-bottom: 0;
		}

		/* ── Code ── */
		.prose :not(pre)>code,
		.prose tt {
			background-color: var(--code-inline-bg);
			padding: 0.2em 0.4em;
			border-radius: 6px;
			font-family: var(--font-mono);
			font-size: 0.85em;
			color: var(--code-inline-text);
			white-space: break-spaces;
		}

		.prose pre {
			background-color: var(--code-bg) !important;
			padding: 1rem !important;
			border-radius: 6px;
			overflow: auto;
			line-height: 1.45;
			font-size: 0.85em;
		}

		.prose pre code {
			background: transparent !important;
			padding: 0 !important;
			border-radius: 0 !important;
			font-size: 100% !important;
			line-height: inherit !important;
			color: var(--text-primary) !important;
			font-family: var(--font-mono) !important;
		}

		/* ── Tables ── */
		.prose table {
			display: block;
			width: max-content;
			max-width: 100%;
			overflow: auto;
			border-collapse: collapse;
			font-size: 0.9em;
			font-variant: tabular-nums;
			-webkit-overflow-scrolling: touch;
		}

		.prose th {
			background-color: var(--bg-surface-hover);
			text-align: left;
		}

		.prose th,
		.prose td {
			border: 1px solid var(--border-default);
			padding: 6px 13px;
		}

		.prose tr {
			background-color: var(--bg-surface);
			border-top: 1px solid var(--border-default);
		}

		.prose tr:nth-child(2n) {
			background-color: var(--bg-surface-hover);
		}

		.prose table img {
			background-color: transparent;
		}

		/* ── Horizontal Rules ── */
		.prose hr {
			height: 0.25em;
			padding: 0;
			margin: 1.5rem 0;
			background-color: var(--border-default);
			border: 0;
		}

		/* ── Images & Media ── */
		.prose img {
			max-width: 100%;
			box-sizing: content-box;
		}

		.prose video,
		.prose iframe {
			max-width: 100%;
			height: auto;
			border-radius: var(--radius-md);
		}

		/* ── Definition Lists ── */
		.prose dl {
			padding: 0;
		}

		.prose dt {
			font-size: 1em;
			font-style: italic;
			margin-top: 1rem;
			padding: 0;
		}

		.prose dd {
			padding: 0 1rem;
			margin-bottom: 1rem;
			margin-left: 0;
		}

		/* ── Keyboard tags ── */
		.prose kbd {
			display: inline-block;
			padding: 3px 5px;
			font: 11px var(--font-mono);
			line-height: 10px;
			color: var(--text-primary);
			vertical-align: middle;
			background-color: var(--bg-surface-raised);
			border: 1px solid var(--border-default);
			border-bottom-color: var(--border-strong);
			border-radius: 6px;
			box-shadow: inset 0 -1px 0 var(--border-default);
		}

		/* ── Footnotes ── */
		.prose .footnotes {
			font-size: 0.85em;
			color: var(--text-secondary);
			border-top: 1px solid var(--border-default);
			margin-top: 2rem;
			padding-top: 1rem;
		}

		.prose .footnotes ol {
			padding-left: 1rem;
		}

		.prose .footnotes li {
			margin-top: 0.25em;
		}

		.prose .footnotes li:target {
			background-color: var(--bg-surface-hover);
		}

		.prose a[data-footnote-ref] {
			font-size: 0.85em;
			vertical-align: super;
			line-height: 1;
		}

		/* ── GFM Alerts / Callouts ── */
		.prose .markdown-alert {
			padding: 0.5rem 1rem;
			margin-bottom: 1rem;
			border-left: 0.25em solid var(--border-default);
		}

		.prose .markdown-alert>:first-child {
			margin-top: 0;
		}

		.prose .markdown-alert>:last-child {
			margin-bottom: 0;
		}

		.prose .markdown-alert .markdown-alert-title {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			line-height: 1;
			margin-bottom: 0.25rem;
			margin-top: 0;
		}

		.prose .markdown-alert .markdown-alert-title svg {
			display: inline-block;
			width: 1rem;
			height: 1rem;
			fill: currentColor;
			flex-shrink: 0;
		}

		.prose .markdown-alert-note {
			border-left-color: var(--link-color);
		}
		.prose .markdown-alert-note .markdown-alert-title {
			color: var(--link-color);
		}
		.prose .markdown-alert-tip {
			border-left-color: var(--success);
		}
		.prose .markdown-alert-tip .markdown-alert-title {
			color: var(--success);
		}
		.prose .markdown-alert-important {
			border-left-color: #8250df;
		}
		.prose .markdown-alert-important .markdown-alert-title {
			color: #8250df;
		}
		.prose .markdown-alert-warning {
			border-left-color: var(--warning);
		}
		.prose .markdown-alert-warning .markdown-alert-title {
			color: var(--warning);
		}
		.prose .markdown-alert-caution {
			border-left-color: var(--danger);
		}
		.prose .markdown-alert-caution .markdown-alert-title {
			color: var(--danger);
		}

		/* ── KaTeX Math Styling ── */
		.katex-display {
			margin: 1.5em 0 !important;
			overflow-x: auto;
			overflow-y: hidden;
			padding: 0.5em 0;
		}

		.katex {
			font-size: 1.1em;
		}

		@media (prefers-color-scheme: light) {
			.prose tr {
				background-color: #ffffff;
			}

			.prose tr:nth-child(2n) {
				background-color: #f6f8fa;
			}

			.prose .footnotes li:target {
				background-color: #f6f8fa;
			}
		}

		.outline-item {
			color: var(--text-secondary);
		}
		.outline-item[data-level="1"] { padding-left: 0.75rem; }
		.outline-item[data-level="2"] { padding-left: 1.5rem; }
		.outline-item[data-level="3"] { padding-left: 2.25rem; }
		.outline-item[data-level="4"] { padding-left: 3rem; }
		.outline-item[data-level="5"] { padding-left: 3.75rem; }
		.outline-item[data-level="6"] { padding-left: 4.5rem; }

		.file-item.active {
			background-color: var(--accent) !important;
			color: white !important;
		}

		.mobile-sidebar-active #sidebar {
			display: flex !important;
			position: fixed;
			inset: 0;
			z-index: 60;
			width: 100%;
		}

		#editor-container {
			min-height: 0;
			display: flex;
			flex-direction: column;
			transition: all var(--transition-slow);
		}

		#editor-container.hidden {
			display: none !important;
		}

		#content {
			transition: all var(--transition-slow);
		}

		#editor {
			flex: 1;
			min-height: 0;
		}

		.cm-editor {
			height: 100% !important;
		}

		.cm-scroller {
			overflow: auto !important;
		}

		.no-scrollbar::-webkit-scrollbar {
			display: none;
		}

		.no-scrollbar {
			-ms-overflow-style: none;
			scrollbar-width: none;
		}

		.transition-all {
			transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
		}

		.open-main-btn {
			border-radius: var(--radius-md) 0 0 var(--radius-md) !important;
		}

		.open-chevron-btn {
			border-radius: 0 var(--radius-md) var(--radius-md) 0 !important;
			border-left: 1px solid rgb(64, 64, 70) !important;
			padding-left: 6px;
			padding-right: 6px;
		}

		.open-dropdown-menu {
			left: 0 !important;
			right: auto !important;
		}

		/* ─── TTS Reader Styles ─────────────────────────────── */

		.tts-block-wrapper {
			position: relative;
		}

		.tts-speak-btn {
			position: absolute;
			right: 8px;
			top: 50%;
			transform: translateY(-50%);
			width: 32px;
			height: 32px;
			border: none;
			background: none;
			color: var(--text-tertiary);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			border-radius: 50%;
			z-index: 1;
			transition: opacity var(--transition-fast), background var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
			-webkit-tap-highlight-color: transparent;
		}

		@media (hover: hover) {
			.tts-block-wrapper:hover .tts-speak-btn {
				opacity: 1;
				pointer-events: auto;
			}
		}

		@media (hover: none) {
			.tts-speak-btn {
				opacity: 0.3;
				pointer-events: auto;
			}

			.tts-speak-btn:active {
				opacity: 1;
				background: var(--accent);
				color: #fff;
			}
		}

		.tts-speak-btn svg {
			width: 18px;
			height: 18px;
		}

		.tts-speak-btn:hover {
			background: var(--bg-surface-raised);
			color: var(--accent);
			transform: translateY(-50%) scale(1.1);
		}

		.tts-active-block>*:first-child,
		.tts-active-block {
			border-left: 2px solid var(--accent) !important;
			background: var(--bg-surface-raised);
		}

		@media (max-width: 600px) {
			.tts-speak-btn {
				width: 36px;
				height: 36px;
				border-radius: 6px 0 0 6px;
			}

			.tts-speak-btn svg {
				width: 18px;
				height: 18px;
			}
		}

		/* Floating TTS Player Bar */
		#tts-player-bar {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			z-index: 100;
			background: var(--bg-surface);
			border-top: 1px solid var(--border-default);
			transform: translateY(100%);
			transition: transform var(--transition-slow);
			display: flex;
			align-items: center;
			gap: var(--space-3);
			padding: var(--space-2) var(--space-4);
			flex-wrap: wrap;
		}

		#tts-player-bar.visible {
			transform: translateY(0);
		}

		.tts-bar-status {
			flex: 1;
			min-width: 0;
			display: flex;
			flex-direction: column;
			gap: 2px;
		}

		.tts-bar-title {
			font-size: var(--font-size-xs);
			color: var(--text-tertiary);
			font-weight: 500;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.tts-bar-text {
			font-size: var(--font-size-sm);
			color: var(--text-primary);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.tts-bar-controls {
			display: flex;
			align-items: center;
			gap: var(--space-2);
			flex-shrink: 0;
		}

		.tts-bar-btn {
			width: 40px;
			height: 40px;
			border-radius: 50%;
			border: 1px solid var(--border-default);
			background: var(--bg-surface-raised);
			color: var(--text-primary);
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: all var(--transition-fast);
			flex-shrink: 0;
		}

		.tts-bar-btn svg {
			width: 18px;
			height: 18px;
		}

		.tts-bar-play-btn {
			width: 44px;
			height: 44px;
			background: var(--accent);
			border-color: var(--accent);
			color: #ffffff;
		}

		.tts-bar-btn svg {
			width: 15px;
			height: 15px;
		}

		.tts-bar-btn:hover:not(:disabled) {
			border-color: var(--accent);
			color: var(--accent-text);
		}

		.tts-bar-btn:disabled {
			color: var(--text-disabled);
			border-color: var(--border-subtle);
			cursor: not-allowed;
		}

		.tts-bar-play-btn {
			width: 40px;
			height: 40px;
			background: var(--accent);
			border-color: var(--accent);
			color: #ffffff;
		}

		.tts-bar-play-btn:hover:not(:disabled) {
			background: var(--accent-hover);
			border-color: var(--accent-hover);
			color: #ffffff;
		}

		.tts-bar-close-btn {
			border: none;
			background: transparent;
			color: var(--text-tertiary);
		}

		.tts-bar-close-btn:hover:not(:disabled) {
			color: var(--danger);
			border-color: transparent;
		}

		.tts-bar-select {
			background: var(--bg-surface-raised);
			border: 1px solid var(--border-default);
			border-radius: var(--radius-md);
			padding: 8px 10px;
			color: var(--text-primary);
			font-family: var(--font-sans);
			font-size: var(--font-size-sm);
			outline: none;
			cursor: pointer;
			transition: border-color var(--transition-fast);
		}

		.tts-bar-select:focus {
			border-color: var(--accent);
		}

		.tts-bar-progress {
			width: 100%;
			height: 3px;
			background: var(--border-default);
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
		}

		.tts-bar-progress-fill {
			height: 100%;
			background: var(--accent);
			width: 0%;
			transition: width var(--transition-base);
		}

		.tts-loading-indicator {
			width: 16px;
			height: 16px;
			border: 2px solid var(--border-default);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: tts-spin 0.7s linear infinite;
			flexshrink: 0;
			display: none;
		}

		.tts-loading-indicator.active {
			display: block;
		}

		@keyframes tts-spin {
			to {
				transform: rotate(360deg);
			}
		}

		.tts-toggle-btn {
			position: relative;
		}

		.tts-toggle-dot {
			position: absolute;
			top: -2px;
			right: -2px;
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: var(--accent);
			display: none;
		}

		.tts-toggle-dot.visible {
			display: block;
		}

		@media (max-width: 600px) {
			#tts-player-bar {
				padding: var(--space-2) var(--space-2);
				gap: var(--space-2);
			}

			.tts-bar-controls {
				gap: var(--space-1);
			}

			.tts-bar-btn {
				width: 36px;
				height: 36px;
			}

			.tts-bar-play-btn {
				width: 40px;
				height: 40px;
			}

			.tts-bar-btn svg {
				width: 16px;
				height: 16px;
			}

			.tts-bar-select {
				padding: 6px 8px;
				font-size: var(--font-size-xs);
			}

			.tts-bar-text {
				font-size: var(--font-size-xs);
			}
		}

		/* ── Iframe Embed Mode ──────────────────────────────── */
		body.iframe-mode .app-header-row {
			display: none !important;
		}

		body.iframe-mode #documents-panel {
			display: none !important;
		}

		body.iframe-mode #app-footer {
			display: none !important;
		}

		/* Sidebar in iframe mode: always visible, animated collapse */
		body.iframe-mode #sidebar {
			display: flex !important;
			transition: width var(--transition-slow), min-width var(--transition-slow);
		}

		body.iframe-mode #sidebar.iframe-sidebar-collapsed {
			display: flex !important;
			width: 0 !important;
			min-width: 0 !important;
			overflow: hidden;
		}

		/* Floating sidebar toggle button for iframe mode */
		#iframe-sidebar-toggle {
			display: none;
			position: fixed;
			top: 8px;
			left: 8px;
			z-index: 200;
			width: 32px;
			height: 32px;
			border-radius: var(--radius-md);
			border: 1px solid var(--border-default);
			background: var(--bg-surface-raised);
			color: var(--text-secondary);
			cursor: pointer;
			align-items: center;
			justify-content: center;
			transition: background var(--transition-fast), color var(--transition-fast), left var(--transition-slow);
			box-shadow: 0 2px 8px var(--shadow-md);
		}

		body.iframe-mode #iframe-sidebar-toggle {
			display: flex;
		}

		#iframe-sidebar-toggle:hover {
			background: var(--accent);
			color: #fff;
			border-color: var(--accent);
		}

		#iframe-sidebar-toggle svg {
			width: 16px;
			height: 16px;
			transition: transform var(--transition-slow);
		}

		body.iframe-mode #sidebar.iframe-sidebar-collapsed ~ #iframe-sidebar-toggle,
		#iframe-sidebar-toggle.sidebar-hidden {
			left: 8px;
		}

		/* ── Runnable HTML Code Sandbox styles ── */
		.runnable-code-container {
			position: relative;
			margin-top: 1rem;
			margin-bottom: 1rem;
			border: 1px solid var(--border-default);
			border-radius: var(--radius-md);
			background: var(--code-bg);
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}
		.btn-run-code {
			position: absolute;
			top: 8px;
			right: 8px;
			z-index: 10;
			background: var(--bg-surface-raised);
			border: 1px solid var(--border-default);
			color: var(--text-secondary);
			border-radius: var(--radius-sm);
			padding: 4px 8px;
			font-size: var(--font-size-xs);
			font-family: var(--font-sans);
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 4px;
			transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
		}
		.btn-run-code:hover {
			background: var(--accent);
			color: rgb(255, 255, 255);
			border-color: var(--accent);
		}
		.runnable-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: var(--bg-surface-raised);
			border-bottom: 1px solid var(--border-default);
			padding: 0 var(--space-2);
			height: 36px;
			flex-shrink: 0;
		}
		.runnable-tabs {
			display: flex;
			gap: var(--space-1);
			height: 100%;
			align-items: flex-end;
		}
		.runnable-tab {
			background: transparent;
			border: none;
			border-bottom: 2px solid transparent;
			color: var(--text-secondary);
			font-family: var(--font-sans);
			font-size: var(--font-size-xs);
			font-weight: 500;
			padding: var(--space-2) var(--space-3);
			cursor: pointer;
			transition: color var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
			height: 100%;
		}
		.runnable-tab:hover {
			color: var(--text-primary);
			background: var(--bg-surface-hover);
		}
		.runnable-tab.active {
			color: var(--text-primary);
			border-bottom-color: var(--accent);
			background: var(--bg-surface);
		}
		.runnable-close-btn {
			background: transparent;
			border: none;
			color: var(--text-secondary);
			border-radius: var(--radius-sm);
			padding: 4px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background var(--transition-fast), color var(--transition-fast);
		}
		.runnable-close-btn:hover {
			background: var(--bg-surface-hover);
			color: var(--danger);
		}
		.runnable-panels-viewport {
			overflow: hidden;
			width: 100%;
			height: 400px;
			background: var(--code-bg);
		}
		.runnable-panels-wrapper {
			display: flex;
			width: 300%;
			height: 100%;
			transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
		}
		.runnable-panel {
			width: 33.3333%;
			height: 100%;
			flex-shrink: 0;
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}
		.runnable-panel.panel-source {
			overflow: auto;
		}
		.runnable-panel.panel-source pre {
			margin: 0 !important;
			border-radius: 0 !important;
			height: 100%;
			background: transparent !important;
		}
		.runnable-panel.panel-editor {
			background: var(--bg-surface);
		}
		.runnable-editor-el {
			flex: 1;
			min-height: 0;
			height: 100%;
		}
		.runnable-panel.panel-iframe {
			background: rgb(255, 255, 255);
		}
		.runnable-iframe-el {
			width: 100%;
			height: 100%;
			border: none;
			background: rgb(255, 255, 255);
		}
	</style>
</head>

	<script src="vendor/cm-md-bundle.js"></script>
	<script>
		const { EditorView, basicSetup, markdown, oneDark } = window.CM_MD;

		const openBtn = document.getElementById("open-btn");
		const pasteBtn = document.getElementById("paste-btn");
		const fileInput = document.getElementById("file-input");
		const fileListContainer = document.getElementById("file-list");
		const contentArea = document.getElementById("content");
		const editorContainer = document.getElementById("editor-container");
		const editorEl = document.getElementById("editor");
		const emptyState = document.getElementById("empty-state");
		const sidebar = document.getElementById("sidebar");
		const mobileMenu = document.getElementById("mobile-menu");
		const closeSidebar = document.getElementById("close-sidebar");
		const zoomLabel = document.getElementById("zoom-level");
		const editControls = document.getElementById("edit-controls");
		const toggleEditBtn = document.getElementById("toggle-edit-btn");
		const toggleText = document.getElementById("toggle-text");
		let loadedFiles = new Map();
		let currentZoom = 1.0;
		var isEditing = true;
		var currentFileName = "Untitled.md";
		var editor = null;
		let lineWrap = true;
		let currentFileHandle = null;
		let _isEditingWidgetCode = false;

		function updateMarkdownCodeBlock(blockIndex, newCode) {
			if (!editor) return;
			const text = editor.state.doc.toString();
			let currentIndex = 0;
			// Match code fences: ```html or ```xml
			const regex = /(^|\n)([`~]{3,})(html|xml)\s*\n([\s\S]*?)\n\2(?=\n|$)/g;
			let match;
			let found = false;

			while ((match = regex.exec(text)) !== null) {
				if (currentIndex === blockIndex) {
					const matchStart = match.index;
					const matchEnd = regex.lastIndex;
					// Reconstruct code block with the same delimiter and type
					const newBlock = match[1] + match[2] + match[3] + "\n" + newCode + "\n" + match[2];
					const replacedText = text.substring(0, matchStart) + newBlock + text.substring(matchEnd);
					
					_isEditingWidgetCode = true;
					const transaction = editor.state.update({
						changes: { from: 0, to: text.length, insert: replacedText }
					});
					editor.dispatch(transaction);
					_isEditingWidgetCode = false;
					found = true;
					break;
				}
				currentIndex++;
			}
		}

		function convertToRunnable(container, preEl, blockIndex) {
			const codeEl = preEl.querySelector('code');
			const initialCode = codeEl ? codeEl.textContent : "";

			// Remove the floating button
			const runBtn = container.querySelector('.btn-run-code');
			if (runBtn) runBtn.remove();

			// Create the Tab header and panels viewport
			const header = document.createElement('div');
			header.className = 'runnable-header';
			header.innerHTML = `
				<div class="runnable-tabs">
					<button class="runnable-tab active" data-tab="0">Source</button>
					<button class="runnable-tab" data-tab="1">Editor</button>
					<button class="runnable-tab" data-tab="2">Preview</button>
				</div>
				<button class="runnable-close-btn" title="Revert to static code">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
					</svg>
				</button>
			`;

			const viewport = document.createElement('div');
			viewport.className = 'runnable-panels-viewport';
			viewport.innerHTML = `
				<div class="runnable-panels-wrapper">
					<div class="runnable-panel panel-source"></div>
					<div class="runnable-panel panel-editor">
						<div class="runnable-editor-el"></div>
					</div>
					<div class="runnable-panel panel-iframe">
						<iframe class="runnable-iframe-el" sandbox="allow-scripts"></iframe>
					</div>
				</div>
			`;

			container.appendChild(header);
			container.appendChild(viewport);

			const panelsWrapper = viewport.querySelector('.runnable-panels-wrapper');
			const panelSource = viewport.querySelector('.panel-source');
			const panelEditorEl = viewport.querySelector('.runnable-editor-el');
			const iframeEl = viewport.querySelector('.runnable-iframe-el');

			// Move the original preEl into panelSource
			panelSource.appendChild(preEl);

			// Initialize iframe content
			iframeEl.srcdoc = initialCode;

			// Set up tabs switching
			const tabs = header.querySelectorAll('.runnable-tab');
			tabs.forEach(tab => {
				tab.onclick = () => {
					tabs.forEach(t => t.classList.remove('active'));
					tab.classList.add('active');
					const tabIdx = parseInt(tab.getAttribute('data-tab'), 10);
					panelsWrapper.style.transform = `translateX(-${(tabIdx * 100) / 3}%)`;
				};
			});

			let innerEditor = null;

			// Set up close button to revert
			const closeBtn = header.querySelector('.runnable-close-btn');
			closeBtn.onclick = () => {
				// Revert container back to simple preEl
				container.innerHTML = "";
				container.appendChild(preEl);

				// Re-add floating run button
				const newRunBtn = document.createElement('button');
				newRunBtn.className = 'btn-run-code';
				newRunBtn.innerHTML = `
					<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
						<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
					</svg>
					<span>Run</span>
				`;
				container.appendChild(newRunBtn);
				newRunBtn.onclick = () => {
					convertToRunnable(container, preEl, blockIndex);
				};

				// Destroy CodeMirror instance if exists
				if (innerEditor) {
					innerEditor.destroy();
				}
			};

			// Initialize CodeMirror inside Panel 2 (Editor)
			const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
			innerEditor = new EditorView({
				doc: initialCode,
				extensions: [
					basicSetup,
					markdown(),
					isDark ? oneDark : [],
					EditorView.theme({
						"&": { height: "100%", fontSize: "var(--editor-font-size)", backgroundColor: "var(--bg-surface)" },
						".cm-scroller": { overflow: "auto", fontFamily: "var(--font-mono)" },
						".cm-content": { fontWeight: "400 !important", fontFamily: "var(--font-mono) !important" },
						".cm-line": { fontWeight: "400 !important" },
						".cm-gutters": { backgroundColor: "var(--bg-surface)", borderRightColor: "var(--border-subtle)", color: "var(--text-tertiary)" }
					}),
					EditorView.lineWrapping,
					EditorView.updateListener.of((update) => {
						if (update.docChanged) {
							const newCode = update.state.doc.toString();

							// 1. Update running iframe
							iframeEl.srcdoc = newCode;

							// 2. Update Tab 1 code and re-prism highlight
							if (codeEl) {
								codeEl.textContent = newCode;
								Prism.highlightElement(codeEl);
							}

							// 3. Update main editor document
							updateMarkdownCodeBlock(blockIndex, newCode);
						}
					})
				],
				parent: panelEditorEl
			});
		}

		// ── Two-way sync state ─────────────────────────────────────────────
		let syncVersion = 0;           // Monotonically increasing counter
		let syncTargetOrigin = '*';     // Target origin for outbound messages
		let syncPendingChange = null;   // Pending contentChange payload
		let syncDebounceTimer = null;   // Debounce timer for contentChange
		let _syncLoadingContent = false; // True while loadContent is in flight
		const SYNC_DEBOUNCE_MS = 300;   // Debounce interval for contentChange

		// Helper: post message to parent with proper origin handling.
		// CRITICAL: always send to event.origin (the parent's origin from the
		// inbound loadContent), NOT to syncTargetOrigin. The targetOrigin
		// option in loadContent is meant as a security constraint ("only
		// accept loadContent from this origin"), not as the outbound target.
		// Using it as the outbound target causes the browser to silently
		// drop messages whenever the host sets it to the iframe's own
		// origin (a common mistake — the host should set it to its own
		// origin, or omit it entirely).
		function syncPostMessage(payload) {
			try {
				window.parent?.postMessage(payload, syncTargetOrigin);
			} catch (e) {
				console.error('[mdv] syncPostMessage failed:', e);
			}
		}

		// Flush any pending contentChange immediately (used on unload)
		function syncFlushImmediate() {
			if (syncDebounceTimer) {
				clearTimeout(syncDebounceTimer);
				syncDebounceTimer = null;
			}
			if (syncPendingChange) {
				syncVersion++;
				const p = syncPendingChange;
				syncPendingChange = null;
				syncPostMessage({
					type: 'contentChange',
					text: p.text,
					filename: p.filename,
					format: 'markdown',
					version: syncVersion,
					selection: p.selection
				});
			}
		}

		// Schedule a debounced contentChange post
		function syncScheduleChange(text, selection) {
			syncPendingChange = {
				text: text,
				filename: currentFileName || 'Untitled.md',
				selection: selection
			};
			clearTimeout(syncDebounceTimer);
			syncDebounceTimer = setTimeout(() => {
				if (!syncPendingChange) return;
				syncVersion++;
				const p = syncPendingChange;
				syncPendingChange = null;
				syncDebounceTimer = null;
				syncPostMessage({
					type: 'contentChange',
					text: p.text,
					filename: p.filename,
					format: 'markdown',
					version: syncVersion,
					selection: p.selection
				});
			}, SYNC_DEBOUNCE_MS);
		}

		// Beforeunload: flush any pending changes
		window.addEventListener('beforeunload', () => {
			syncFlushImmediate();
		});

		const isFileSystemApiSupported = "showDirectoryPicker" in window;
		const MDV_STORAGE_KEY = window.name && window.name.startsWith('tab_')
			? `mdv_state_${window.name}`
			: 'mdv_state_default';
		const MDV_LEGACY_MARKDOWN_KEY = `${MDV_STORAGE_KEY}_markdown`;

		function getCurrentComments() {
			if (window.MdvComments && typeof MdvComments.getComments === "function") {
				return MdvComments.getComments() || [];
			}
			return [];
		}

		function saveMdvState() {
			if (!editor) return;

			const state = {
				markdown: editor.state.doc.toString(),
				comments: getCurrentComments()
			};

			localStorage.setItem(MDV_STORAGE_KEY, JSON.stringify(state));
			localStorage.setItem(MDV_LEGACY_MARKDOWN_KEY, state.markdown);
		}

		function loadMdvState() {
			const raw = localStorage.getItem(MDV_STORAGE_KEY);
			if (!raw) return "";

			try {
				const state = JSON.parse(raw);
				if (state && typeof state === "object") {
					if (window.MdvComments && typeof MdvComments.setComments === "function") {
						MdvComments.setComments(Array.isArray(state.comments) ? state.comments : []);
					}
					return typeof state.markdown === "string" ? state.markdown : "";
				}
			} catch (e) {
				return raw;
			}

			return "";
		}

		function updateTabTitle() {
			const text = editor ? editor.state.doc.toString() : "";
			let title = currentFileName || "Untitled.md";

			const trimmed = text.trimStart();
			if (trimmed.startsWith('# ')) {
				const lineEnd = trimmed.indexOf('\n');
				const firstLine = lineEnd === -1 ? trimmed : trimmed.substring(0, lineEnd);
				const heading = firstLine.substring(2).trim();
				if (heading) {
					title = heading.length > 30 ? heading.substring(0, 30) + '...' : heading;
				}
			}

			document.title = title;
			if (window.parent && window.parent !== window) {
				syncPostMessage({ type: 'titleChange', title: title, version: syncVersion });
			}
		}

		// Initialize CodeMirror
		function initEditor(initialValue = "") {
			if (editor) {
				editor.destroy();
			}

			const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
			const extensions = [
				basicSetup,
				markdown(),
				isDark ? oneDark : [],
				EditorView.theme({
					"&": { height: "100%", fontSize: "var(--editor-font-size)", backgroundColor: "var(--bg-surface)" },
					".cm-scroller": { overflow: "auto", fontFamily: "var(--font-mono)" },
					".cm-content": { fontWeight: "400 !important", fontFamily: "var(--font-mono) !important" },
					".cm-line": { fontWeight: "400 !important" },
					".ͼ1 .cm-keyword": { fontWeight: "500 !important" },
					".ͼ1 .cm-variableName": { fontWeight: "400 !important" },
					".ͼ1 .cm-typeName": { fontWeight: "500 !important" },
					".cm-gutters": { backgroundColor: "var(--bg-surface)", borderRightColor: "var(--border-subtle)", color: "var(--text-tertiary)" }
				}),
				EditorView.domEventHandlers({
					keydown(event, view) {
						if (event.key === 'Tab') {
							event.preventDefault();
							const { state } = view;
							const { from, to } = state.selection.main;
							const fromLine = state.doc.lineAt(from);
							const toLine = state.doc.lineAt(to);
							
							if (event.shiftKey) {
								// Shift+Tab: Dedent
								const changes = [];
								for (let i = fromLine.number; i <= toLine.number; i++) {
									const line = state.doc.line(i);
									if (line.text.startsWith('\t')) {
										changes.push({ from: line.from, to: line.from + 1 });
									} else {
										const m = line.text.match(/^ {1,4}/);
										if (m) changes.push({ from: line.from, to: line.from + m[0].length });
									}
								}
								if (changes.length) view.dispatch({ changes, userEvent: 'delete.dedent' });
							} else {
								// Tab: Indent
								if (fromLine.number !== toLine.number || !state.selection.main.empty) {
									const changes = [];
									for (let i = fromLine.number; i <= toLine.number; i++) {
										const line = state.doc.line(i);
										changes.push({ from: line.from, insert: '\t' });
									}
									view.dispatch({ changes, userEvent: 'input.indent' });
								} else {
									view.dispatch(state.update(state.replaceSelection('\t'), { scrollIntoView: true, userEvent: 'input' }));
								}
							}
							return true;
						}
					},
					paste(event, view) {
						const text = (event.clipboardData || window.clipboardData).getData('text');
						if (text) {
							let cleaned = text;
							if (window.MdvComments) {
								const parsed = MdvComments.parseFromMarkdown(cleaned);
								cleaned = parsed.markdown;
								if (parsed.comments && parsed.comments.length > 0) {
									MdvComments.setComments(parsed.comments);
									saveMdvState();
								}
							}
							cleaned = cleanMarkdownQuotesAndBackticks(cleaned);

							event.preventDefault();
							const transaction = view.state.update({
								changes: view.state.selection.ranges.map(range => ({
									from: range.from,
									to: range.to,
									insert: cleaned
								})),
								selection: { anchor: view.state.selection.main.from + cleaned.length }
							});
							view.dispatch(transaction);
							return true;
						}
					}
				}),
				EditorView.updateListener.of((update) => {
					if (update.docChanged) {
						// Skip changes that originated from our own loadContent
						// (initEditor called while _syncLoadingContent is true)
						if (_syncLoadingContent) return;
						// Schedule a contentChange (debounced)
						const text = update.state.doc.toString();
						const sel = update.state.selection.main;
						const selection = { from: sel.from, to: sel.to };
						syncScheduleChange(text, selection);
						saveMdvState();
						updateTabTitle();
						if (_isEditingWidgetCode) return;
						updatePreview();
					}
				})
			];

			if (lineWrap) {
				extensions.push(EditorView.lineWrapping);
			}

			editor = new EditorView({
				doc: initialValue,
				extensions: extensions,
				parent: editorEl
			});
		}

		function enhanceContent() {
			// ── GFM Alerts: transform > [!NOTE] blockquotes ──
			contentArea.querySelectorAll('blockquote').forEach(bq => {
				const firstP = bq.querySelector('p');
				if (!firstP) return;
				const match = firstP.textContent.match(/^\[!([A-Z]+)\]/);
				if (!match) return;
				const types = { NOTE: 'note', TIP: 'tip', IMPORTANT: 'important', WARNING: 'warning', CAUTION: 'caution' };
				const type = types[match[1]];
				if (!type) return;
				firstP.innerHTML = firstP.innerHTML.replace(/^\[!([A-Z]+)\]\s*/, '');
				const wrapper = document.createElement('div');
				wrapper.className = 'markdown-alert markdown-alert-' + type;
				// Build title row
				const icons = {
					note: '<path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75h.5A.75.75 0 0 1 7.75 8v3a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1 0-1.5h.25V8.5h-.25a.75.75 0 0 1 0-1.5ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/>',

		function updatePreview() {
			if (editor) {
				const text = editor.state.doc.toString();
				contentArea.innerHTML = DOMPurify.sanitize(marked.parse(text));
				if (!isEditing) enhanceContent();
				updateOutline();
				Prism.highlightAllUnder(contentArea);
				if (window.MdvComments) MdvComments.applyHighlights();
				updateFooterInfo();
			}
		}

		function formatSize(bytes) {
			if (bytes < 1024) return bytes + ' B';
			if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
			return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
		}

		function updateFooterInfo() {
			const el = document.getElementById('footer-file-info');
			if (!el || !editor) return;
			const text = editor.state.doc.toString();
			const bytes = new TextEncoder().encode(text).length;
			const lines = editor.state.doc.lines;
			const parts = [];
			if (currentFileName) parts.push(currentFileName);
			parts.push(formatSize(bytes));
			parts.push(lines + ' line' + (lines !== 1 ? 's' : ''));
			el.textContent = parts.join(' · ');
		}

		function updateOutline() {
			if (!editor) return;
			const text = editor.state.doc.toString();
			const outlineList = document.getElementById("outline-list");
			const headings = [];

			const lines = text.split("\n");
			let inCodeBlock = false;
			let codeBlockLang = "";
			let currentHeadingLevel = 0;
			let codeBlockHeadingLevel = 1;

			lines.forEach((line, index) => {
				const trimmed = line.trim();
				// Check for code fence start/end
				if (trimmed.startsWith("```") || trimmed.startsWith("~~~")) {
					if (!inCodeBlock) {
						inCodeBlock = true;
						// Extract language
						const langMatch = trimmed.match(/^[`~]{3,}\s*(\w*)/);
						codeBlockLang = (langMatch && langMatch[1]) ? langMatch[1] : "code";
						const blockLevel = Math.min(currentHeadingLevel + 1, 6);
						headings.push({
							level: blockLevel,
							text: `Code (${codeBlockLang})`,
							line: index
						});
						codeBlockHeadingLevel = Math.min(blockLevel + 1, 6);
					} else {
						inCodeBlock = false;
					}
					return;
				}

				if (inCodeBlock) {
					// Check for comments or headings inside the code block
					const match = line.match(/^(#{1,6})\s+(.+)$/);
					if (match) {
						const innerLevel = match[1].length;
						const absoluteLevel = Math.min(codeBlockHeadingLevel + (innerLevel - 1), 6);
						headings.push({
							level: absoluteLevel,
							text: match[2].trim(),
							line: index
						});
					}
				} else {
					const match = line.match(/^(#{1,6})\s+(.+)$/);
					if (match) {
						const level = match[1].length;
						currentHeadingLevel = level;
						headings.push({
							level: level,
							text: match[2].trim(),
							line: index
						});
					}
				}
			});

			if (headings.length === 0) {
				outlineList.innerHTML = '<div class="text-gray-400 text-xs italic p-8 text-center">No headings found.</div>';
				return;
			}

			outlineList.innerHTML = headings.map((h, i) => `
				<button 
					data-index="${i}"
					data-line="${h.line}"
					data-text="${encodeURIComponent(h.text)}"
					class="outline-item w-full text-left px-3 py-1.5 rounded-md text-[11px] transition-all truncate hover:bg-[var(--bg-surface-hover)]"
					data-level="${h.level}"
				>
					${h.text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")}
				</button>
			`).join("");

			outlineList.querySelectorAll(".outline-item").forEach(btn => {
				btn.onclick = () => {
					const line = parseInt(btn.getAttribute("data-line"), 10);
					const text = decodeURIComponent(btn.getAttribute("data-text"));
					scrollToHeading(line, text);
				};
			});
		}

		function stripMarkdown(text) {
			if (typeof text !== "string") return "";
			return text
				.replace(/`([^`]+)`/g, "$1") // inline code
				.replace(/\*\*([^*]+)\*\*/g, "$1") // bold
				.replace(/\*([^*]+)\*/g, "$1") // italic
				.replace(/__([^_]+)__/g, "$1") // bold
				.replace(/_([^_]+)_/g, "$1") // italic
				.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1") // links
				.replace(/\\(.)/g, "$1") // escaped characters
				.trim();
		}

		window.scrollToHeading = (line, originalText) => {
			if (isEditing && editor) {
				const pos = editor.state.doc.line(line + 1).from;
				editor.dispatch({
					selection: { anchor: pos, head: pos },
					scrollIntoView: true
				});
				editor.focus();
			} else {
				// Find heading in contentArea
				const headers = contentArea.querySelectorAll("h1, h2, h3, h4, h5, h6");
				let found = false;
				const cleanMDText = stripMarkdown(originalText).replace(/\s+/g, " ");
				for (const h of headers) {
					const cleanHTMLText = h.textContent.trim().replace(/\s+/g, " ");
					if (cleanHTMLText === cleanMDText) {
						h.scrollIntoView({ behavior: "smooth", block: "start" });
						found = true;
						break;
					}
				}
				if (!found) {
					const codeBlocks = contentArea.querySelectorAll("pre");
					for (const pre of codeBlocks) {
						const cleanPreText = pre.textContent.replace(/\s+/g, " ");
						if (cleanPreText.includes(cleanMDText)) {
							pre.scrollIntoView({ behavior: "smooth", block: "start" });
							break;
						}
					}
				}
			}
			// Close sidebar on mobile devices to reveal the heading
			if (window.innerWidth < 768) {
				const closeBtn = document.getElementById("close-sidebar");
				if (closeBtn && document.body.classList.contains("mobile-sidebar-active")) {
					closeBtn.click();
				}
			}
		};

		const mathExtension = {
			name: 'math',
			level: 'inline',
			start(src) { return src.indexOf('$'); },
			tokenizer(src, tokens) {
				const blockRule = /^\$\$\n?([\s\S]+?)\n?\$\$/;
				const inlineRule = /^\$((?:\S)|(?:\S[\s\S]*?\S))\$(?!\d)/;

				let match;
				if (match = blockRule.exec(src)) {
					return {
						type: 'math',
						raw: match[0],
						text: match[1].trim(),
						displayMode: true
					};
				} else if (match = inlineRule.exec(src)) {
					return {
						type: 'math',
						raw: match[0],
						text: match[1].trim(),
						displayMode: false
					};
				}
			},
			renderer(token) {
				// Repair common LaTeX commands that can be corrupted before rendering.
				// Scope this to math only so normal text and intentional tabs are untouched.
				const repairedText = token.text
					// \text and \times can become a tab followed by ext/imes when markdown
					// passes through a JS string literal.
					.replace(/\t(?=(?:ext|imes)\b)/g, "\\t")
					// \mathbf can arrive as plain mathbf when an upstream parser strips the
					// backslash. Only repair the command form immediately before `{...}`.
					.replace(/(^|[^\\\w])mathbf(?=\s*\{)/g, "$1\\mathbf");
				try {
					return katex.renderToString(repairedText, {
						displayMode: token.displayMode,
						throwOnError: false
					});
				} catch (e) {
					console.error('KaTeX error:', e);
					return token.raw;
				}
			}
		};

		marked.use({ extensions: [mathExtension] });

		marked.setOptions({
			highlight: (code, lang) => {
				if (Prism.languages[lang]) {
					return Prism.highlight(code, Prism.languages[lang], lang);
				}
				return code;
			},
			breaks: true,
			gfm: true
		});

		async function handleFileSelect(files) {
			fileListContainer.innerHTML = "";
			loadedFiles.clear();
			Array.from(files).forEach((file) => {
				const lower = file.name.toLowerCase();
				if (lower.endsWith(".md") || lower.endsWith(".markdown") || lower.endsWith(".txt")) {
					loadedFiles.set(file.name, { file: file, handle: null });
					renderFileListItem(file.name);
				}
			});
			if (loadedFiles.size === 0) {
				fileListContainer.innerHTML = '<div class="p-4 text-center text-xs text-red-500">No Markdown or text files found.</div>';

				const firstBtn = fileListContainer.querySelector('.file-item');
				if (firstBtn) firstBtn.click();
			}
		}

		function renderFileListItem(name) {
			const btn = document.createElement("button");
			btn.className = "file-item";
			btn.innerHTML = `<svg class="w-4 h-4 shrink-0" style="color:var(--text-tertiary)" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 012-2h4.586A1 1 0 0111.293 2.707l2 2A1 1 0 0113.586 6H16a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"></path></svg><span class="truncate">${name}</span>`;
			btn.onclick = () => displayFile(name, btn);
			fileListContainer.appendChild(btn);
		}

		function cleanMarkdownQuotesAndBackticks(text) {
			if (typeof text !== "string") return text;
			let t = text.trim();
			let changed = true;
			while (changed) {
				changed = false;
				if (t.startsWith('"') && t.endsWith('"')) {
					t = t.slice(1, -1).trim();
					changed = true;
				}
				if (t.startsWith('```') && t.endsWith('```')) {
					t = t.slice(3, -3).trim();
					// Remove language tag at the beginning if any, e.g. "markdown\n" or "javascript\n"
					const firstNewLine = t.indexOf('\n');
					if (firstNewLine !== -1) {
						const firstLine = t.slice(0, firstNewLine).trim();
						if (/^[a-zA-Z0-9_-]+$/.test(firstLine)) {
							t = t.slice(firstNewLine + 1).trim();
						}
					}
					changed = true;
				}
			}
			return t;
		}

		async function displayFile(name, element) {
			const item = loadedFiles.get(name);
			if (!item) return;

			let file, handle;
			if (item.handle !== undefined) {
				file = item.file;
				handle = item.handle;
			} else {
				file = item;
				handle = null;
			}

			let text = await (file.text ? file.text() : readFileAsText(file));
			text = cleanMarkdownQuotesAndBackticks(text);
			currentFileName = name;
			currentFileHandle = handle;

			// Toggle Reload and Overwrite buttons based on whether we have a file handle
			const reloadBtn = document.getElementById("reload-btn");
			const overwriteBtn = document.getElementById("overwrite-btn");
			if (handle) {
				if (reloadBtn) reloadBtn.classList.remove("hidden");
				if (overwriteBtn) overwriteBtn.classList.remove("hidden");
			} else {
				if (reloadBtn) reloadBtn.classList.add("hidden");
				if (overwriteBtn) overwriteBtn.classList.add("hidden");
			}

			// Parse embedded comments if present
			if (window.MdvComments) {
				const parsed = MdvComments.parseFromMarkdown(text);
				text = parsed.markdown;
				MdvComments.setComments(parsed.comments);
			}

			document.querySelectorAll(".file-item").forEach((el) => el.classList.remove("active"));
			if (element) element.classList.add("active");

			// Initialize editor with current text
			initEditor(text);
			updatePreview();
			updateTabTitle();

			if (window.innerWidth < 1024) {
				isEditing = false;
				updateViewMode();
			}

			if (window.innerWidth < 768 && document.body.classList.contains("mobile-sidebar-active")) toggleSidebar();
		}

		function updateViewMode() {
			if (isEditing) {
				contentArea.classList.add("hidden");
				editorContainer.classList.remove("hidden");
				toggleText.textContent = "View";
				toggleEditBtn.style.background = "var(--accent)";
				toggleEditBtn.style.color = "#fff";
				toggleEditBtn.style.borderColor = "var(--accent)";
			} else {
				contentArea.classList.remove("hidden");
				editorContainer.classList.add("hidden");
				toggleText.textContent = "Edit";
				toggleEditBtn.style.background = "";
				toggleEditBtn.style.color = "";
				toggleEditBtn.style.borderColor = "";
			}
			updatePreview();
		}

		toggleEditBtn.onclick = () => {
			isEditing = !isEditing;
			updateViewMode();
		};

		window.addEventListener('resize', updateViewMode);



		function readFileAsText(file) {
			return new Promise((resolve) => {
				const reader = new FileReader();
				reader.onload = (e) => resolve(e.target.result);
				reader.readAsText(file);
			});
		}

					if (entry.kind === "file" && (entry.name.toLowerCase().endsWith(".md") || entry.name.toLowerCase().endsWith(".markdown") || entry.name.toLowerCase().endsWith(".txt"))) {
						const file = await entry.getFile();

		window.reloadFile = async function () {
			if (!currentFileName || !currentFileHandle) return;
			try {
				const file = await currentFileHandle.getFile();
				let text = await (file.text ? file.text() : readFileAsText(file));

				if (window.MdvComments) {
					const parsed = MdvComments.parseFromMarkdown(text);
					text = parsed.markdown;
					MdvComments.setComments(parsed.comments);
				}

				if (editor) {
					const transaction = editor.state.update({
						changes: { from: 0, to: editor.state.doc.length, insert: text }
					});
					editor.dispatch(transaction);
				} else {
					initEditor(text);
				}
				updatePreview();

				const item = loadedFiles.get(currentFileName);

			// Resizer drag logic
			let activeResizer = null;
			let resizerAbove = null;
			let resizerBelow = null;
			let startY = 0;
			let startAboveH = 0;
			let startBelowH = 0;

			function getExpandedNeighbors(resizerEl) {
				let above = null, below = null;
				let prev = resizerEl.previousElementSibling;
				while (prev) {
					if (prev.classList.contains('sidebar-panel') && !prev.classList.contains('collapsed')) {
						above = prev; break;
					}
					prev = prev.previousElementSibling;
				}
				let next = resizerEl.nextElementSibling;
				while (next) {
					if (next.classList.contains('sidebar-panel') && !next.classList.contains('collapsed')) {
						below = next; break;
					}
					next = next.nextElementSibling;
				}
				return { above, below };
			}

			resizers.forEach(r => {
				r.addEventListener("pointerdown", (e) => {
					const neighbors = getExpandedNeighbors(r);
					if (!neighbors.above || !neighbors.below) return;
					activeResizer = r;
					resizerAbove = neighbors.above;
					resizerBelow = neighbors.below;
					startY = e.clientY;
					startAboveH = resizerAbove.getBoundingClientRect().height;
					startBelowH = resizerBelow.getBoundingClientRect().height;
					document.body.style.cursor = "ns-resize";
					document.body.classList.add("select-none");
					e.preventDefault();
				});
			});

			document.addEventListener("pointermove", (e) => {
				if (!activeResizer) return;
				const delta = e.clientY - startY;
				const newAbove = Math.max(40, startAboveH + delta);
				const newBelow = Math.max(40, startBelowH - delta);
				resizerAbove.style.flex = `0 0 ${newAbove}px`;
				resizerBelow.style.flex = `0 0 ${newBelow}px`;
			});

			document.addEventListener("pointerup", () => {
				if (activeResizer) {
					activeResizer = null;
					resizerAbove = null;
					resizerBelow = null;
					document.body.style.cursor = "";
					document.body.classList.remove("select-none");
				}
			});
		})();

	<script type="module">
		import { detectDevice as engineDetectDevice, initPipeline, loadEmbedding, synthesize, audioToWavBlob, formatTime, clearEmbeddingCache } from './tts-engine.js';

		// ── State ────────────────────────────────────────────────
		let ttsPipeline = null;
		let pipelineDevice = 'wasm';

		let speakModeActive = false;
		let readBlocks = [];
		let currentBlockIdx = -1;
		let savedBlockIdx = -1;
		let isPlaying = false;
		let isScanning = false;
		let prefetchCache = new Map(); // blockIdx -> Blob
		let prefetchQueue = new Set(); // blockIdxes currently being synthesized

		// ── DOM Refs ─────────────────────────────────────────────
		const playerBar = document.getElementById('tts-player-bar');
		const ppBtn = document.getElementById('tts-play-pause-btn');
		const prevBtn = document.getElementById('tts-prev-btn');
		const nextBtn = document.getElementById('tts-next-btn');
		const closeBtn = document.getElementById('tts-close-btn');
		const ppIcon = document.getElementById('tts-pp-icon');
		const barText = document.getElementById('tts-bar-block-text');
		const barLabel = document.getElementById('tts-bar-block-label');
		const voiceSelect = document.getElementById('tts-bar-voice');
		const speedSelect = document.getElementById('tts-bar-speed');
		const spinner = document.getElementById('tts-spinner');
		const progressFill = document.getElementById('tts-progress-fill');
		const audioEl = document.getElementById('tts-audio-el');
		const toggleDot = document.getElementById('tts-toggle-dot');
		const contentArea = document.getElementById('content');

		// ── Hardware Detection ────────────────────────────────────
		async function detectDevice() {
			pipelineDevice = await engineDetectDevice();
		}

		// ── Pipeline Loader ───────────────────────────────────────
		async function getPipeline() {
			if (ttsPipeline) return ttsPipeline;
			setBarText('Loading TTS model (' + pipelineDevice.toUpperCase() + ')…', 'Downloading');
			spinner.classList.add('active');
			try {
				ttsPipeline = await initPipeline(pipelineDevice);
				setBarText('TTS model loaded', 'Ready');
			} catch (err) {
				console.error('[TTS] Pipeline init failed', err);
				setBarText('Model failed to load', 'Error');
			} finally {
				spinner.classList.remove('active');
			}
			return ttsPipeline;
		}

		// ── Text Extraction ───────────────────────────────────────
		function cleanTextOf(el) {
			// Remove katex markup noise, code blocks, keep natural readable text
			const clone = el.cloneNode(true);
			// Remove <code> and <pre> contents (not readable aloud usefully)
			clone.querySelectorAll('code, pre, .katex, .katex-display').forEach(n => n.remove());
			return clone.textContent.replace(/\s+/g, ' ').trim();
		}

		// ── Block Scanning ────────────────────────────────────────
		const BLOCK_SELECTORS = 'p, h1, h2, h3, h4, h5, h6, blockquote, li';

		function scanBlocks() {
			isScanning = true;

			// Remove any previous wrappers
			contentArea.querySelectorAll('.tts-block-wrapper').forEach(w => {
				const child = w.firstElementChild;
				if (child) w.replaceWith(child);
			});
			readBlocks = [];

			if (!speakModeActive) { isScanning = false; return; }

			const els = Array.from(contentArea.querySelectorAll(BLOCK_SELECTORS))
				.filter(el => {
					// Skip nested: li inside li, p inside blockquote sub-elements, etc.
					const parent = el.parentElement;
					if (!parent) return false;
					if (el.tagName === 'LI' && parent.tagName === 'LI') return false;
					if (el.tagName === 'P' && parent.tagName === 'BLOCKQUOTE') return false;
					return cleanTextOf(el).length > 0;
				});

			els.forEach((el, idx) => {
				// Wrap each block so we can position the speak button absolutely
				const wrapper = document.createElement('div');
				wrapper.className = 'tts-block-wrapper';
				el.parentNode.insertBefore(wrapper, el);
				wrapper.appendChild(el);

				const btn = document.createElement('button');
				btn.className = 'tts-speak-btn';
				btn.title = 'Read aloud from here';
				btn.setAttribute('aria-label', 'Read aloud from here');
				btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>';
				btn.onclick = (e) => { e.stopPropagation(); startFromBlock(idx); };
				wrapper.appendChild(btn);

				readBlocks.push({ el, wrapper, text: cleanTextOf(el) });
			});

			isScanning = false;
		}

		// ── Synthesis ─────────────────────────────────────────────
		async function synthesizeBlock(idx) {
			if (prefetchCache.has(idx)) return prefetchCache.get(idx);
			if (prefetchQueue.has(idx)) {
				while (prefetchQueue.has(idx)) await new Promise(r => setTimeout(r, 80));
				return prefetchCache.get(idx) || null;
			}
			prefetchQueue.add(idx);
			try {
				const pipe = await getPipeline();
				if (!pipe) return null;
				const block = readBlocks[idx];
				if (!block) return null;
				const voice = voiceSelect.value;
				const speed = parseFloat(speedSelect.value);
				const embedding = await loadEmbedding(voice);
				const output = await synthesize(pipe, block.text, embedding, speed, 10);
				const blob = audioToWavBlob(output.audio, output.sampling_rate);
				prefetchCache.set(idx, blob);
				return blob;
			} catch (err) {
				console.error('[TTS] Synthesis error at block', idx, err);
				return null;
			} finally {
				prefetchQueue.delete(idx);
			}
		}

		// ── Playback ──────────────────────────────────────────────
		function setBarText(text, label) {
			barText.textContent = text || '—';
			if (label !== undefined) barLabel.textContent = label;
		}

		function updateProgress() {
			if (readBlocks.length === 0) { progressFill.style.width = '0%'; return; }
			const pct = ((currentBlockIdx + 1) / readBlocks.length) * 100;
			progressFill.style.width = pct + '%';
		}

		function setBlockActive(idx) {
			readBlocks.forEach((b, i) => {
				b.wrapper.classList.toggle('tts-active-block', i === idx);
			});
			if (readBlocks[idx]) {
				const el = readBlocks[idx].el;
				el.scrollIntoView({ behavior: 'smooth', block: 'center' });
			}
		}

		function setPPIcon(playing) {
			if (playing) {
				ppIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>';
			} else {
				ppIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
			}
		}

		async function playBlock(idx) {
			if (idx < 0 || idx >= readBlocks.length) {
				stopAll();
				return;
			}
			currentBlockIdx = idx;
			setBlockActive(idx);
			updateProgress();
			setBarText(readBlocks[idx].text.slice(0, 100) + (readBlocks[idx].text.length > 100 ? '…' : ''), `Block ${idx + 1} of ${readBlocks.length}`);

			// Enable/disable nav buttons
			prevBtn.disabled = idx === 0;
			nextBtn.disabled = false;
			ppBtn.disabled = false;

			spinner.classList.add('active');
			isPlaying = true;
			setPPIcon(true);

			const blob = await synthesizeBlock(idx);
			spinner.classList.remove('active');

			if (!isPlaying) return; // Stopped while synthesizing
			if (!blob) {
				// Attempt next block on error
				playBlock(idx + 1);
				return;
			}

			// Revoke previous object URLs to avoid memory leaks
			if (audioEl.src && audioEl.src.startsWith('blob:')) {
				URL.revokeObjectURL(audioEl.src);
			}
			const url = URL.createObjectURL(blob);
			audioEl.src = url;
			await audioEl.play();

			// Prefetch next blocks in background
			for (let i = 1; i <= 3; i++) {
				if (idx + i < readBlocks.length) {
					synthesizeBlock(idx + i); // Fire and forget
				}
			}
		}

		audioEl.onended = () => {
			if (!isPlaying) return;
			playBlock(currentBlockIdx + 1);
		};

		// ── Controls ──────────────────────────────────────────────
		function stopAll() {
			isPlaying = false;
			setPPIcon(false);
			audioEl.pause();
			audioEl.src = '';
			spinner.classList.remove('active');
			ppBtn.disabled = readBlocks.length === 0;
			prevBtn.disabled = true;
			nextBtn.disabled = true;
			readBlocks.forEach(b => b.wrapper.classList.remove('tts-active-block'));
			progressFill.style.width = '0%';
			setBarText(readBlocks.length > 0 ? 'Finished — press Play to replay' : 'Select a paragraph to begin', 'TTS Reader');
			currentBlockIdx = -1;
		}

		function startFromBlock(idx) {
			// Invalidate prefetch cache when voice/speed might change
			prefetchCache.clear();
			playerBar.classList.add('visible');
			playBlock(idx);
		}

		ppBtn.onclick = () => {
			if (isPlaying) {
				isPlaying = false;
				audioEl.pause();
				setPPIcon(false);
			} else {
				if (currentBlockIdx === -1 && readBlocks.length > 0) {
					startFromBlock(0);
				} else {
					isPlaying = true;
					setPPIcon(true);
					if (audioEl.src && !audioEl.ended && audioEl.readyState >= 2) {
						audioEl.play();
					} else {
						playBlock(currentBlockIdx >= 0 ? currentBlockIdx : 0);
					}
				}
			}
		};

		prevBtn.onclick = () => {
			if (currentBlockIdx > 0) {
				prefetchCache.clear();
				playBlock(currentBlockIdx - 1);
			}
		};

		nextBtn.onclick = () => {
			if (currentBlockIdx < readBlocks.length - 1) {
				prefetchCache.delete(currentBlockIdx); // Keep next block cache
				playBlock(currentBlockIdx + 1);
			} else {
				stopAll();
			}
		};

		closeBtn.onclick = () => {
			if (speakModeActive) {
				window.ttsToggleSpeakMode();
			} else {
				stopAll();
				playerBar.classList.remove('visible');
			}
		};

		// Invalidate cache when settings change
		voiceSelect.onchange = () => { prefetchCache.clear(); };
		speedSelect.onchange = () => { prefetchCache.clear(); };

		// ── Speak Mode Toggle ─────────────────────────────────────
		window.ttsToggleSpeakMode = function () {
			speakModeActive = !speakModeActive;
			toggleDot.classList.toggle('visible', speakModeActive);

			if (!speakModeActive) {
				savedBlockIdx = currentBlockIdx;
				stopAll();
				playerBar.classList.remove('visible');
				// Remove wrappers
				contentArea.querySelectorAll('.tts-block-wrapper').forEach(w => {
					const child = w.firstElementChild;
					if (child) w.replaceWith(child);
				});
				readBlocks = [];
			} else {
				// Only available in view mode
				if (window.isEditing) {
					// Force view mode
					document.getElementById('toggle-edit-btn').click();
				}
				// Delay slightly to let preview render
				setTimeout(() => {
					scanBlocks();
					detectDevice();
					playerBar.classList.add('visible');
					if (savedBlockIdx >= 0 && savedBlockIdx < readBlocks.length) {
						currentBlockIdx = savedBlockIdx;
						setBlockActive(currentBlockIdx);
						const txt = readBlocks[currentBlockIdx].text;
						setBarText(txt.slice(0, 100) + (txt.length > 100 ? '…' : ''), `Block ${currentBlockIdx + 1} of ${readBlocks.length}`);
						ppBtn.disabled = false;
						prevBtn.disabled = currentBlockIdx === 0;
						nextBtn.disabled = false;
					}
				}, 100);
			}
		};

		// Re-scan blocks whenever the preview content updates
		// Hook into content mutations in view mode
		const contentObserver = new MutationObserver(() => {
			if (isScanning) return;
			if (speakModeActive && !window.isEditing) {
				// Invalidate old entries and re-scan after a brief debounce
				clearTimeout(contentObserver._debounce);
				contentObserver._debounce = setTimeout(() => {
					const wasPlayingIdx = currentBlockIdx;
					scanBlocks();
					if (wasPlayingIdx >= 0) setBlockActive(Math.min(wasPlayingIdx, readBlocks.length - 1));
				}, 300);
			}
		});
		contentObserver.observe(contentArea, { childList: true, subtree: false });

		// Initialize hardware detection eagerly
		detectDevice();
	</script>

		// ── Two-way sync: send ready message ─────────────────────────────
		if (window.parent && window.parent !== window) {
			// Send toolSelection as always (for backward compatibility)

		window.addEventListener('message', function (event) {

			if (!msg || msg.type !== 'loadContent') return;

			// Binary payload: mdv.html is a markdown editor and does not
			// render PDFs. Surface a toast and bail.
			if (msg.bytes && !(typeof msg.text === 'string' && msg.text.length > 0)) {
				const warn = 'mdv.html does not accept PDF bytes — load PDFs in pdf.html';

					window.MdvComments.toast(warn);
				} else {
					console.warn(warn);
				}

					type: 'error',
					code: 'load_failed',
					message: warn
				});
				return;
			}

			const text = typeof msg.text === 'string' ? msg.text : '';
			const filename = typeof msg.filename === 'string' ? msg.filename : 'Untitled.md';

			// Store the PARENT's origin for outbound messages. This is
			// event.origin — the Origin header of the page that sent this
			// loadContent. The `targetOrigin` option (if set) is validated
			// against event.origin as a security constraint, then ignored
			// for outbound routing. Using the option as the outbound target
			// is a common mistake that causes the browser to silently drop
			// contentChange / loadContentAck / titleChange messages when
			// the host sets it to the iframe's own origin.
			// event.origin can be the string "null" (when the sender is a
			// file:// page or sandboxed iframe), the empty string, or null.
			// None of those are valid postMessage targetOrigin values —
			// window.parent.postMessage(payload, "null") throws.
			let parentOrigin = event.origin;
			if (!parentOrigin || parentOrigin === 'null' || parentOrigin === 'null://null') {
				parentOrigin = '*';
			}
			if (msg.options?.targetOrigin && msg.options.targetOrigin !== '*' && parentOrigin !== '*' && msg.options.targetOrigin !== parentOrigin) {
				syncPostMessage({
					type: 'error',
					code: 'origin_mismatch',
					message: 'targetOrigin does not match the sender origin. Refusing to load.'
				});
				return;
			}
			syncTargetOrigin = parentOrigin;

			// Cancel any pending contentChange (content is being replaced)
			clearTimeout(syncDebounceTimer);
			syncDebounceTimer = null;
			syncPendingChange = null;

			// Set loading flag to skip change events from initEditor
			_syncLoadingContent = true;

			// Update state
			currentFileName = filename;

			// Reinitialise editor with new content
			initEditor(text);
			updatePreview();
			updateTabTitle();
			saveMdvState();

			// Switch to view mode if currently editing
			if (window.isEditing) {
				document.getElementById('toggle-edit-btn').click();
			}

			// Increment version and acknowledge back to sender.
			// Use the parent's origin (event.origin) as the targetOrigin,
			// not syncTargetOrigin — the loadContentAck goes to event.source
			// (the parent), and must be addressed to the parent's origin.
			let ackOrigin = event.origin;
			if (!ackOrigin || ackOrigin === 'null' || ackOrigin === 'null://null') {
				ackOrigin = '*';
			}
			syncVersion++;
			const replyVersion = syncVersion;
			if (event.source) {
				event.source.postMessage({
					type: 'loadContentAck',
					filename: filename,
					format: 'markdown',
					version: replyVersion
				}, ackOrigin);
			}

			// Show visual feedback for successful load
			if (window.MdvComments && typeof window.MdvComments.toast === 'function') {
				MdvComments.toast(`Loaded: ${filename}`);
			}

			// Clear loading flag
			_syncLoadingContent = false;
		});

		// ── Visual feedback helper for sync operations ─────────────────
		function showSyncToast(msg, isError) {
			if (window.MdvComments && typeof window.MdvComments.toast === 'function') {
				MdvComments.toast(msg);
			} else {
				console.info('[mdv sync] ' + msg);
			}
		}
	</script>
	<script src="footer.js"></script>
</body>
