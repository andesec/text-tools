<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>JSON Viewer</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
		rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						sans: ['Inter', 'sans-serif'],
					},
				}
			}
		}
	</script>
	<script src="vendor/purify.min.js"></script>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="jsv.css">

	<style>
		/* ── Iframe Embed Mode ──────────────────────────────── */
		body.iframe-mode .app-header-row {
			display: none !important;
		}

		body.iframe-mode #files-panel {
			display: none !important;
		}

		/* Sidebar in iframe mode: always visible, animated collapse */
		body.iframe-mode #sidebar {
			display: flex !important;
			transition: width var(--transition-slow), min-width var(--transition-slow);
		}

		body.iframe-mode #sidebar.iframe-sidebar-collapsed {
			display: flex !important;
			width: 0 !important;
			min-width: 0 !important;
			overflow: hidden;
		}

		/* Floating sidebar toggle button for iframe mode */
		#iframe-sidebar-toggle {
			display: none;
			position: fixed;
			top: 8px;
			left: 8px;
			z-index: 200;
			width: 32px;
			height: 32px;
			border-radius: var(--radius-md);
			border: 1px solid var(--border-default);
			background: var(--bg-surface-raised);
			color: var(--text-secondary);
			cursor: pointer;
			align-items: center;
			justify-content: center;
			transition: background var(--transition-fast), color var(--transition-fast), left var(--transition-slow);
			box-shadow: 0 2px 8px var(--shadow-md);
		}

		body.iframe-mode #iframe-sidebar-toggle {
			display: flex;
		}

		#iframe-sidebar-toggle:hover {
			background: var(--accent);
			color: #fff;
			border-color: var(--accent);
		}

		/* Hide editor syntax error highlights */
		.cm-invalidChar, .cm-error, .cm-invalid, .ͼ1 .cm-invalid {
			color: inherit !important;
			background: transparent !important;
			border: none !important;
			text-decoration: none !important;
		}
	</style>


</head>


<body class="h-screen flex flex-col overflow-hidden transition-colors duration-200">
	<header class="app-header z-50 shrink-0">
		<div class="app-header-row">
			<div class="flex items-center gap-2">

							d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
						</path>
					</svg>
				</a>

	<button id="mobile-menu" class="fixed bottom-6 right-6 md:hidden text-white p-4 rounded-full shadow-2xl z-50"
		style="background: var(--accent);">
		<svg id="menu-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
			<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
		</svg>
	</button>

	<div id="copy-toast" class="toast">Copied to clipboard!</div>

	<script src="vendor/cm-js-bundle.js"></script>
	<script>
		const { EditorView, basicSetup, javascript, json, oneDark, foldGutter, foldKeymap, keymap } = window.CM_JS;
		const fileListContainer = document.getElementById("file-list");
		const editorContainer = document.getElementById("editor-container");
		const treeContainer = document.getElementById("tree-container");
		const treeRoot = document.getElementById("json-tree-root");
		const treeMobile = document.getElementById("json-tree-mobile");
		const editorEl = document.getElementById("editor");
		const toggleViewBtn = document.getElementById("toggle-view-btn");
		const toggleText = document.getElementById("toggle-text");
		const downloadBtn = document.getElementById("download-btn");
		const saveChevronBtn = document.getElementById("save-chevron-btn");
		const saveDropdownMenu = document.getElementById("save-dropdown-menu");
		const copyToast = document.getElementById("copy-toast");
		const sourceBtn = document.getElementById("source-view-btn");
		const sidebar = document.getElementById("sidebar");

		const openBtn = document.getElementById("open-btn");
		const pasteBtn = document.getElementById("paste-btn");
		const newBtn = document.getElementById("new-btn");
		const fileInput = document.getElementById("file-input");
		const mobileMenu = document.getElementById("mobile-menu");
		const closeSidebar = document.getElementById("close-sidebar");

		if (pasteBtn) {
			pasteBtn.onclick = async () => {
				try {
					const text = await navigator.clipboard.readText();
					if (text !== undefined && text !== null) {
						if (!editor) {
							initEditor(text, currentFileName?.endsWith(".json") ? "json" : "javascript");
						} else {
							const transaction = editor.state.update({
								changes: { from: 0, to: editor.state.doc.length, insert: text },
								selection: { anchor: text.length }
							});
							editor.dispatch(transaction);
							setTimeout(() => editor.focus(), 10);
						}

						copyToast.textContent = "Pasted from clipboard!";
						copyToast.style.opacity = "1";
						setTimeout(() => copyToast.style.opacity = "0", 2000);
					}
				} catch (err) {
					console.error('Failed to read clipboard contents: ', err);
					copyToast.textContent = "Clipboard permission denied or unsupported";
					copyToast.style.background = "#ef4444";
					copyToast.style.opacity = "1";
					setTimeout(() => {
						copyToast.style.opacity = "0";
						setTimeout(() => copyToast.style.background = "#333", 300);
					}, 3000);
				}
			};
		}

		const toggleSidebar = () => {
			document.body.classList.toggle("mobile-sidebar-active");
			const isActive = document.body.classList.contains("mobile-sidebar-active");
			document.getElementById("menu-icon").innerHTML = isActive
				? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>'
				: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>';
		};

		mobileMenu.onclick = toggleSidebar;
		closeSidebar.onclick = toggleSidebar;

		let loadedFiles = new Map();
		let currentFileName = null;
		let editor = null;
		let sourceJSON = null; // Store the original JSON when in resolved view
		let viewMode = "editor"; // 'editor' or 'tree'
		let lineWrap = true;
		let currentOffsetMap = null;
		let currentTreeText = null;

		// Escape literal control characters (newlines, tabs, carriage returns) that
		// appear inside JSON string literals. Uses a simple state machine to track
		// whether the current position is inside a double-quoted string, handling
		// backslash escape sequences correctly.
		function escapeLiteralNewlinesInStrings(text) {
			let result = "";
			let inString = false;
			let i = 0;
			while (i < text.length) {
				const ch = text[i];
				if (inString) {
					if (ch === '\\') {
						// Copy the escape sequence verbatim (backslash + next char)
						result += ch;
						i++;
						if (i < text.length) {
							result += text[i];
							i++;
						}
					} else if (ch === '"') {
						// End of string
						result += ch;
						i++;
						inString = false;
					} else if (ch === '\n') {
						result += '\\n';
						i++;
					} else if (ch === '\r') {
						result += '\\r';
						i++;
					} else if (ch === '\t') {
						result += '\\t';
						i++;
					} else if (ch < '\x20') {
						// Other control characters (e.g. \x00–\x1f)
						result += '\\u' + ch.charCodeAt(0).toString(16).padStart(4, '0');
						i++;
					} else {
						result += ch;
						i++;
					}
				} else {
					if (ch === '"') {
						result += ch;
						i++;
						inString = true;
					} else {
						result += ch;
						i++;
					}
				}
			}
			return result;
		}

		function cleanLiteralNewlinesIfJson(text, filename) {
			if (!text) return text;
			const isJson = filename?.toLowerCase().endsWith(".json") || (text.trim().startsWith("{") || text.trim().startsWith("["));
			if (isJson) {
				try {
					JSON.parse(text);
					return text;
				} catch (e) {
					return escapeLiteralNewlinesInStrings(text);
				}
			}
			return text;
		}

		function safeJsonParse(text) {
			try {
				return JSON.parse(text);
			} catch (e) {
				// If it fails, try to "fix" common issues
				try {
					const cleaned = performSophisticatedClean(text);
					return JSON.parse(cleaned);
				} catch (e2) {
					throw e; // throw original error if fix fails
				}
			}
		}

		function performSophisticatedClean(text) {
			let cleaned = text.trim();

			// 1. Remove JavaScript-style comments
			cleaned = cleaned.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, '$1');

			// 2. Normalize single quotes to double quotes, escaping existing double quotes
			cleaned = cleaned.replace(/'([^'\\]*(?:\\.[^'\\]*)*)'/g, (match, p1) => {
				return '"' + p1.replace(/"/g, '\\"') + '"';
			});

			// 3. Fix missing quotes on keys (simple version)
			cleaned = cleaned.replace(/([{,]\s*)([a-zA-Z0-9_$]+)\s*:/g, '$1"$2":');

			// 4. Handle escaped quotes that might be broken
			cleaned = cleaned.replace(/\\'/g, "'");

			// 5. Remove trailing commas
			cleaned = cleaned.replace(/,\s*([\]}])/g, "$1");

			// 6. Handle literal newlines in strings
			cleaned = escapeLiteralNewlinesInStrings(cleaned);

			return cleaned;
		}

		function tokenize(text) {
			const tokens = [];
			let i = 0;
			while (i < text.length) {
				// Skip whitespace
				if (/\s/.test(text[i])) {
					i++;
					continue;
				}
				// Skip single-line comments
				if (text[i] === '/' && text[i + 1] === '/') {
					i += 2;
					while (i < text.length && text[i] !== '\n' && text[i] !== '\r') i++;
					continue;
				}
				// Skip multi-line comments
				if (text[i] === '/' && text[i + 1] === '*') {
					i += 2;
					while (i < text.length && !(text[i] === '*' && text[i + 1] === '/')) i++;
					if (i < text.length) i += 2;
					continue;
				}

				// Single character tokens
				if (text[i] === '{' || text[i] === '}' || text[i] === '[' || text[i] === ']' || text[i] === ':' || text[i] === ',') {
					tokens.push({ type: text[i], value: text[i], start: i, end: i + 1 });
					i++;
					continue;
				}

				// String tokens (double quoted)
				if (text[i] === '"') {
					const start = i;
					i++;
					while (i < text.length && text[i] !== '"') {
						if (text[i] === '\\') i += 2;
						else i++;
					}
					if (i < text.length) i++;
					const value = text.slice(start, i);
					tokens.push({ type: 'string', value: value, start, end: i });
					continue;
				}

				// String tokens (single quoted)
				if (text[i] === "'") {
					const start = i;
					i++;
					while (i < text.length && text[i] !== "'") {
						if (text[i] === '\\') i += 2;
						else i++;
					}
					if (i < text.length) i++;
					const value = text.slice(start, i);
					tokens.push({ type: 'string', value: value, start, end: i });
					continue;
				}

				// Identifier / Word / Number
				if (/[a-zA-Z0-9_\-\.\+]/.test(text[i])) {
					const start = i;
					while (i < text.length && /[a-zA-Z0-9_\-\.\+]/.test(text[i])) i++;
					const value = text.slice(start, i);
					tokens.push({ type: 'word', value: value, start, end: i });
					continue;
				}

				// Catch-all for any other characters to prevent infinite loops
				i++;
			}
			return tokens;
		}

		function buildOffsetMap(text) {
			const map = new Map();
			const tokens = tokenize(text);
			let tokenIndex = 0;

			function peek() {
				return tokens[tokenIndex] || null;
			}

			function consume() {
				return tokens[tokenIndex++];
			}

			const path = [];

			function parseValue() {
				const tok = peek();
				if (!tok) return;

				// Save the start offset of the current value/structure
				map.set(JSON.stringify(path), tok.start);

				if (tok.type === '{') {
					consume(); // consume '{'
					let first = true;
					while (true) {
						const nextTok = peek();
						if (!nextTok || nextTok.type === '}') break;

						if (!first) {
							if (nextTok.type === ',') {
								consume(); // consume ','
							}
						}
						first = false;

						const keyTok = peek();
						if (!keyTok || keyTok.type === '}') break;

						// key can be a string or a word (unquoted key)
						let key = '';
						if (keyTok.type === 'string') {
							// Strip enclosing quotes and parse
							const rawStr = consume().value;
							try {
								key = JSON.parse(rawStr.startsWith("'") ? `"${rawStr.slice(1, -1).replace(/"/g, '\\"')}"` : rawStr);
							} catch (e) {
								key = rawStr.slice(1, -1);
							}
						} else if (keyTok.type === 'word') {
							key = consume().value;
						} else {
							// Fallback to prevent infinite loop
							consume();
							continue;
						}

						const colonTok = peek();
						if (colonTok && colonTok.type === ':') {
							consume(); // consume ':'
						}

						path.push(key);
						parseValue();
						path.pop();
					}
					if (peek() && peek().type === '}') {
						consume(); // consume '}'
					}
				} else if (tok.type === '[') {
					consume(); // consume '['
					let index = 0;
					let first = true;
					while (true) {
						const nextTok = peek();
						if (!nextTok || nextTok.type === ']') break;

						if (!first) {
							if (nextTok.type === ',') {
								consume(); // consume ','
							}
						}
						first = false;

						const elementTok = peek();
						if (!elementTok || elementTok.type === ']') break;

						path.push(index);
						parseValue();
						path.pop();
						index++;
					}
					if (peek() && peek().type === ']') {
						consume(); // consume ']'
					}
				} else {
					// String, word (number, boolean, null, etc.)
					consume();
				}
			}

			parseValue();
			return map;
		}

		function buildTree(text) {
			const empty = '<div style="color:var(--text-tertiary);padding:2rem;text-align:center;font-style:italic;font-size:12px;">Editor is empty. Paste or type JSON to see the tree view.</div>';
			const renderTo = [treeRoot, treeMobile];
			renderTo.forEach(r => r.innerHTML = "");
			if (!text || text.trim() === "") {
				currentOffsetMap = null;
				currentTreeText = null;
				renderTo.forEach(r => r.innerHTML = empty);
				return;
			}
			try {
				const data = safeJsonParse(text);
				currentTreeText = text;
				currentOffsetMap = buildOffsetMap(text);
				renderTo.forEach(r => r.appendChild(renderNode(null, data, true, null, [], currentOffsetMap)));
			} catch (e) {
				currentOffsetMap = null;
				currentTreeText = null;
				const errHtml = `<div style="color:var(--danger);padding:1rem;border:1px solid var(--danger);border-radius:8px;">
					<div style="margin-bottom:4px;font-weight:600;">Invalid JSON</div>
					<div style="font-size:11px;font-family:var(--font-mono);color:var(--text-secondary);">${e.message}</div>
					<button onclick="transform('cleanJSON')" style="margin-top:12px;padding:4px 10px;background:var(--danger-muted);color:var(--danger);border:none;border-radius:6px;font-size:11px;cursor:pointer;">Try to Auto-Fix JSON</button>
				</div>`;
				renderTo.forEach(r => r.innerHTML = errHtml);
			}
		}

		function renderNode(key, value, isLast = true, index = null, path = [], offsetMap = null) {
			const node = document.createElement("div");
			node.className = "json-node collapsed";

			const currentPath = index !== null ? [...path, index] : (key !== null ? [...path, key] : path);
			const pathKey = JSON.stringify(currentPath);
			node.dataset.path = pathKey;

			const content = document.createElement("span");
			content.className = "json-node-content";

			if (index !== null) {
				const indexSpan = document.createElement("span");
				indexSpan.className = "text-gray-400 mr-2 opacity-50";
				indexSpan.textContent = `[${index}]`;
				content.appendChild(indexSpan);
			}

			if (key !== null) {
				const keySpan = document.createElement("span");
				keySpan.className = "json-key";
				keySpan.textContent = `"${key}": `;
				content.appendChild(keySpan);
			}

			const isObject = value !== null && typeof value === "object";

			if (isObject) {
				const isArray = Array.isArray(value);
				const openBracket = isArray ? "[" : "{";
				const closeBracket = isArray ? "]" : "}";
				const count = isArray ? value.length : Object.keys(value).length;

				const label = document.createElement("span");
				label.textContent = openBracket;
				content.appendChild(label);

				// Ellipsis for collapsed view
				const ellipsis = document.createElement("span");
				ellipsis.className = "collapsed-only text-gray-400 mx-1";
				ellipsis.textContent = "...";
				content.appendChild(ellipsis);

				const closeLabel = document.createElement("span");
				closeLabel.className = "collapsed-only";
				closeLabel.textContent = closeBracket + (isLast ? "" : ",");
				content.appendChild(closeLabel);

				const meta = document.createElement("span");
				meta.className = "json-meta";
				meta.textContent = `${count} ${isArray ? "item" : "field"}${count !== 1 ? "s" : ""}`;
				content.appendChild(meta);

				const toggle = document.createElement("div");
				toggle.className = "json-toggle";
				toggle.onclick = (e) => {
					e.stopPropagation();
					node.classList.toggle("collapsed");
				};
				node.appendChild(toggle);

				const children = document.createElement("div");
				children.className = "json-children";

				const keys = Object.keys(value);
				keys.forEach((k, i) => {
					children.appendChild(renderNode(isArray ? null : k, value[k], i === keys.length - 1, isArray ? i : null, currentPath, offsetMap));
				});
				node.appendChild(content);
				node.appendChild(children);

				const footer = document.createElement("div");
				footer.className = "expanded-only opacity-70";
				footer.style.marginLeft = "0";
				footer.textContent = closeBracket + (isLast ? "" : ",");
				node.appendChild(footer);
			} else {
				const valSpan = document.createElement("span");
				const type = value === null ? "null" : typeof value;
				valSpan.className = `json-value-${type}`;
				valSpan.textContent = type === "string" ? (value.length > 200 ? `"${value.substring(0, 200)}..."` : `"${value}"`) : String(value);
				content.appendChild(valSpan);

				// Type badge
				const badge = document.createElement("span");
				badge.className = `json-type-badge json-type-${type}`;
				badge.textContent = type === "string" ? `str·${value.length}` : type;
				content.appendChild(badge);

				if (!isLast) content.appendChild(document.createTextNode(","));
				node.appendChild(content);
			}

			content.onclick = (e) => {
				e.stopPropagation();
				if (!editor) return;

				console.log('[TREE-NAV] Click on pathKey:', pathKey);

				// Always use the freshest offset map for the current editor text
				const editorText = editor.state.doc.toString();
				let activeMap = currentOffsetMap;
				if (!activeMap || currentTreeText !== editorText) {
					try {
						console.log('[TREE-NAV] Rebuilding offset map (text changed)');
						activeMap = buildOffsetMap(editorText);
						currentOffsetMap = activeMap;
						currentTreeText = editorText;
					} catch (err) {
						console.error('[TREE-NAV] Failed to build offset map:', err);
						return;
					}
				}

				if (!activeMap.has(pathKey)) {
					console.warn('[TREE-NAV] pathKey not found in map:', pathKey);
					console.log('[TREE-NAV] Available keys:', [...activeMap.keys()]);
					return;
				}

				const offset = activeMap.get(pathKey);
				console.log('[TREE-NAV] offset:', offset, 'char:', JSON.stringify(editorText[offset]), 'docLen:', editorText.length);
				if (offset < 0 || offset >= editorText.length) {
					console.error('[TREE-NAV] offset out of bounds');
					return;
				}

				let end = offset;
				// Scan forward to find end of value token
				if (editorText[offset] === '"') {
					end++;
					while (end < editorText.length && editorText[end] !== '"') {
						if (editorText[end] === '\\') end++;
						end++;
					}
					end++; // include closing quote
				} else if (editorText[offset] === '{' || editorText[offset] === '[') {
					end = offset + 1;
				} else {
					while (end < editorText.length && /[^,\]\}\s]/.test(editorText[end])) end++;
				}

				console.log('[TREE-NAV] Dispatching selection anchor:', offset, 'head:', end);

				// Dispatch selection + scroll, then focus in next microtask
				// to prevent focus() from overriding the scrollIntoView
				editor.dispatch({
					selection: { anchor: offset, head: end },
					effects: EditorView.scrollIntoView(offset, { y: 'center' }),
					scrollIntoView: true
				});
				requestAnimationFrame(() => editor.focus());

				// Flash the tree node for visual feedback
				node.classList.add('tree-node-active');
				setTimeout(() => node.classList.remove('tree-node-active'), 600);
			};

			return node;
		}

		function copyToClipboard(text) {
			navigator.clipboard.writeText(text).then(() => {
				copyToast.style.opacity = "1";
				setTimeout(() => (copyToast.style.opacity = "0"), 2000);
			});
		}

		window.prettify = () => {
			if (!editor) return;
			try {
				const content = editor.state.doc.toString();
				const parsed = safeJsonParse(content);
				const formatted = JSON.stringify(parsed, null, 2);
				editor.dispatch({
					changes: { from: 0, to: editor.state.doc.length, insert: formatted }
				});
			} catch (e) {
				alert("Only valid JSON (or almost valid JSON) can be prettified.");
			}
		};

		window.transform = (type) => {
			if (!editor) return;
			const content = editor.state.doc.toString();
			let result = "";
			try {
				if (type === "escapeJSON") {
					// If it's already wrapped in quotes and seems like a JSON string, don't double escape
					if (content.startsWith('"') && content.endsWith('"') && !content.includes("\n")) {
						result = content;
					} else {
						result = JSON.stringify(content);
					}
				} else if (type === "unescapeJSON") {
					try {
						// Attempt to parse as a full JSON string first
						const parsed = JSON.parse(content);
						result = typeof parsed === "string" ? parsed : content;
					} catch (e) {
						// If it's just the inner content of a string, try wrapping it
						try {
							result = JSON.parse(`"${content}"`);
						} catch (e2) {
							result = content;
						}
					}
				} else if (type === "resolveNewlines") {
					sourceJSON = content; // Save the original
					result = content.replace(/\\n/g, "\n")
						.replace(/\\r/g, "\r")
						.replace(/\\t/g, "\t")
						.replace(/\\"/g, '"')
						.replace(/\\u([0-9a-fA-F]{4})/g, (match, grp) => {
							return String.fromCharCode(parseInt(grp, 16));
						});
					initEditor(result, "javascript", false); // Show in editor, NOT read-only
					sourceBtn.classList.remove("hidden");
					return;
				} else if (type === "cleanJSON") {
					try {
						const cleaned = performSophisticatedClean(content);
						const parsed = JSON.parse(cleaned);
						result = JSON.stringify(parsed, null, 2);
					} catch (e) {
						// Final fallback attempt if performSophisticatedClean + JSON.parse fails
						result = content.replace(/\\n/g, "\n").replace(/\\"/g, '"');
					}
				}

				editor.dispatch({
					changes: { from: 0, to: editor.state.doc.length, insert: result }
				});
				// Removed manual buildTree call as updateListener handles it
			} catch (e) {
				alert("Transformation failed: " + e.message);
			}
		};

		window.showPreview = (content) => {
			// Legacy function, no longer used as we show in main editor
		};

		window.closePreview = () => {
			// Legacy function
		};

		window.copyResolved = () => {
			// Legacy function
		};

		// ── JSON → Markdown transformer ─────────────────────────────────────
		// Walks any JSON value and emits readable markdown. Smart about:
		//  - top-level title fields (becomes H1)
		//  - frontmatter (scalar/short fields → bullets at the top)
		//  - arrays of objects (becomes sections with H2/H3 titles)
		//  - widget-wrapper pattern: { widgetName: { ... } } (unwraps and
		//    uses the inner title for the section heading)
		//  - depth-based heading levels (capped at H6) so we never hit the
		//    "heading soup" failure mode on deeply nested JSON
		const J2MD_TITLE_KEYS = ['title', 'name', 'heading', 'label'];
		const J2MD_META_KEYS = new Set([
			'study_duration', 'duration_seconds', 'align', 'karut',
			'keywords', 'lang', 'ai_prompt', 'grader_prompt',
			'wordlist_csv', 'criteria', 'hint', 'explanation',
			'structure', 'match', 'id', 'roleplay'
		]);
		// Field names that, in a widget config, carry the widget's main
		// content. We render them as a plain block (no bold label) because
		// the field name rarely adds meaning when the widget type is
		// already in the section heading. Note: left_items / right_items
		// are NOT in this set — the orientation ("left" / "right") is
		// meaningful for connections exercises, so we keep their labels.
		const J2MD_NO_LABEL_FIELDS = new Set([
			'markdown', 'content', 'text', 'html', 'description', 'body',
			'question', 'q', 'answer', 'a', 'explanation', 'e', 'hint',
			'prompt', 'rows', 'flow', 'wordlist_csv', 'criteria',
			'grader_prompt', 'ai_prompt', 'lang', 'structure', 'choices',
			'fillblank', 'match_pairs'
		]);

		function j2mdIsScalar(v) {
			return v === null || v === undefined || typeof v === 'boolean' ||
				(typeof v !== 'object' && typeof v !== 'string');
		}

		function j2mdIsShortString(v) {
			return typeof v === 'string' && v.length < 100 && !v.includes('\n');
		}

		function j2mdIsPrimitiveArray(v) {
			// Arrays of scalars and/or strings (any length) render as a
			// labeled bullet list. Empty arrays are handled at the call
			// site so the field is omitted entirely.
			return Array.isArray(v) && v.length > 0 &&
				v.every(x => j2mdIsScalar(x) || typeof x === 'string');
		}

		// An object is "small" if every value is a scalar / short string /
		// primitive array — i.e. it can be inlined into a bullet without
		// losing readability. Used to render arrays of small config items
		// (left_items, right_items, criteria, etc.) as bullet lists
		// instead of as full sections.
		function j2mdIsSmallObject(obj) {
			if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
			const keys = Object.keys(obj);
			if (keys.length === 0 || keys.length > 6) return false;
			return keys.every(k => {
				const v = obj[k];
				return j2mdIsScalar(v) || j2mdIsShortString(v) || j2mdIsPrimitiveArray(v);
			});
		}

		function j2mdRenderObjectList(arr) {
			return arr.map(v => {
				const parts = Object.keys(v).map(k => {
					const val = v[k];
					if (j2mdIsPrimitiveArray(val)) {
						return `**${j2mdHumanizeKey(k)}:** ${val.join(', ')}`;
					}
					return `**${j2mdHumanizeKey(k)}:** ${val}`;
				});
				return `- ${parts.join(' · ')}`;
			}).join('\n');
		}

		// Detect an array of arrays-of-primitives that is a natural fit for
		// a markdown table (all inner arrays same length, ≥ 2 rows).
		function j2mdIsTable(v) {
			if (!Array.isArray(v) || v.length < 2) return false;
			if (!v.every(row => Array.isArray(row))) return false;
			const colCount = v[0].length;
			if (colCount === 0) return false;
			return v.every(row =>
				row.length === colCount &&
				row.every(cell => cell === null || ['string', 'number', 'boolean'].includes(typeof cell))
			);
		}

		function j2mdRenderTable(arr) {
			const colCount = arr[0].length;
			const escape = s => String(s == null ? '' : s)
				.replace(/\|/g, '\\|')
				.replace(/\r?\n/g, ' ');
			const header = `| ${arr[0].map(escape).join(' | ')} |`;
			const sep = `| ${Array(colCount).fill('---').join(' | ')} |`;
			const rows = arr.slice(1)
				.map(row => `| ${row.map(escape).join(' | ')} |`)
				.join('\n');
			return [header, sep, rows].join('\n');
		}

		function j2mdHumanizeKey(key) {
			return String(key)
				.replace(/([a-z0-9])([A-Z])/g, '$1 $2')
				.replace(/[_-]+/g, ' ')
				.replace(/\s+/g, ' ')
				.trim()
				.replace(/\b\w/g, c => c.toUpperCase());
		}

		function j2mdPickTitle(obj) {
			if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return null;
			for (const k of J2MD_TITLE_KEYS) {
				if (typeof obj[k] === 'string' && obj[k].trim()) return obj[k].trim();
			}
			return null;
		}

		function j2mdStripTitle(obj) {
			const t = j2mdPickTitle(obj);
			if (!t) return obj;
			const out = {};
			for (const k of Object.keys(obj)) {
				if (J2MD_TITLE_KEYS.includes(k) && typeof obj[k] === 'string' && obj[k].trim() === t) continue;
				out[k] = obj[k];
			}
			return out;
		}

		function j2mdIsWidgetWrapper(obj) {
			if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
			const keys = Object.keys(obj);
			if (keys.length !== 1) return false;
			const v = obj[keys[0]];
			return v && typeof v === 'object' && !Array.isArray(v);
		}

		function j2mdUnwrapWidget(obj) {
			const k = Object.keys(obj)[0];
			return { key: k, value: obj[k] };
		}

		function j2mdLooksLikeCode(s) {
			if (s.length > 150 && /[{};]/.test(s) && /\n/.test(s)) return true;
			if (/(^|\n)\s*(function|const|let|var|class|import|export|if|for|while|return|def)\b/.test(s)) return true;
			return false;
		}

		function j2mdAutoLink(s) {
			return s.replace(/(https?:\/\/\S+)/g, '[$1]($1)');
		}

		function j2mdRenderString(s) {
			if (j2mdLooksLikeCode(s)) return '```\n' + s + '\n```';
			const linked = j2mdAutoLink(s);
			return linked.split(/\n\s*\n+/).map(p => p.trim()).filter(Boolean).join('\n\n');
		}

		function j2mdRenderKeyBlock(key, value, opts) {
			if (value === null || value === undefined || value === '') return '';
			if (Array.isArray(value) && value.length === 0) return '';
			if (typeof value === 'object' && !Array.isArray(value) && Object.keys(value).length === 0) return '';
			const humanKey = j2mdHumanizeKey(key);
			// Defensive defaults so the heading-level formula never sees NaN
			// even if a caller forgets to pass these.
			const depth = opts && opts.depth || 0;
			const sectionDepth = opts && opts.sectionDepth || 0;

			if (j2mdIsScalar(value)) return `- **${humanKey}:** ${value}`;
			if (j2mdIsShortString(value)) return `- **${humanKey}:** ${value}`;
			if (j2mdIsPrimitiveArray(value)) {
				const items = value.map(v => `  - ${v}`).join('\n');
				return `**${humanKey}:**\n${items}`;
			}
			// Long string → inline bold label + paragraph (avoids "heading
			// soup" on deeply nested JSON with prose in every leaf).
			if (typeof value === 'string') {
				return `**${humanKey}:**\n\n${j2mdRenderString(value)}`;
			}
			// Object/array → heading + body. The isTopLevel flag is
			// set ONLY by j2mdRenderTopLevel on its direct children, so
			// a top-level array-of-objects becomes H2 (its items become
			// H3) without double-promoting nested arrays inside
			// sections or widget configs.
			const isTopLevelArray = opts.isTopLevel &&
				Array.isArray(value) && value.length > 0 &&
				value.every(v => v && typeof v === 'object' && !Array.isArray(v));
			const headingLevel = isTopLevelArray
				? Math.min(6, 2)
				: Math.min(6, sectionDepth + 2 + depth);
			const body = j2mdToMarkdown(value, { ...opts, depth: depth + 1 });
			if (!body) return '';
			return `${'#'.repeat(headingLevel)} ${humanKey}\n\n${body}`;
		}

		function j2mdRenderWidgetSection(item, opts) {
			const { key: widgetKey, value: cfg } = j2mdUnwrapWidget(item);
			const widgetLabel = j2mdHumanizeKey(widgetKey);
			const title = j2mdPickTitle(cfg);
			const headingLevel = Math.min(6, opts.sectionDepth + 2);

			const meta = {};
			const content = {};
			for (const k of Object.keys(cfg)) {
				if (J2MD_TITLE_KEYS.includes(k)) continue;
				if (J2MD_META_KEYS.has(k)) meta[k] = cfg[k];
				else content[k] = cfg[k];
			}

			let out = '';
			const heading = title
				? (widgetKey && widgetKey.toLowerCase() !== title.toLowerCase()
					? `${title} _(${widgetLabel})_`
					: title)
				: widgetLabel;
			out += `${'#'.repeat(headingLevel)} ${heading}\n\n`;

			const metaParts = [];
			if (meta.study_duration != null) metaParts.push(`*Duration: ${meta.study_duration} min*`);
			if (meta.duration_seconds != null) metaParts.push(`*Duration: ${meta.duration_seconds} sec*`);
			if (meta.align) metaParts.push(`*Align: ${meta.align}*`);
			if (meta.lang) metaParts.push(`*Lang: ${meta.lang}*`);
			if (Array.isArray(meta.karut) && meta.karut.length) metaParts.push(`*KARUT: ${meta.karut.join(', ')}*`);
			if (Array.isArray(meta.keywords) && meta.keywords.length) metaParts.push(`*Keywords: ${meta.keywords.join(', ')}*`);
			if (Array.isArray(meta.criteria) && meta.criteria.length) metaParts.push(`*Criteria: ${meta.criteria.length} items*`);
			if (metaParts.length) out += metaParts.join(' · ') + '\n\n';

			for (const k of Object.keys(content)) {
				const v = content[k];
				if (v === null || v === undefined || v === '') continue;
				// Skip the bold label for fields whose names don't add
				// meaning inside a widget config (e.g. "markdown" inside a
				// markdown widget is just the body text).
				if (J2MD_NO_LABEL_FIELDS.has(k)) {
					const rendered = j2mdToMarkdown(v, { ...opts, depth: 1 });
					if (rendered) out += rendered + '\n\n';
				} else {
					const block = j2mdRenderKeyBlock(k, v, { ...opts, depth: 1 });
					if (block) out += block + '\n\n';
				}
			}
			return out.trim();
		}

		function j2mdRenderSectionItem(item, idx, opts) {
			if (j2mdIsWidgetWrapper(item)) return j2mdRenderWidgetSection(item, opts);
			const title = j2mdPickTitle(item);
			const cleanItem = j2mdStripTitle(item);
			const headingLevel = Math.min(6, opts.sectionDepth + 2);
			const heading = title || `Item ${idx + 1}`;
			const body = j2mdToMarkdown(cleanItem, { ...opts, depth: 1 });
			if (!body) return `${'#'.repeat(headingLevel)} ${heading}`;
			return `${'#'.repeat(headingLevel)} ${heading}\n\n${body}`;
		}

		function j2mdToMarkdown(value, opts) {
			opts = opts || {};
			const depth = opts.depth || 0;
			const sectionDepth = opts.sectionDepth || 0;
			const seen = opts.seen || new WeakSet();

			if (value === null || value === undefined) return '';
			if (typeof value === 'object') {
				if (seen.has(value)) return '_(circular)_';
				seen.add(value);
			}
			if (typeof value === 'boolean') return value ? 'true' : 'false';
			if (typeof value === 'number') return String(value);
			if (typeof value === 'string') return j2mdRenderString(value);

			if (Array.isArray(value)) {
				if (value.length === 0) return '';
				// Array of arrays with consistent column count → markdown table
				if (j2mdIsTable(value)) return j2mdRenderTable(value);
				// Array of objects: either "small" (render as bullet list)
				// or "rich" (render as named sections).
				if (value.every(v => v && typeof v === 'object' && !Array.isArray(v))) {
					if (value.every(j2mdIsSmallObject)) {
						return j2mdRenderObjectList(value);
					}
					const sep = '\n\n---\n\n';
					return value
						.map((v, i) => j2mdRenderSectionItem(v, i, { ...opts, sectionDepth: sectionDepth + 1 }))
						.filter(Boolean)
						.join(sep);
				}
				return value.map(v => {
					const inner = j2mdToMarkdown(v, { ...opts, depth: depth + 1, sectionDepth });
					const flat = inner.replace(/\n/g, ' ').trim();
					return `- ${flat}`;
				}).join('\n');
			}

			if (depth === 0) return j2mdRenderTopLevel(value, opts);
			return j2mdRenderNestedObject(value, opts);
		}

		function j2mdRenderTopLevel(obj, opts) {
			const keys = Object.keys(obj);
			if (keys.length === 0) return '';
			const titleKey = keys.find(k =>
				J2MD_TITLE_KEYS.includes(k) && typeof obj[k] === 'string' && obj[k].trim());
			const title = titleKey ? obj[titleKey].trim() : null;

			// Special case: a top-level object whose only content is a
			// single array of objects → each item becomes an H2 section
			// (no "### Sections" wrapper, no frontmatter). Common shape
			// for course-content JSON, list-of-things, etc. If every item
			// is "small", render as a bullet list instead.
			if (!title) {
				const nonEmptyKeys = keys.filter(k => {
					const v = obj[k];
					return !(v === null || v === undefined || v === '' ||
						(Array.isArray(v) && v.length === 0));
				});
				if (nonEmptyKeys.length === 1) {
					const k = nonEmptyKeys[0];
					const v = obj[k];
					if (Array.isArray(v) && v.length > 0 &&
						v.every(x => x && typeof x === 'object' && !Array.isArray(x))) {
						if (v.every(j2mdIsSmallObject)) {
							return j2mdRenderObjectList(v);
						}
						return v
							.map((item, i) => j2mdRenderSectionItem(item, i, { ...opts, sectionDepth: 0 }))
							.filter(Boolean)
							.join('\n\n---\n\n')
							.trim();
					}
				}
			}

			const scalarKeys = keys.filter(k => {
				if (k === titleKey) return false;
				const v = obj[k];
				return j2mdIsScalar(v) || j2mdIsShortString(v) || j2mdIsPrimitiveArray(v);
			});
			const complexKeys = keys.filter(k => k !== titleKey && !scalarKeys.includes(k));

			let out = '';
			if (title) out += `# ${title}\n\n`;
			if (scalarKeys.length) {
				const lines = scalarKeys.map(k => {
					const v = obj[k];
					if (j2mdIsPrimitiveArray(v)) return `- **${j2mdHumanizeKey(k)}:** ${v.join(', ')}`;
					return `- **${j2mdHumanizeKey(k)}:** ${v}`;
				});
				out += lines.join('\n') + '\n\n';
			}
			if (complexKeys.length) {
				out += complexKeys
					.map(k => j2mdRenderKeyBlock(k, obj[k], { ...opts, depth: 1, sectionDepth: 0, isTopLevel: true }))
					.filter(Boolean)
					.join('\n\n');
			}
			return out.trim();
		}

		function j2mdRenderNestedObject(obj, opts) {
			const keys = Object.keys(obj);
			if (keys.length === 0) return '';
			// Ensure sectionDepth is always set so the heading-level
			// formula in j2mdRenderKeyBlock never sees NaN.
			const safeOpts = opts.sectionDepth === undefined
				? { ...opts, sectionDepth: 0 }
				: opts;
			return keys
				.map(k => j2mdRenderKeyBlock(k, obj[k], safeOpts))
				.filter(Boolean)
				.join('\n\n');
		}

		function j2mdSlugify(s) {
			return String(s)
				.toLowerCase()
				.replace(/[^\w\s-]/g, '')
				.replace(/[\s_-]+/g, '-')
				.replace(/^-+|-+$/g, '')
				.slice(0, 80);
		}

		// Derive a markdown filename from the JSON's title field, falling
		// back to the current editor filename (stripped of its .json
		// extension), and finally to "output.md".
		function deriveMarkdownFilename(data) {
			if (data && typeof data === 'object') {
				const t = j2mdPickTitle(data);
				if (t) {
					const slug = j2mdSlugify(t);
					if (slug) return `${slug}.md`;
				}
			}
			const fn = (currentFileName || '').trim();
			if (fn && !/^scratchpad-\d+\.json$/i.test(fn)) {
				return fn.replace(/\.json$/i, '.md');
			}
			return 'output.md';
		}

		function transformJsonToMarkdown() {
			if (!editor) return null;
			const content = editor.state.doc.toString();
			if (!content.trim()) {
				toast('Editor is empty — nothing to transform.');
				return null;
			}
			let data;
			try {
				data = safeJsonParse(content);
			} catch (e) {
				copyToast.textContent = 'Invalid JSON: ' + e.message;
				copyToast.style.background = '#ef4444';
				copyToast.style.opacity = '1';
				setTimeout(() => {
					copyToast.style.opacity = '0';
					setTimeout(() => copyToast.style.background = '#333', 300);
				}, 3000);
				return null;
			}
			const markdown = j2mdToMarkdown(data);
			if (!markdown) {
				toast('JSON produced empty markdown.');
				return null;
			}
			return { markdown, filename: deriveMarkdownFilename(data) };
		}

		window.copyJsonAsMarkdown = async function () {
			const result = transformJsonToMarkdown();
			if (!result) return;
			try {
				await navigator.clipboard.writeText(result.markdown);
				toast(`Copied ${result.filename} (${result.markdown.length} chars)`);
			} catch (e) {
				copyToast.textContent = 'Copy failed: ' + e.message;
				copyToast.style.background = '#ef4444';
				copyToast.style.opacity = '1';
				setTimeout(() => {
					copyToast.style.opacity = '0';
					setTimeout(() => copyToast.style.background = '#333', 300);
				}, 3000);
			}
		};

		// Forward the transformed markdown to mdv.html.
		// - If running inside workspace.html, ask the workspace parent to
		//   open a new mdv tab and forward the content via loadContent.
		// - Otherwise, open mdv.html in a new browser tab and post the
		//   content once it's ready.
		// - As a bonus, if there's an mdv iframe already mounted somewhere
		//   in this window (e.g. a sibling preview), post to it directly.
		window.sendJsonToMarkdown = function () {
			const result = transformJsonToMarkdown();
			if (!result) return;
			const payload = {
				type: 'loadContent',
				filename: result.filename,
				text: result.markdown,
				options: { lockFilename: true }
			};

			// 1. Workspace parent (tabbed host) — ask it to open a new tab.
			if (window.parent && window.parent !== window) {
				const targetOrigin = syncTargetOrigin && syncTargetOrigin !== '*'
					? syncTargetOrigin : '*';
				window.parent.postMessage({
					type: 'openMdPreview',
					filename: result.filename,
					text: result.markdown
				}, targetOrigin);
				toast(`Sent to MD (workspace): ${result.filename}`);
				return;
			}

			// 2. Sibling mdv iframe already on the page.
			const sibling = document.querySelector('iframe[src$="mdv.html"], iframe[name^="tab_"][src$="mdv.html"]');
			if (sibling && sibling.contentWindow) {
				const trySend = () => {
					try { sibling.contentWindow.postMessage(payload, '*'); } catch (e) { }
				};
				trySend();
				setTimeout(trySend, 300);
				setTimeout(trySend, 800);
				toast(`Sent to MD: ${result.filename}`);
				return;
			}

			// 3. Standalone: open mdv.html in a new tab and post on ready.
			const win = window.open('mdv.html', '_blank');
			if (!win) {
				copyToast.textContent = 'Pop-up blocked — allow pop-ups to open MD Explorer.';
				copyToast.style.background = '#ef4444';
				copyToast.style.opacity = '1';
				setTimeout(() => {
					copyToast.style.opacity = '0';
					setTimeout(() => copyToast.style.background = '#333', 300);
				}, 3000);
				return;
			}
			const trySend = () => {
				try { win.postMessage(payload, '*'); } catch (e) { }
			};
			trySend();
			setTimeout(trySend, 300);
			setTimeout(trySend, 800);
			setTimeout(trySend, 1500);
			toast(`Opened MD Explorer: ${result.filename}`);
		};

		toggleViewBtn.onclick = () => {
			const isMobile = window.innerWidth < 768;
			if (isMobile) {
				// Mobile: toggle bottom panel
				const treePanel = document.getElementById('bottom-tree-panel');
				if (!treePanel) return;
				const isCollapsed = treePanel.classList.toggle('collapsed');
				toggleText.textContent = isCollapsed ? 'Tree' : 'Tree ✓';
			} else {
				// Desktop: toggle sidebar tree panel
				const sidebarTreePanel = document.getElementById('sidebar-tree-panel');
				if (!sidebarTreePanel) return;
				const isCollapsed = sidebarTreePanel.classList.toggle('collapsed');
				toggleText.textContent = isCollapsed ? 'Tree' : 'Tree ✓';
			}
		};

		// Expand/Collapse all nodes across both tree views (desktop + mobile)
		const forEachTreeNode = (mutator) => {
			[treeRoot, treeMobile].forEach(root => {
				if (!root) return;
				root.querySelectorAll('.json-node').forEach(mutator);
			});
		};

		window.expandAllTree = () => {
			forEachTreeNode(node => node.classList.remove('collapsed'));
		};

		window.collapseAllTree = () => {
			forEachTreeNode(node => node.classList.add('collapsed'));
		};


		// ── Sidebar Panel Toggle & Resize ──────────────────
		(function () {
			const sidebarEl = document.getElementById('sidebar');
			const panels = Array.from(sidebarEl.querySelectorAll('.sidebar-panel'));
			const resizers = Array.from(sidebarEl.querySelectorAll('.sidebar-resizer'));

			// Toggle panel collapse on header click
			panels.forEach(panel => {
				const header = panel.querySelector('.sidebar-panel-header');
				header.addEventListener('click', (e) => {
					if (e.target.closest('#close-sidebar, .tree-action')) return;
					panel.classList.toggle('collapsed');
				});
			});

			// Resizer drag
			let activeResizer = null, resizerAbove = null, resizerBelow = null;
			let startY = 0, startAboveH = 0, startBelowH = 0;

			function getExpandedNeighbors(resizerEl) {
				let above = null, below = null;
				let prev = resizerEl.previousElementSibling;
				while (prev) {
					if (prev.classList.contains('sidebar-panel') && !prev.classList.contains('collapsed')) { above = prev; break; }
					prev = prev.previousElementSibling;
				}
				let next = resizerEl.nextElementSibling;
				while (next) {
					if (next.classList.contains('sidebar-panel') && !next.classList.contains('collapsed')) { below = next; break; }
					next = next.nextElementSibling;
				}
				return { above, below };
			}

			resizers.forEach(r => {
				r.addEventListener('pointerdown', (e) => {
					const nb = getExpandedNeighbors(r);
					if (!nb.above || !nb.below) return;
					activeResizer = r;
					resizerAbove = nb.above;
					resizerBelow = nb.below;
					startY = e.clientY;
					startAboveH = resizerAbove.getBoundingClientRect().height;
					startBelowH = resizerBelow.getBoundingClientRect().height;
					document.body.style.cursor = 'ns-resize';
					document.body.classList.add('select-none');
					e.preventDefault();
				});
			});

			document.addEventListener('pointermove', (e) => {
				if (activeResizer) {
					const delta = e.clientY - startY;
					resizerAbove.style.flex = `0 0 ${Math.max(40, startAboveH + delta)}px`;
					resizerBelow.style.flex = `0 0 ${Math.max(40, startBelowH - delta)}px`;
				}
				if (isResizingH) {
					const newWidth = Math.max(160, Math.min(600, e.clientX));
					sidebarEl.style.width = `${newWidth}px`;
				}
			});

			document.addEventListener('pointerup', () => {
				if (activeResizer) {
					activeResizer = null; resizerAbove = null; resizerBelow = null;
					document.body.style.cursor = '';
					document.body.classList.remove('select-none');
				}
			});

			// Sidebar width resizing (Horizontal)
			const hResizer = document.getElementById('sidebar-h-resizer');
			let isResizingH = false;
			hResizer.addEventListener('pointerdown', (e) => {
				isResizingH = true;
				document.body.style.cursor = 'ew-resize';
				document.body.classList.add('select-none');
				e.preventDefault();
			});
			document.addEventListener('pointerup', () => {
				if (isResizingH) {
					isResizingH = false;
					document.body.style.cursor = '';
					document.body.classList.remove('select-none');
				}
			});
		})();

		// ── Bottom Tree Panel Toggle & Resize ──────────────
		(function () {
			const bottomPanel = document.getElementById('bottom-tree-panel');
			const bottomHeader = bottomPanel.querySelector('.bottom-tree-header');
			const bottomResizer = document.getElementById('bottom-resizer');
			const editorContainer = document.getElementById('editor-container');

			bottomHeader.addEventListener('click', (e) => {
				if (e.target.closest('.tree-action')) return;
				const isCollapsed = bottomPanel.classList.toggle('collapsed');
				toggleText.textContent = isCollapsed ? 'Tree' : 'Tree ✓';
				if (isCollapsed) {
					editorContainer.style.flex = '';
					bottomPanel.style.flex = '';
				}
			});

			// Resizer drag
			let isResizing = false;
			let startY = 0;
			let startEditorH = 0;
			let startPanelH = 0;

			bottomResizer.addEventListener('pointerdown', (e) => {
				if (bottomPanel.classList.contains('collapsed')) return;
				isResizing = true;
				startY = e.clientY;
				startEditorH = editorContainer.getBoundingClientRect().height;
				startPanelH = bottomPanel.getBoundingClientRect().height;
				document.body.style.cursor = 'ns-resize';
				document.body.classList.add('select-none');
				e.preventDefault();
			});

			document.addEventListener('pointermove', (e) => {
				if (!isResizing) return;
				const delta = e.clientY - startY;
				const newEditorH = Math.max(100, startEditorH + delta);
				const newPanelH = Math.max(100, startPanelH - delta);
				editorContainer.style.flex = `0 0 ${newEditorH}px`;
				bottomPanel.style.flex = `0 0 ${newPanelH}px`;
			});

			document.addEventListener('pointerup', () => {
				if (isResizing) {
					isResizing = false;
					document.body.style.cursor = '';
					document.body.classList.remove('select-none');
				}
			});
		})();

		function toast(msg) {
			copyToast.textContent = msg;
			copyToast.classList.add("visible");
			setTimeout(() => copyToast.classList.remove("visible"), 2000);
		}

		window.saveJson = () => {
			if (!editor || !currentFileName) return;
			const text = sourceJSON !== null ? sourceJSON : editor.state.doc.toString();
			download(text, currentFileName);
		};

		window.saveFormattedJson = () => {
			if (!editor || !currentFileName) return;
			try {
				const text = sourceJSON !== null ? sourceJSON : editor.state.doc.toString();
				const formatted = JSON.stringify(JSON.parse(text), null, 2);
				download(formatted, currentFileName.replace(/\.[^.]+$/, "") + ".formatted.json");
			} catch (e) {
				alert("Invalid JSON - cannot format for save");
			}
		};

		window.copyRawJson = () => {
			if (!editor) return;
			const text = sourceJSON !== null ? sourceJSON : editor.state.doc.toString();
			navigator.clipboard.writeText(text).then(() => toast("RAW JSON copied to clipboard"));
			saveDropdownMenu.classList.remove('visible');
		};

		window.copyFormattedJson = () => {
			if (!editor) return;
			try {
				const text = sourceJSON !== null ? sourceJSON : editor.state.doc.toString();
				const formatted = JSON.stringify(JSON.parse(text), null, 2);
				navigator.clipboard.writeText(formatted).then(() => toast("Formatted JSON copied to clipboard"));
			} catch (e) {
				alert("Invalid JSON - cannot format for copy");
			}
			saveDropdownMenu.classList.remove('visible');
		};

		function download(text, filename) {
			const blob = new Blob([text], { type: "application/json" });
			const url = URL.createObjectURL(blob);
			const a = document.createElement("a");
			a.href = url;
			a.download = filename;
			a.click();
			URL.revokeObjectURL(url);
		}

		downloadBtn.onclick = saveJson;

		function readFileAsText(file) {
			return new Promise((resolve) => {
				const reader = new FileReader();
				reader.onload = (e) => resolve(e.target.result);
				reader.readAsText(file);
			});
		}

		openBtn.onclick = () => fileInput.click();

		window.createNewScratchpad = function () {
			// Save current content before creating new
			// State is automatically saved via updateListener
			currentFileName = "scratchpad.json";
			instances[currentInstance].fileName = "scratchpad.json";
			instances[currentInstance].content = "";
			sourceJSON = null; // Clear source JSON
			sourceBtn.classList.add("hidden"); // Hide source button
			initEditor("", "json");
			updateTabTitle();
			if (window.innerWidth < 768 && document.body.classList.contains("mobile-sidebar-active")) toggleSidebar();
		};

		newBtn.onclick = createNewScratchpad;
		fileInput.onchange = (e) => handleFileSelect(e.target.files);

		// Initialize
		(function init() {
			currentFileName = instances[currentInstance].fileName;
			const isJson = currentFileName.toLowerCase().endsWith(".json");

			// ── Standalone new-tab import from edu.html ──────────────────────
			// When edu.html opens jsv.html in a new browser tab it stashes the
			// decrypted text in localStorage under 'jsv_import_data'.  Pick it
			// up here, load it, then remove the key so it doesn't pollute future
			// sessions.  Only do this when NOT inside a workspace iframe.
			const isInsideFrame = window.parent && window.parent !== window;
			if (!isInsideFrame) {
				try {
					const importData = localStorage.getItem('jsv_import_data');
					if (importData) {
						localStorage.removeItem('jsv_import_data');
						currentFileName = 'decrypted.json';
						instances[currentInstance].content = importData;
						instances[currentInstance].fileName = currentFileName;
						initEditor(importData, 'json');
						buildTree(importData);
						saveJsvState();
						updateTabTitle();
						document.getElementById("instance-label").textContent = `JSON ${currentInstance + 1}`;
						document.querySelectorAll(".instance-btn").forEach(btn => {
							btn.classList.remove("bg-blue-100", "dark:bg-blue-900/30");
							if (parseInt(btn.dataset.instance) === currentInstance) {
								btn.classList.add("bg-blue-100", "dark:bg-blue-900/30");
							}
						});
						return; // skip normal init below
					}
				} catch (e) { /* localStorage unavailable */ }
			}

			const cleanedContent = cleanLiteralNewlinesIfJson(instances[currentInstance].content, currentFileName);
			instances[currentInstance].content = cleanedContent;
			initEditor(cleanedContent, isJson ? "json" : "javascript");

			if (cleanedContent.trim()) {
				buildTree(cleanedContent);
			} else {
				treeRoot.innerHTML = '<div class="text-gray-400 p-8 text-center italic">Not currently showing tree for non-JSON content.</div>';
			}

			// Update UI
			document.getElementById("instance-label").textContent = `JSON ${currentInstance + 1}`;
			document.querySelectorAll(".instance-btn").forEach(btn => {
				btn.classList.remove("bg-blue-100", "dark:bg-blue-900/30");
				if (parseInt(btn.dataset.instance) === currentInstance) {
					btn.classList.add("bg-blue-100", "dark:bg-blue-900/30");
				}
			});

			if (window.parent && window.parent !== window) {
				window.parent.postMessage({
					type: 'toolSelection',
					url: window.location.pathname.split('/').pop() + window.location.search
				}, '*');
				// Send ready message after editor is initialized
				setTimeout(() => {
					syncPostMessage({
						type: 'ready',
						format: currentFileName?.toLowerCase().endsWith('.json') ? 'json' : 'javascript',
						version: syncVersion
					});
				}, 50);
			}
			updateTabTitle();
		})();

		// ── postMessage API: receive content from parent frame ─────────────
		window.addEventListener('message', function (event) {
			const msg = event.data;
			if (!msg || msg.type !== 'loadContent') return;

			// Binary payload: jsv.html is a text/JSON editor and does not
			// render PDFs. Surface a red toast and bail.
			if (msg.bytes && !(typeof msg.text === 'string' && msg.text.length > 0)) {
				toast('jsv.html does not accept PDF bytes — load PDFs in pdf.html');
				copyToast.style.background = '#ef4444';
				setTimeout(() => { copyToast.style.opacity = '0'; setTimeout(() => copyToast.style.background = '#333', 300); }, 3000);
				syncPostMessage({
					type: 'error',
					code: 'load_failed',
					message: 'jsv.html does not accept PDF bytes — load PDFs in pdf.html'
				});
				return;
			}

			const text = typeof msg.text === 'string' ? msg.text : '';
			const filename = typeof msg.filename === 'string' ? msg.filename : `scratchpad-${currentInstance + 1}.json`;

			// Store targetOrigin for outbound messages (default to event.origin)
			if (msg.options?.targetOrigin) {
				syncTargetOrigin = msg.options.targetOrigin;
			} else {
				syncTargetOrigin = event.origin || '*';
			}

			// Cancel any pending contentChange (content is being replaced)
			clearTimeout(syncDebounceTimer);
			syncDebounceTimer = null;
			syncPendingChange = null;

			// Set loading flag to skip change events from initEditor
			_syncLoadingContent = true;

			// Update state
			currentFileName = filename;
			sourceJSON = null;
			sourceBtn.classList.add('hidden');
			const cleanedText = cleanLiteralNewlinesIfJson(text, filename);
			instances[currentInstance].content = cleanedText;
			instances[currentInstance].fileName = filename;

			// Auto-detect language from filename extension
			const isJson = filename.toLowerCase().endsWith('.json');
			const lang = isJson ? 'json' : 'javascript';
			initEditor(cleanedText, lang);
			updateTabTitle();
			saveJsvState();

			// Rebuild tree for JSON-shaped content; otherwise show the
			// existing "not JSON" hint used in displayFile()
			const trimmed = cleanedText.trim();
			if (isJson || !trimmed || trimmed.startsWith('{') || trimmed.startsWith('[')) {
				buildTree(cleanedText);
			} else {
				treeRoot.innerHTML = '<div class="text-gray-400 p-8 text-center italic">Not currently showing tree for non-JSON content.</div>';
			}

			// Increment version and acknowledge back to sender
			syncVersion++;
			const replyVersion = syncVersion;
			if (event.source) {
				event.source.postMessage({
					type: 'loadContentAck',
					filename: filename,
					format: lang,
					version: replyVersion
				}, syncTargetOrigin);
			}

			// Show visual feedback for successful load
			toast(`Loaded: ${filename}`);

			// Clear loading flag
			_syncLoadingContent = false;
		});
		// ── Iframe Embed Mode ─────────────────────────────────────────────
		(function () {
			const urlParams = new URLSearchParams(window.location.search);
			const showChrome = urlParams.get('show_chrome') === '1';

			const isInsideFrame = window.parent && window.parent !== window;
			const iframeMode = isInsideFrame && !showChrome;

			if (iframeMode) {
				document.body.classList.add('iframe-mode');
			}

			const toggleBtn = document.getElementById('iframe-sidebar-toggle');
			const sidebarEl = document.getElementById('sidebar');
			const toggleIcon = document.getElementById('iframe-toggle-icon');
			const ICON_OPEN = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>';
			const ICON_CLOSE = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>';

			let sidebarCollapsed = false;

			if (toggleBtn) {
				toggleBtn.addEventListener('click', () => {
					sidebarCollapsed = !sidebarCollapsed;
					if (sidebarCollapsed) {
						sidebarEl.classList.add('iframe-sidebar-collapsed');
						toggleIcon.innerHTML = ICON_OPEN;
						toggleBtn.title = 'Show sidebar';
						toggleBtn.style.left = '8px';
					} else {
						sidebarEl.classList.remove('iframe-sidebar-collapsed');
						toggleIcon.innerHTML = ICON_CLOSE;
						toggleBtn.title = 'Hide sidebar';
						toggleBtn.style.left = (sidebarEl.offsetWidth + 4) + 'px';
					}
				});

				// Position toggle correctly after sidebar renders
				if (iframeMode) {
					requestAnimationFrame(() => {
						toggleIcon.innerHTML = ICON_CLOSE;
						toggleBtn.title = 'Hide sidebar';
						toggleBtn.style.left = (sidebarEl.offsetWidth + 4) + 'px';
					});
				}
			}
		})();
	</script>
	<script src="dylen-shorthand.js"></script>
	<script src="footer.js"></script>
