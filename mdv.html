<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Markdown Explorer</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
		rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						sans: ['Inter', 'sans-serif'],
					},
				}
			}
		}
	</script>
	<script src="vendor/marked.min.js"></script>
	<link rel="stylesheet" href="vendor/katex/katex.min.css">
	<script src="vendor/katex/katex.min.js"></script>
	<script src="vendor/purify.min.js"></script>
	<link href="vendor/prism-tomorrow.min.css" rel="stylesheet" />
	<script src="vendor/prism.min.js"></script>
	<script src="vendor/prism-markdown.min.js"></script>
	<script src="vendor/prism-bash.min.js"></script>
	<script src="vendor/prism-javascript.min.js"></script>
	<script src="vendor/prism-python.min.js"></script>
	<link rel="stylesheet" href="mdv-comments.css">
	<link rel="stylesheet" href="theme.css">

	<style>
		:root {
			--reader-font-size: 1rem;
		}

		@media (max-width: 640px) {
			:root {
				--reader-font-size: 0.875rem;
			}
		}

		.prose {
			max-width: none;
			color: var(--text-primary) !important;
			font-size: var(--reader-font-size);
			line-height: 1.7;
			word-wrap: break-word;
		}

		.prose p,
		.prose ul,
		.prose ol,
		.prose blockquote,
		.prose pre,
		.prose table {
			margin-top: 1.25em;
			margin-bottom: 1.25em;
		}

		.prose h1 {
			font-size: clamp(1.5rem, 4vw, 2.5em);
			line-height: 1.2;
			margin-top: 0;
			margin-bottom: 0.8em;
			border-bottom: 2px solid var(--border-default);
			padding-bottom: 0.3em;
			color: var(--text-primary);
		}

		.prose h2 {
			font-size: clamp(1.25rem, 3vw, 1.8em);
			line-height: 1.3;
			margin-top: 2em;
			margin-bottom: 1em;
			border-bottom: 1px solid var(--border-subtle);
			padding-bottom: 0.2em;
			color: var(--text-primary);
		}

		.prose h3 {
			font-size: clamp(1.1rem, 2vw, 1.4em);
			margin-top: 1.6em;
			margin-bottom: 0.6em;
			color: var(--text-secondary);
		}

		.prose ul {
			list-style-type: disc;
			padding-left: 1.5em;
		}

		.prose ol {
			list-style-type: decimal;
			padding-left: 1.5em;
		}

		.prose li {
			margin-top: 0.5em;
			margin-bottom: 0.5em;
			padding-left: 0.25em;
		}

		.prose li>p {
			margin-top: 0.5em;
			margin-bottom: 0.5em;
		}

		.prose blockquote {
			border-left: 4px solid var(--border-default);
			padding-left: 1.25em;
			font-style: italic;
			color: var(--text-secondary);
		}

		/* Code Handling */
		.prose :not(pre)>code {
			background-color: var(--code-inline-bg);
			padding: 0.2em 0.4em;
			border-radius: 0.25rem;
			font-family: var(--font-mono);
			font-size: 0.85em;
			color: var(--code-inline-text);
		}

		.prose pre {
			background-color: var(--code-bg) !important;
			padding: 1rem !important;
			border-radius: var(--radius-lg);
			overflow-x: auto;
			border: 1px solid var(--border-default);
		}

		.prose pre code {
			background: transparent !important;
			padding: 0 !important;
			border-radius: 0 !important;
			font-size: 0.85em !important;
			line-height: 1.5 !important;
			color: var(--text-primary) !important;
			font-family: var(--font-mono) !important;
		}

		/* Tables */
		.prose table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9em;
			display: block;
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		.prose th {
			background-color: var(--bg-surface-hover);
			text-align: left;
		}

		.prose th,
		.prose td {
			border: 1px solid var(--border-default);
			padding: 0.75em;
		}

		/* Responsive Media */
		.prose img,
		.prose video,
		.prose iframe {
			max-width: 100%;
			height: auto;
			border-radius: var(--radius-md);
		}

		/* KaTeX Math Styling */
		.katex-display {
			margin: 1.5em 0 !important;
			overflow-x: auto;
			overflow-y: hidden;
			padding: 0.5em 0;
		}

		.katex {
			font-size: 1.1em;
		}

		@media (prefers-color-scheme: dark) {
			body {
				background-color: var(--bg-root);
				color: var(--text-primary);
			}

			.sidebar {
				background-color: var(--bg-surface);
				border-color: var(--border-default);
			}

			.prose {
				color: var(--text-primary);
			}

			.prose h1 {
				color: var(--text-primary);
				border-color: var(--border-default);
			}

			.prose h2 {
				color: var(--text-primary);
				border-color: var(--border-subtle);
			}

			.prose h3 {
				color: var(--text-secondary);
			}

			.prose :not(pre)>code {
				background-color: var(--code-inline-bg);
				color: var(--code-inline-text);
			}

			.prose blockquote {
				border-color: var(--border-default);
				color: var(--text-secondary);
			}

			.prose th {
				background-color: var(--bg-surface-hover);
			}

			.prose th,
			.prose td {
				border-color: var(--border-default);
			}

			.file-item:hover {
				background-color: var(--bg-surface-hover);
			}
		}

		.file-item.active {
			background-color: var(--accent) !important;
			color: white !important;
		}

		.mobile-sidebar-active #sidebar {
			display: flex !important;
			position: fixed;
			inset: 0;
			z-index: 60;
			width: 100%;
		}

		#editor-container {
			min-height: 0;
			display: flex;
			flex-direction: column;
			transition: all var(--transition-slow);
		}

		#editor-container.hidden {
			display: none !important;
		}

		#content {
			transition: all var(--transition-slow);
		}

		#editor {
			flex: 1;
			min-height: 0;
		}

		.cm-editor {
			height: 100% !important;
		}

		.cm-scroller {
			overflow: auto !important;
		}

		.no-scrollbar::-webkit-scrollbar {
			display: none;
		}

		.no-scrollbar {
			-ms-overflow-style: none;
			scrollbar-width: none;
		}

		.transition-all {
			transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
		}

		.open-main-btn {
			border-radius: var(--radius-md) 0 0 var(--radius-md) !important;
		}

		.open-chevron-btn {
			border-radius: 0 var(--radius-md) var(--radius-md) 0 !important;
			border-left: 1px solid rgb(64, 64, 70) !important;
			padding-left: 6px;
			padding-right: 6px;
		}

		.open-dropdown-menu {
			left: 0 !important;
			right: auto !important;
		}

		/* ─── TTS Reader Styles ─────────────────────────────── */

		.tts-block-wrapper {
			position: relative;
		}

		.tts-speak-btn {
			position: absolute;
			right: 8px;
			top: 50%;
			transform: translateY(-50%);
			width: 32px;
			height: 32px;
			border: none;
			background: none;
			color: var(--text-tertiary);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			border-radius: 50%;
			z-index: 1;
			transition: opacity var(--transition-fast), background var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
			-webkit-tap-highlight-color: transparent;
		}

		@media (hover: hover) {
			.tts-block-wrapper:hover .tts-speak-btn {
				opacity: 1;
				pointer-events: auto;
			}
		}

		@media (hover: none) {
			.tts-speak-btn {
				opacity: 0.3;
				pointer-events: auto;
			}
			.tts-speak-btn:active {
				opacity: 1;
				background: var(--accent);
				color: #fff;
			}
		}

		.tts-speak-btn svg {
			width: 18px;
			height: 18px;
		}

		.tts-speak-btn:hover {
			background: var(--bg-surface-raised);
			color: var(--accent);
			transform: translateY(-50%) scale(1.1);
		}

		.tts-active-block > *:first-child,
		.tts-active-block {
			border-left: 2px solid var(--accent) !important;
			background: var(--bg-surface-raised);
		}

		@media (max-width: 600px) {
			.tts-speak-btn {
				width: 36px;
				height: 36px;
				border-radius: 6px 0 0 6px;
			}
			.tts-speak-btn svg {
				width: 18px;
				height: 18px;
			}
		}

		/* Floating TTS Player Bar */
		#tts-player-bar {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			z-index: 100;
			background: var(--bg-surface);
			border-top: 1px solid var(--border-default);
			transform: translateY(100%);
			transition: transform var(--transition-slow);
			display: flex;
			align-items: center;
			gap: var(--space-3);
			padding: var(--space-2) var(--space-4);
			flex-wrap: wrap;
		}

		#tts-player-bar.visible {
			transform: translateY(0);
		}

		.tts-bar-status {
			flex: 1;
			min-width: 0;
			display: flex;
			flex-direction: column;
			gap: 2px;
		}

		.tts-bar-title {
			font-size: var(--font-size-xs);
			color: var(--text-tertiary);
			font-weight: 500;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.tts-bar-text {
			font-size: var(--font-size-sm);
			color: var(--text-primary);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.tts-bar-controls {
			display: flex;
			align-items: center;
			gap: var(--space-2);
			flex-shrink: 0;
		}

		.tts-bar-btn {
			width: 40px;
			height: 40px;
			border-radius: 50%;
			border: 1px solid var(--border-default);
			background: var(--bg-surface-raised);
			color: var(--text-primary);
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: all var(--transition-fast);
			flex-shrink: 0;
		}

		.tts-bar-btn svg {
			width: 18px;
			height: 18px;
		}

		.tts-bar-play-btn {
			width: 44px;
			height: 44px;
			background: var(--accent);
			border-color: var(--accent);
			color: #ffffff;
		}

		.tts-bar-btn svg {
			width: 15px;
			height: 15px;
		}

		.tts-bar-btn:hover:not(:disabled) {
			border-color: var(--accent);
			color: var(--accent-text);
		}

		.tts-bar-btn:disabled {
			color: var(--text-disabled);
			border-color: var(--border-subtle);
			cursor: not-allowed;
		}

		.tts-bar-play-btn {
			width: 40px;
			height: 40px;
			background: var(--accent);
			border-color: var(--accent);
			color: #ffffff;
		}

		.tts-bar-play-btn:hover:not(:disabled) {
			background: var(--accent-hover);
			border-color: var(--accent-hover);
			color: #ffffff;
		}

		.tts-bar-close-btn {
			border: none;
			background: transparent;
			color: var(--text-tertiary);
		}

		.tts-bar-close-btn:hover:not(:disabled) {
			color: var(--danger);
			border-color: transparent;
		}

		.tts-bar-select {
			background: var(--bg-surface-raised);
			border: 1px solid var(--border-default);
			border-radius: var(--radius-md);
			padding: 8px 10px;
			color: var(--text-primary);
			font-family: var(--font-sans);
			font-size: var(--font-size-sm);
			outline: none;
			cursor: pointer;
			transition: border-color var(--transition-fast);
		}

		.tts-bar-select:focus {
			border-color: var(--accent);
		}

		.tts-bar-progress {
			width: 100%;
			height: 3px;
			background: var(--border-default);
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
		}

		.tts-bar-progress-fill {
			height: 100%;
			background: var(--accent);
			width: 0%;
			transition: width var(--transition-base);
		}

		.tts-loading-indicator {
			width: 16px;
			height: 16px;
			border: 2px solid var(--border-default);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: tts-spin 0.7s linear infinite;
			flexshrink: 0;
			display: none;
		}

		.tts-loading-indicator.active {
			display: block;
		}

		@keyframes tts-spin {
			to { transform: rotate(360deg); }
		}

		.tts-toggle-btn {
			position: relative;
		}

		.tts-toggle-dot {
			position: absolute;
			top: -2px;
			right: -2px;
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: var(--accent);
			display: none;
		}

		.tts-toggle-dot.visible {
			display: block;
		}

		@media (max-width: 600px) {
			#tts-player-bar {
				padding: var(--space-2) var(--space-2);
				gap: var(--space-2);
			}
			.tts-bar-controls {
				gap: var(--space-1);
			}
			.tts-bar-btn {
				width: 36px;
				height: 36px;
			}
			.tts-bar-play-btn {
				width: 40px;
				height: 40px;
			}
			.tts-bar-btn svg {
				width: 16px;
				height: 16px;
			}
			.tts-bar-select {
				padding: 6px 8px;
				font-size: var(--font-size-xs);
			}
			.tts-bar-text {
				font-size: var(--font-size-xs);
			}
		}
	</style>
</head>

<body class="h-screen flex flex-col overflow-hidden transition-colors duration-200">
	<header class="app-header z-50 shrink-0">
		<div class="app-header-row">
			<div class="flex items-center gap-2">
				<a href="index.html" class="btn-icon" title="Home">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
						</path>
					</svg>
				</a>
				<div class="p-1.5 rounded-lg shadow-sm"
					style="background: linear-gradient(to bottom right, #2563eb, #4338ca);">
					<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
						</path>
					</svg>
				</div>
				<h1 class="text-sm font-bold uppercase tracking-tight sm:text-lg sm:normal-case">MD Explorer</h1>
			</div>

			<div class="flex items-center gap-1.5 sm:gap-2">
				<input type="file" id="file-input" multiple accept=".md,.markdown,.txt,text/markdown,text/plain"
					class="hidden" />
				<div class="save-dropdown-wrapper" id="open-dropdown-wrapper">
					<button id="open-btn"
						class="open-main-btn btn btn-gradient-blue btn-sm sm:px-4 sm:py-2 sm:text-sm shadow-sm hover:shadow-md transition-all transform active:scale-95">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
						</svg>
						<span class="hidden sm:inline" id="btn-text">Open</span>
					</button>
					<button id="open-chevron-btn"
						class="open-chevron-btn btn btn-gradient-blue btn-sm sm:py-2 sm:text-sm shadow-sm hover:shadow-md transition-all transform active:scale-95 hidden">
						<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
							</path>
						</svg>
					</button>
					<div id="open-dropdown-menu" class="save-dropdown-menu open-dropdown-menu">
						<button class="save-dropdown-item" onclick="openDirectoryPicker()">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
							</svg>
							Open Directory
						</button>
						<button class="save-dropdown-item" onclick="openFilePickerFS()">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
							</svg>
							Open File(s)
						</button>
					</div>
				</div>
				<button id="paste-btn" class="btn btn-sm sm:px-4 sm:py-2 sm:text-sm">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
						</path>
					</svg>
					<span class="hidden sm:inline">Paste</span>
				</button>
				<div class="save-dropdown-wrapper" id="save-dropdown-wrapper">
					<button id="save-main-btn"
						class="save-main-btn btn btn-gradient-green btn-sm sm:px-4 sm:py-2 sm:text-sm shadow-sm hover:shadow-md transition-all transform active:scale-95">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
						</svg>
						<span class="hidden sm:inline">Save</span>
					</button>
					<button id="save-chevron-btn"
						class="save-chevron-btn btn btn-gradient-green btn-sm sm:py-2 sm:text-sm shadow-sm hover:shadow-md transition-all transform active:scale-95">
						<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
							</path>
						</svg>
					</button>
					<div id="save-dropdown-menu" class="save-dropdown-menu">
						<button class="save-dropdown-item" onclick="saveMarkdownOnly()">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
							</svg>
							Save Markdown
						</button>
						<button class="save-dropdown-item" onclick="saveMarkdownWithComments()">
							<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
								</path>
							</svg>
							Save MD + Comments
						</button>
						<div class="save-dropdown-divider"></div>

	<script src="vendor/cm-md-bundle.js"></script>
	<script>
		const { EditorView, basicSetup, markdown, oneDark } = window.CM_MD;

		const openBtn = document.getElementById("open-btn");
		const pasteBtn = document.getElementById("paste-btn");
		const fileInput = document.getElementById("file-input");
		const fileListContainer = document.getElementById("file-list");
		const contentArea = document.getElementById("content");
		const editorContainer = document.getElementById("editor-container");
		const editorEl = document.getElementById("editor");
		const emptyState = document.getElementById("empty-state");
		const sidebar = document.getElementById("sidebar");
		const mobileMenu = document.getElementById("mobile-menu");
		const closeSidebar = document.getElementById("close-sidebar");
		const zoomLabel = document.getElementById("zoom-level");
		const editControls = document.getElementById("edit-controls");
		const toggleEditBtn = document.getElementById("toggle-edit-btn");
		const toggleText = document.getElementById("toggle-text");
		let loadedFiles = new Map();
		let currentZoom = 1.0;
		var isEditing = true;
		var currentFileName = "Untitled.md";
		var editor = null;
		let lineWrap = true;
		let currentFileHandle = null;
		const isFileSystemApiSupported = "showDirectoryPicker" in window;
		const MDV_STORAGE_KEY = window.name && window.name.startsWith('tab_') 
			? `mdv_state_${window.name}` 
			: 'mdv_state_default';

		function saveMdvState() {
			if (editor) {
				localStorage.setItem(MDV_STORAGE_KEY, editor.state.doc.toString());
			}
		}

		function loadMdvState() {
			return localStorage.getItem(MDV_STORAGE_KEY) || "";
		}

		// Initialize CodeMirror
		function initEditor(initialValue = "") {
			if (editor) {
				editor.destroy();
			}

			const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
			const extensions = [
				basicSetup,
				markdown(),
				isDark ? oneDark : [],
				EditorView.theme({
					"&": { height: "100%", fontSize: "var(--editor-font-size)", backgroundColor: "var(--bg-surface)" },
					".cm-scroller": { overflow: "auto", fontFamily: "var(--font-mono)" },
					".cm-content": { fontWeight: "400 !important", fontFamily: "var(--font-mono) !important" },
					".cm-line": { fontWeight: "400 !important" },
					".ͼ1 .cm-keyword": { fontWeight: "500 !important" },
					".ͼ1 .cm-variableName": { fontWeight: "400 !important" },
					".ͼ1 .cm-typeName": { fontWeight: "500 !important" },
					".cm-gutters": { backgroundColor: "var(--bg-surface)", borderRightColor: "var(--border-subtle)", color: "var(--text-tertiary)" }
				}),
				EditorView.updateListener.of((update) => {
					if (update.docChanged) {
						updatePreview();
						saveMdvState();
					}
				})
			];

			if (lineWrap) {
				extensions.push(EditorView.lineWrapping);
			}

			editor = new EditorView({
				doc: initialValue,
				extensions: extensions,
				parent: editorEl
			});
		}

		function updatePreview() {
			if (editor) {
				const text = editor.state.doc.toString();
				contentArea.innerHTML = DOMPurify.sanitize(marked.parse(text));
				updateOutline();
				Prism.highlightAllUnder(contentArea);
				if (window.MdvComments) MdvComments.applyHighlights();
				updateFooterInfo();
			}
		}

		function formatSize(bytes) {
			if (bytes < 1024) return bytes + ' B';
			if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
			return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
		}

		function updateFooterInfo() {
			const el = document.getElementById('footer-file-info');
			if (!el || !editor) return;
			const text = editor.state.doc.toString();
			const bytes = new TextEncoder().encode(text).length;
			const lines = editor.state.doc.lines;
			const parts = [];
			if (currentFileName) parts.push(currentFileName);
			parts.push(formatSize(bytes));
			parts.push(lines + ' line' + (lines !== 1 ? 's' : ''));
			el.textContent = parts.join(' · ');
		}

		function updateOutline() {
			if (!editor) return;
			const text = editor.state.doc.toString();
			const outlineList = document.getElementById("outline-list");
			const headings = [];

			const lines = text.split("\n");
			lines.forEach((line, index) => {
				const match = line.match(/^(#{1,6})\s+(.+)$/);
				if (match) {
					headings.push({ level: match[1].length, text: match[2].trim(), line: index });
				}
			});

			if (headings.length === 0) {
				outlineList.innerHTML = '<div class="text-gray-400 text-xs italic p-8 text-center">No headings found.</div>';
				return;
			}

			outlineList.innerHTML = headings.map(h => `
				<button 
					onclick="scrollToHeading(${h.line}, '${h.text.replace(/'/g, "\\'")}')"
					class="w-full text-left px-3 py-1.5 rounded-md text-[11px] transition-all truncate hover:bg-[var(--bg-surface-hover)]"
					style="padding-left: ${h.level * 0.75}rem; color: var(--text-secondary);"
				>
					${h.text}
				</button>
			`).join("");
		}

		window.scrollToHeading = (line, originalText) => {
			if (isEditing && editor) {
				const pos = editor.state.doc.line(line + 1).from;
				editor.dispatch({
					selection: { anchor: pos, head: pos },
					scrollIntoView: true
				});
				editor.focus();
			} else {
				// Find heading in contentArea
				const headers = contentArea.querySelectorAll("h1, h2, h3, h4, h5, h6");
				for (const h of headers) {
					if (h.textContent.trim() === originalText) {
						h.scrollIntoView({ behavior: "smooth", block: "start" });
						break;
					}
				}
			}
		};

		window.toggleWrap = function () {
			lineWrap = !lineWrap;
			const btn = document.getElementById("wrap-toggle-btn");
			if (lineWrap) {
				btn.style.background = "var(--accent)";
				btn.style.color = "#fff";
			} else {
				btn.style.background = "";
				btn.style.color = "";
			}
			if (editor) {
				const currentDoc = editor.state.doc.toString();
				initEditor(currentDoc);
			}
		};

		// Initialize wrap button state
		const wrapBtn = document.getElementById("wrap-toggle-btn");
		wrapBtn.style.background = "var(--accent)";
		wrapBtn.style.color = "#fff";

		const toggleSidebar = () => {
			document.body.classList.toggle("mobile-sidebar-active");
			const isActive = document.body.classList.contains("mobile-sidebar-active");
			document.getElementById("menu-icon").innerHTML = isActive
				? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>'
				: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>';
		};

		mobileMenu.onclick = toggleSidebar;
		closeSidebar.onclick = toggleSidebar;

		if (isFileSystemApiSupported) {
			document.getElementById("btn-text").textContent = "Directory";
		}

		const mathExtension = {
			name: 'math',
			level: 'inline',
			start(src) { return src.indexOf('$'); },
			tokenizer(src, tokens) {
				const blockRule = /^\$\$\n?([\s\S]+?)\n?\$\$/;
				const inlineRule = /^\$((?:\S)|(?:\S[\s\S]*?\S))\$(?!\d)/;

				let match;
				if (match = blockRule.exec(src)) {
					return {
						type: 'math',
						raw: match[0],
						text: match[1].trim(),
						displayMode: true
					};
				} else if (match = inlineRule.exec(src)) {
					return {
						type: 'math',
						raw: match[0],
						text: match[1].trim(),
						displayMode: false
					};
				}
			},
			renderer(token) {
				try {
					return katex.renderToString(token.text, {
						displayMode: token.displayMode,
						throwOnError: false
					});
				} catch (e) {
					console.error('KaTeX error:', e);
					return token.raw;
				}
			}
		};

			// Toggle panel collapse

				header.addEventListener("click", (e) => {
					// Don't toggle when clicking the close-sidebar button
					if (e.target.closest('#close-sidebar')) return;
					panel.classList.toggle("collapsed");
				});
			});

			// Resizer drag logic
			let activeResizer = null;
			let resizerAbove = null;
			let resizerBelow = null;
			let startY = 0;
			let startAboveH = 0;
			let startBelowH = 0;

			function getExpandedNeighbors(resizerEl) {
				let above = null, below = null;
				let prev = resizerEl.previousElementSibling;
				while (prev) {
					if (prev.classList.contains('sidebar-panel') && !prev.classList.contains('collapsed')) {
						above = prev; break;
					}
					prev = prev.previousElementSibling;
				}
				let next = resizerEl.nextElementSibling;
				while (next) {
					if (next.classList.contains('sidebar-panel') && !next.classList.contains('collapsed')) {
						below = next; break;
					}
					next = next.nextElementSibling;
				}
				return { above, below };
			}

			resizers.forEach(r => {
				r.addEventListener("mousedown", (e) => {
					const neighbors = getExpandedNeighbors(r);
					if (!neighbors.above || !neighbors.below) return;
					activeResizer = r;
					resizerAbove = neighbors.above;
					resizerBelow = neighbors.below;
					startY = e.clientY;
					startAboveH = resizerAbove.getBoundingClientRect().height;
					startBelowH = resizerBelow.getBoundingClientRect().height;
					document.body.style.cursor = "ns-resize";
					document.body.classList.add("select-none");
					e.preventDefault();
				});
			});

			document.addEventListener("mousemove", (e) => {
				if (!activeResizer) return;
				const delta = e.clientY - startY;
				const newAbove = Math.max(40, startAboveH + delta);
				const newBelow = Math.max(40, startBelowH - delta);
				resizerAbove.style.flex = `0 0 ${newAbove}px`;
				resizerBelow.style.flex = `0 0 ${newBelow}px`;
			});

			document.addEventListener("mouseup", () => {
				if (activeResizer) {
					activeResizer = null;
					resizerAbove = null;
					resizerBelow = null;
					document.body.style.cursor = "";
					document.body.classList.remove("select-none");
				}
			});
		})();

	<script type="module">

		// ── Pipeline Loader ───────────────────────────────────────
		async function getPipeline() {
			if (ttsPipeline) return ttsPipeline;
			setBarText('Loading TTS model (' + pipelineDevice.toUpperCase() + ')…', 'Downloading');
			spinner.classList.add('active');

		function cleanTextOf(el) {

				if (currentBlockIdx === -1 && readBlocks.length > 0) {
					startFromBlock(0);
				} else {
					isPlaying = true;
					setPPIcon(true);
					if (audioEl.src && !audioEl.ended && audioEl.readyState >= 2) {
						audioEl.play();
					} else {
						playBlock(currentBlockIdx >= 0 ? currentBlockIdx : 0);
					}
				}
			}
		};

		prevBtn.onclick = () => {
			if (currentBlockIdx > 0) {
				prefetchCache.clear();
				playBlock(currentBlockIdx - 1);
			}
		};

		nextBtn.onclick = () => {
			if (currentBlockIdx < readBlocks.length - 1) {
				prefetchCache.delete(currentBlockIdx); // Keep next block cache
				playBlock(currentBlockIdx + 1);
			} else {
				stopAll();
			}
		};

		closeBtn.onclick = () => {
			if (speakModeActive) {
				window.ttsToggleSpeakMode();
			} else {
				stopAll();
				playerBar.classList.remove('visible');
			}
		};

		// Invalidate cache when settings change
		voiceSelect.onchange = () => { prefetchCache.clear(); };
		speedSelect.onchange = () => { prefetchCache.clear(); };		

		// ── Speak Mode Toggle ─────────────────────────────────────
		window.ttsToggleSpeakMode = function () {
			speakModeActive = !speakModeActive;
			toggleDot.classList.toggle('visible', speakModeActive);

			if (!speakModeActive) {
				savedBlockIdx = currentBlockIdx;
				stopAll();
				playerBar.classList.remove('visible');
				// Remove wrappers
				contentArea.querySelectorAll('.tts-block-wrapper').forEach(w => {
					const child = w.firstElementChild;
					if (child) w.replaceWith(child);
				});
				readBlocks = [];
			} else {
				// Only available in view mode
				if (window.isEditing) {
					// Force view mode
					document.getElementById('toggle-edit-btn').click();
				}
				// Delay slightly to let preview render
				setTimeout(() => {
					scanBlocks();
					detectDevice();
					playerBar.classList.add('visible');
					if (savedBlockIdx >= 0 && savedBlockIdx < readBlocks.length) {
						currentBlockIdx = savedBlockIdx;
						setBlockActive(currentBlockIdx);
						const txt = readBlocks[currentBlockIdx].text;
						setBarText(txt.slice(0, 100) + (txt.length > 100 ? '…' : ''), `Block ${currentBlockIdx + 1} of ${readBlocks.length}`);
						ppBtn.disabled = false;
						prevBtn.disabled = currentBlockIdx === 0;
						nextBtn.disabled = false;
					}
				}, 100);
			}
		};

		// Re-scan blocks whenever the preview content updates
		// Hook into content mutations in view mode
		const contentObserver = new MutationObserver(() => {
			if (isScanning) return;
			if (speakModeActive && !window.isEditing) {
				// Invalidate old entries and re-scan after a brief debounce
				clearTimeout(contentObserver._debounce);
				contentObserver._debounce = setTimeout(() => {
					const wasPlayingIdx = currentBlockIdx;
					scanBlocks();
					if (wasPlayingIdx >= 0) setBlockActive(Math.min(wasPlayingIdx, readBlocks.length - 1));
				}, 300);
			}
		});
		contentObserver.observe(contentArea, { childList: true, subtree: false });

		// Initialize hardware detection eagerly
		detectDevice();
	</script>

	<script src="mdv-comments.js"></script>
	<script>
		MdvComments.init();
		if (window.parent && window.parent !== window) {
			window.parent.postMessage({
				type: 'toolSelection',
				url: window.location.pathname.split('/').pop() + window.location.search
			}, '*');
		}
	</script>
	<script src="footer.js"></script>
