<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Markdown Explorer — Dylen Text Tools</title>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="icon" href="favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="vendor/tailwind.min.css">
	<script src="vendor/marked.min.js"></script>
	<link rel="stylesheet" href="vendor/katex/katex.min.css">
	<script src="vendor/katex/katex.min.js"></script>
	<script src="vendor/purify.min.js"></script>
	<link href="vendor/prism-tomorrow.min.css" rel="stylesheet" />
	<script src="vendor/prism.min.js"></script>
	<script src="vendor/prism-markdown.min.js"></script>
	<script src="vendor/prism-bash.min.js"></script>
	<script src="vendor/prism-javascript.min.js"></script>
	<script src="vendor/prism-python.min.js"></script>
	<script src="vendor/mermaid.min.js"></script>
	<link rel="stylesheet" href="mdv-comments.css">
	<link rel="stylesheet" href="theme.css">

	<style>
		:root {
			--reader-font-size: 1rem;
			--link-color: #58a6ff;
			--link-color-hover: #79c0ff;
		}

		@media (max-width: 640px) {
			:root {
				--reader-font-size: 0.875rem;
			}
		}

		@media (prefers-color-scheme: light) {
			:root {
				--link-color: #0969da;
				--link-color-hover: #0550ae;
			}
		}

		/* ── GitHub-style Markdown Body ── */
		.prose {
			max-width: none;
			color: var(--text-primary) !important;
			font-size: var(--reader-font-size);
			line-height: 1.5;
			word-wrap: break-word;
			font-kerning: normal;
		}

		.prose p,
		.prose ul,
		.prose ol,
		.prose dl,
		.prose table,
		.prose pre,
		.prose details {
			margin-top: 0;
			margin-bottom: 1rem;
		}

		.prose blockquote {
			margin-top: 0;
			margin-bottom: 1rem;
		}

		/* ── Headings ── */
		.prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
			font-weight: 500;
			line-height: 1.25;
			margin-top: 1.5rem;
			margin-bottom: 1rem;
		}

		.prose h1 {
			font-size: 2em;
			margin-top: 0;
			margin-bottom: 1rem;
			padding-bottom: 0.3em;
			border-bottom: 1px solid var(--border-default);
			color: var(--text-primary);
		}

		.prose h2 {
			font-size: 1.5em;
			padding-bottom: 0.3em;
			border-bottom: 1px solid var(--border-default);
			color: var(--text-primary);
		}

		.prose h3 {
			font-size: 1.25em;
			color: var(--text-primary);
		}

		.prose h4 {
			font-size: 1em;
			color: var(--text-primary);
		}

		.prose h5 {
			font-size: 0.875em;
			color: var(--text-primary);
		}

		.prose h6 {
			font-size: 0.85em;
			color: var(--text-secondary);
		}

		.prose h1 .anchor,
		.prose h2 .anchor,
		.prose h3 .anchor,
		.prose h4 .anchor,
		.prose h5 .anchor,
		.prose h6 .anchor {
			float: left;
			margin-left: -1.25rem;
			padding-right: 0.25rem;
			line-height: 1;
			opacity: 0;
			transition: opacity var(--transition-fast);
			text-decoration: none;
			color: var(--link-color);
		}

		.prose h1:hover .anchor,
		.prose h2:hover .anchor,
		.prose h3:hover .anchor,
		.prose h4:hover .anchor,
		.prose h5:hover .anchor,
		.prose h6:hover .anchor {
			opacity: 1;
		}

		.prose h1 .anchor svg,
		.prose h2 .anchor svg,
		.prose h3 .anchor svg,
		.prose h4 .anchor svg,
		.prose h5 .anchor svg,
		.prose h6 .anchor svg {
			display: inline-block;
			width: 1rem;
			height: 1rem;
			fill: currentColor;
		}

		/* ── Heading Folding ── */
		.heading-fold-toggle {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 1rem;
			height: 1rem;
			margin-right: 0.35rem;
			padding: 0;
			border: none;
			background: none;
			cursor: pointer;
			color: var(--text-tertiary);
			vertical-align: middle;
		}

		.heading-fold-toggle:hover {
			color: var(--text-primary);
		}

		.heading-fold-toggle svg {
			width: 14px;
			height: 14px;
			transition: transform var(--transition-fast);
		}

		.heading-folded .heading-fold-toggle svg {
			transform: rotate(-90deg);
		}

		/* ── Links ── */
		.prose a {
			color: var(--link-color);
			text-decoration: none;
		}

		.prose a:hover {
			text-decoration: underline;
		}

		/* ── Lists ── */
		.prose ul {
			list-style-type: disc;
			padding-left: 2em;
		}

		.prose ol {
			list-style-type: decimal;
			padding-left: 2em;
		}

		.prose ul ul,
		.prose ul ol,
		.prose ol ol,
		.prose ol ul {
			margin-top: 0;
			margin-bottom: 0;
		}

		.prose li {
			margin-top: 0;
			padding-left: 0;
			word-wrap: break-word;
		}

		.prose li+li {
			margin-top: 0.25em;
		}

		.prose li>p {
			margin-top: 1rem;
		}

		.prose li>p:first-child {
			margin-top: 0;
		}

		/* ── Task Lists ── */
		.prose .task-list-item {
			list-style-type: none;
		}

		.prose .task-list-item input[type="checkbox"] {
			margin: 0 .2em .25em -1.4em;
			vertical-align: middle;
		}

		.prose .contains-task-list {
			padding-left: 0;
		}

		/* ── Blockquotes ── */
		.prose blockquote {
			padding: 0 1em;
			color: var(--text-secondary);
			border-left: 0.25em solid var(--border-default);
		}

		.prose blockquote>:first-child {
			margin-top: 0;
		}

		.prose blockquote>:last-child {
			margin-bottom: 0;
		}

		/* ── Code ── */
		.prose :not(pre)>code,
		.prose tt {
			background-color: var(--code-inline-bg);
			padding: 0.2em 0.4em;
			border-radius: 6px;
			font-family: var(--font-mono);
			font-size: 0.85em;
			color: var(--code-inline-text);
			white-space: break-spaces;
		}

		.prose pre {
			background-color: var(--code-bg) !important;
			padding: 1rem !important;
			border-radius: 6px;
			overflow: auto;
			line-height: 1.45;
			font-size: 0.85em;
		}

		.prose pre code {
			background: transparent !important;
			padding: 0 !important;
			border-radius: 0 !important;
			font-size: 100% !important;
			line-height: inherit !important;
			color: var(--text-primary) !important;
			font-family: var(--font-mono) !important;
		}

		/* ── Tables ── */
		.prose table {
			display: block;
			width: max-content;
			max-width: 100%;
			overflow: auto;
			border-collapse: collapse;
			font-size: 0.9em;
			font-variant: tabular-nums;
			-webkit-overflow-scrolling: touch;
		}

		.prose th {
			background-color: var(--bg-surface-hover);
			text-align: left;
		}

		.prose th,
		.prose td {
			border: 1px solid var(--border-default);
			padding: 6px 13px;
		}

		.prose tr {
			background-color: var(--bg-surface);
			border-top: 1px solid var(--border-default);
		}

		.prose tr:nth-child(2n) {
			background-color: var(--bg-surface-hover);
		}

		.prose table img {
			background-color: transparent;
		}

		/* ── Horizontal Rules ── */
		.prose hr {
			height: 0.25em;
			padding: 0;
			margin: 1.5rem 0;
			background-color: var(--border-default);
			border: 0;
		}

		/* ── Images & Media ── */
		.prose img {
			max-width: 100%;
			box-sizing: content-box;
		}

		.prose video,
		.prose iframe {
			max-width: 100%;
			height: auto;
			border-radius: var(--radius-md);
		}

		/* ── Definition Lists ── */
		.prose dl {
			padding: 0;
		}

		.prose dt {
			font-size: 1em;
			font-style: italic;
			margin-top: 1rem;
			padding: 0;
		}

		.prose dd {
			padding: 0 1rem;
			margin-bottom: 1rem;
			margin-left: 0;
		}

		/* ── Keyboard tags ── */
		.prose kbd {
			display: inline-block;
			padding: 3px 5px;
			font: 11px var(--font-mono);
			line-height: 10px;
			color: var(--text-primary);
			vertical-align: middle;
			background-color: var(--bg-surface-raised);
			border: 1px solid var(--border-default);
			border-bottom-color: var(--border-strong);
			border-radius: 6px;
			box-shadow: inset 0 -1px 0 var(--border-default);
		}

		/* ── Footnotes ── */
		.prose .footnotes {
			font-size: 0.85em;
			color: var(--text-secondary);
			border-top: 1px solid var(--border-default);
			margin-top: 2rem;
			padding-top: 1rem;
		}

		.prose .footnotes ol {
			padding-left: 1rem;
		}

		.prose .footnotes li {
			margin-top: 0.25em;
		}

		.prose .footnotes li:target {
			background-color: var(--bg-surface-hover);
		}

		.prose a[data-footnote-ref] {
			font-size: 0.85em;
			vertical-align: super;
			line-height: 1;
		}

		/* ── GFM Alerts / Callouts ── */
		.prose .markdown-alert {
			padding: 0.5rem 1rem;
			margin-bottom: 1rem;
			border-left: 0.25em solid var(--border-default);
		}

		.prose .markdown-alert>:first-child {
			margin-top: 0;
		}

		.prose .markdown-alert>:last-child {
			margin-bottom: 0;
		}

		.prose .markdown-alert .markdown-alert-title {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			line-height: 1;
			margin-bottom: 0.25rem;
			margin-top: 0;
		}

		.prose .markdown-alert .markdown-alert-title svg {
			display: inline-block;
			width: 1rem;
			height: 1rem;
			fill: currentColor;
			flex-shrink: 0;
		}

		.prose .markdown-alert-note {
			border-left-color: var(--link-color);
		}
		.prose .markdown-alert-note .markdown-alert-title {
			color: var(--link-color);
		}
		.prose .markdown-alert-tip {
			border-left-color: var(--success);
		}
		.prose .markdown-alert-tip .markdown-alert-title {
			color: var(--success);
		}
		.prose .markdown-alert-important {
			border-left-color: #8250df;
		}
		.prose .markdown-alert-important .markdown-alert-title {
			color: #8250df;
		}
		.prose .markdown-alert-warning {
			border-left-color: var(--warning);
		}
		.prose .markdown-alert-warning .markdown-alert-title {
			color: var(--warning);
		}
		.prose .markdown-alert-caution {
			border-left-color: var(--danger);
		}
		.prose .markdown-alert-caution .markdown-alert-title {
			color: var(--danger);
		}

		/* ── KaTeX Math Styling ── */
		.katex-display {
			margin: 1.5em 0 !important;
			overflow-x: auto;
			overflow-y: hidden;
			padding: 0.5em 0;
		}

		.katex {
			font-size: 1.1em;
		}

		@media (prefers-color-scheme: light) {
			.prose tr {
				background-color: #ffffff;
			}

			.prose tr:nth-child(2n) {
				background-color: #f6f8fa;
			}

			.prose .footnotes li:target {
				background-color: #f6f8fa;
			}
		}

		.outline-item {
			color: var(--text-secondary);
		}
		.outline-item[data-level="1"] { padding-left: 0.75rem; }
		.outline-item[data-level="2"] { padding-left: 1.5rem; }
		.outline-item[data-level="3"] { padding-left: 2.25rem; }
		.outline-item[data-level="4"] { padding-left: 3rem; }
		.outline-item[data-level="5"] { padding-left: 3.75rem; }
		.outline-item[data-level="6"] { padding-left: 4.5rem; }

		.file-item.active {
			background-color: var(--accent) !important;
			color: white !important;
		}

		.mobile-sidebar-active #sidebar {
			display: flex !important;
			position: fixed;
			inset: 0;
			z-index: 60;
			width: 100%;
		}

		#editor-container {
			min-height: 0;
			display: flex;
			flex-direction: column;
			transition: all var(--transition-slow);
		}

		#editor-container.hidden {
			display: none !important;
		}

		#content {
			transition: all var(--transition-slow);
		}

		#editor {
			flex: 1;
			min-height: 0;
		}

		.cm-editor {
			height: 100% !important;
		}

		.cm-scroller {
			overflow: auto !important;
		}

		.no-scrollbar::-webkit-scrollbar {
			display: none;
		}

		.no-scrollbar {
			-ms-overflow-style: none;
			scrollbar-width: none;
		}

		.transition-all {
			transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
		}


		/* ─── TTS Reader Styles ─────────────────────────────── */

		.tts-block-wrapper {
			position: relative;
		}

		.tts-speak-btn {
			position: absolute;
			right: 8px;
			top: 50%;
			transform: translateY(-50%);
			width: 32px;
			height: 32px;
			border: none;
			background: none;
			color: var(--text-tertiary);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			border-radius: 50%;
			z-index: 1;
			transition: opacity var(--transition-fast), background var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
			-webkit-tap-highlight-color: transparent;
		}

		@media (hover: hover) {
			.tts-block-wrapper:hover .tts-speak-btn {
				opacity: 1;
				pointer-events: auto;
			}
		}

		@media (hover: none) {
			.tts-speak-btn {
				opacity: 0.3;
				pointer-events: auto;
			}

			.tts-speak-btn:active {
				opacity: 1;
				background: var(--accent);
				color: #fff;
			}
		}

		.tts-speak-btn svg {
			width: 18px;
			height: 18px;
		}

		.tts-speak-btn:hover {
			background: var(--bg-surface-raised);
			color: var(--accent);
			transform: translateY(-50%) scale(1.1);
		}

		.tts-active-block>*:first-child,
		.tts-active-block {
			border-left: 2px solid var(--accent) !important;
			background: var(--bg-surface-raised);
		}

		@media (max-width: 600px) {
			.tts-speak-btn {
				width: 36px;
				height: 36px;
				border-radius: 6px 0 0 6px;
			}

			.tts-speak-btn svg {
				width: 18px;
				height: 18px;
			}
		}

		/* Floating TTS Player Bar */
		#tts-player-bar {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			z-index: 100;
			background: var(--bg-surface);
			border-top: 1px solid var(--border-default);
			transform: translateY(100%);
			transition: transform var(--transition-slow);
			display: flex;
			align-items: center;
			gap: var(--space-3);
			padding: var(--space-2) var(--space-4);
			flex-wrap: wrap;
		}

		#tts-player-bar.visible {
			transform: translateY(0);
		}

		.tts-bar-status {
			flex: 1;
			min-width: 0;
			display: flex;
			flex-direction: column;
			gap: 2px;
		}

		.tts-bar-title {
			font-size: var(--font-size-xs);
			color: var(--text-tertiary);
			font-weight: 500;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.tts-bar-text {
			font-size: var(--font-size-sm);
			color: var(--text-primary);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.tts-bar-controls {
			display: flex;
			align-items: center;
			gap: var(--space-2);
			flex-shrink: 0;
		}

		.tts-bar-btn {
			width: 40px;
			height: 40px;
			border-radius: 50%;
			border: 1px solid var(--border-default);
			background: var(--bg-surface-raised);
			color: var(--text-primary);
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: all var(--transition-fast);
			flex-shrink: 0;
		}

		.tts-bar-btn svg {
			width: 18px;
			height: 18px;
		}

		.tts-bar-play-btn {
			width: 44px;
			height: 44px;
			background: var(--accent);
			border-color: var(--accent);
			color: #ffffff;
		}

		.tts-bar-btn svg {
			width: 15px;
			height: 15px;
		}

		.tts-bar-btn:hover:not(:disabled) {
			border-color: var(--accent);
			color: var(--accent-text);
		}

		.tts-bar-btn:disabled {
			color: var(--text-disabled);
			border-color: var(--border-subtle);
			cursor: not-allowed;
		}

		.tts-bar-play-btn {
			width: 40px;
			height: 40px;
			background: var(--accent);
			border-color: var(--accent);
			color: #ffffff;
		}

		.tts-bar-play-btn:hover:not(:disabled) {
			background: var(--accent-hover);
			border-color: var(--accent-hover);
			color: #ffffff;
		}

		.tts-bar-close-btn {
			border: none;
			background: transparent;
			color: var(--text-tertiary);
		}

		.tts-bar-close-btn:hover:not(:disabled) {
			color: var(--danger);
			border-color: transparent;
		}

		.tts-bar-select {
			background: var(--bg-surface-raised);
			border: 1px solid var(--border-default);
			border-radius: var(--radius-md);
			padding: 8px 10px;
			color: var(--text-primary);
			font-family: var(--font-sans);
			font-size: var(--font-size-sm);
			outline: none;
			cursor: pointer;
			transition: border-color var(--transition-fast);
		}

		.tts-bar-select:focus {
			border-color: var(--accent);
		}

		.tts-bar-progress {
			width: 100%;
			height: 3px;
			background: var(--border-default);
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
		}

		.tts-bar-progress-fill {
			height: 100%;
			background: var(--accent);
			width: 0%;
			transition: width var(--transition-base);
		}

		.tts-loading-indicator {
			width: 16px;
			height: 16px;
			border: 2px solid var(--border-default);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: tts-spin 0.7s linear infinite;
			flexshrink: 0;
			display: none;
		}

		.tts-loading-indicator.active {
			display: block;
		}

		@keyframes tts-spin {
			to {
				transform: rotate(360deg);
			}
		}

		.tts-toggle-btn {
			position: relative;
		}

		.tts-toggle-dot {
			position: absolute;
			top: -2px;
			right: -2px;
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: var(--accent);
			display: none;
		}

		.tts-toggle-dot.visible {
			display: block;
		}

		@media (max-width: 600px) {
			#tts-player-bar {
				padding: var(--space-2) var(--space-2);
				gap: var(--space-2);
			}

			.tts-bar-controls {
				gap: var(--space-1);
			}

			.tts-bar-btn {
				width: 36px;
				height: 36px;
			}

			.tts-bar-play-btn {
				width: 40px;
				height: 40px;
			}

			.tts-bar-btn svg {
				width: 16px;
				height: 16px;
			}

			.tts-bar-select {
				padding: 6px 8px;
				font-size: var(--font-size-xs);
			}

			.tts-bar-text {
				font-size: var(--font-size-xs);
			}
		}

		/* ── Iframe Embed Mode ──────────────────────────────── */
		body.iframe-mode .app-header-row {
			display: none !important;
		}

		body.iframe-mode #documents-panel {
			display: none !important;
		}

		body.iframe-mode #app-footer {
			display: none !important;
		}

		/* Sidebar in iframe mode: always visible, animated collapse */
		body.iframe-mode #sidebar {
			display: flex !important;
			transition: width var(--transition-slow), min-width var(--transition-slow);
		}

		body.iframe-mode #sidebar.iframe-sidebar-collapsed {
			display: flex !important;
			width: 0 !important;
			min-width: 0 !important;
			overflow: hidden;
		}

		/* ── Runnable HTML Code Sandbox styles ── */
		.runnable-code-container {
			position: relative;
			margin-top: 1rem;
			margin-bottom: 1rem;
			border: 1px solid var(--border-default);
			border-radius: var(--radius-md);
			background: var(--code-bg);
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}
		.btn-run-code {
			position: absolute;
			top: 8px;
			right: 8px;
			z-index: 10;
			background: var(--bg-surface-raised);
			border: 1px solid var(--border-default);
			color: var(--text-secondary);
			border-radius: var(--radius-sm);
			padding: 4px 8px;
			font-size: var(--font-size-xs);
			font-family: var(--font-sans);
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 4px;
			transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
		}
		.btn-run-code:hover {
			background: var(--accent);
			color: rgb(255, 255, 255);
			border-color: var(--accent);
		}
		.runnable-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: var(--bg-surface-raised);
			border-bottom: 1px solid var(--border-default);
			padding: 0 var(--space-2);
			height: 36px;
			flex-shrink: 0;
		}
		.runnable-tabs {
			display: flex;
			gap: var(--space-1);
			height: 100%;
			align-items: flex-end;
		}
		.runnable-tab {
			background: transparent;
			border: none;
			border-bottom: 2px solid transparent;
			color: var(--text-secondary);
			font-family: var(--font-sans);
			font-size: var(--font-size-xs);
			font-weight: 500;
			padding: var(--space-2) var(--space-3);
			cursor: pointer;
			transition: color var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
			height: 100%;
		}
		.runnable-tab:hover {
			color: var(--text-primary);
			background: var(--bg-surface-hover);
		}
		.runnable-tab.active {
			color: var(--text-primary);
			border-bottom-color: var(--accent);
			background: var(--bg-surface);
		}
		.runnable-close-btn {
			background: transparent;
			border: none;
			color: var(--text-secondary);
			border-radius: var(--radius-sm);
			padding: 4px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center; 
			transition: background var(--transition-fast), color var(--transition-fast);
		}
		.runnable-close-btn:hover {
			background: var(--bg-surface-hover);
			color: var(--danger);
		}
		.runnable-panels-viewport {
			overflow: hidden;
			width: 100%;
			height: 600px;
			background: var(--code-bg);
		}
		.runnable-panels-wrapper {
			display: flex;
			width: 300%;
			height: 100%;
			transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
		}
		.runnable-panel {
			width: 33.3333%;
			height: 100%;
			flex-shrink: 0;
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}
		.runnable-panel.panel-source {
			overflow: auto;
		}
		.runnable-panel.panel-source pre {
			margin: 0 !important;
			border-radius: 0 !important;
			height: 100%;
			background: transparent !important;
		}
		.runnable-panel.panel-editor {
			background: var(--bg-surface);
		}
		.runnable-editor-el {
			flex: 1;
			min-height: 0;
			height: 100%;
		}
		.runnable-panel.panel-iframe {
			background: rgb(255, 255, 255);
		}
		.runnable-iframe-el {
			width: 100%;
			height: 100%;
			border: none;
			background: rgb(255, 255, 255);
		}

		/* ── Markdown Fence Preview/Editor widget ── */
		.md-fence-toolbar {
			position: absolute;
			top: 8px;
			right: 8px;
			z-index: 10;
			display: flex;
			gap: 4px;
		}
		.md-fence-toolbar .btn-run-code,
		.runnable-header .btn-run-code {
			position: static;
		}
		.runnable-panel.panel-preview {
			overflow: auto;
			background: var(--bg-surface);
		}
		.markdown-preview-content {
			padding: 1rem;
		}

		/* ── Mermaid Diagrams ─────────────────────────────── */
		.mermaid-wrapper {
			position: relative;
			cursor: zoom-in;
			display: block;
			width: 100%;
			text-align: left;
			background: transparent;
			border: none;
			padding: 0;
			margin-top: 1rem;
			margin-bottom: 1rem;
		}

		.mermaid {
			display: flex;
			justify-content: center;
			overflow-x: auto;
		}

		.mermaid-error {
			padding: 0.75rem 1rem;
			margin-bottom: 0.75rem;
			border: 1px solid var(--danger);
			border-radius: var(--radius-md);
			background-color: var(--bg-surface-raised);
			color: var(--danger);
			font-size: var(--font-size-sm);
		}

		/* ── Mermaid Modal Styling ── */
		#mermaid-modal {
			padding: 0;
			border: 1px solid var(--border-strong);
			background-color: var(--bg-surface);
			color: var(--text-primary);
			border-radius: var(--radius-lg);
			box-shadow: var(--shadow-xl);
			overflow: hidden;
			width: 95vw;
			height: 90vh;
			max-width: 1000px;
		}

		#mermaid-modal::backdrop {
			background-color: rgb(10, 10, 11);
		}

		.mermaid-modal-container {
			display: flex;
			flex-direction: column;
			height: 100%;
		}

		.mermaid-modal-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: var(--space-3) var(--space-4);
			border-bottom: 1px solid var(--border-default);
			background-color: var(--bg-surface-raised);
		}

		.mermaid-modal-title {
			font-weight: 500;
			font-size: var(--font-size-base);
			color: var(--text-primary);
			margin: 0;
		}

		.mermaid-modal-actions {
			display: flex;
			align-items: center;
			gap: var(--space-2);
		}

		.mermaid-modal-reset-btn {
			padding: 4px 10px;
			border: 1px solid var(--border-default);
			background-color: var(--bg-surface);
			color: var(--text-secondary);
			font-size: var(--font-size-xs);
			border-radius: var(--radius-sm);
			cursor: pointer;
			transition: background var(--transition-fast), color var(--transition-fast);
		}

		.mermaid-modal-reset-btn:hover {
			background-color: var(--bg-surface-hover);
			color: var(--text-primary);
		}

		.mermaid-modal-close-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 28px;
			height: 28px;
			border: none;
			background: transparent;
			color: var(--text-tertiary);
			border-radius: var(--radius-sm);
			cursor: pointer;
			transition: background var(--transition-fast), color var(--transition-fast);
		}

		.mermaid-modal-close-btn:hover {
			background-color: var(--bg-surface-hover);
			color: var(--text-primary);
		}

		.mermaid-modal-close-btn svg {
			width: 18px;
			height: 18px;
		}

		.mermaid-modal-viewport {
			flex: 1;
			position: relative;
			overflow: hidden;
			background-color: var(--bg-root);
			touch-action: none;
			cursor: grab;
			user-select: none;
		}

		.mermaid-modal-viewport:active {
			cursor: grabbing;
		}

		.mermaid-modal-svg-container {
			position: absolute;
			transform-origin: 0 0;
			user-select: none;
		}

		.mermaid-modal-svg-container svg {
			display: block;
			width: 100% !important;
			height: 100% !important;
			max-width: none !important;
			max-height: none !important;
		}



		.mermaid-zoom-hint {
			position: absolute;
			right: var(--space-2);
			bottom: var(--space-2);
			display: flex;
			align-items: center;
			gap: 4px;
			background-color: var(--bg-surface-raised);
			border: 1px solid var(--border-default);
			border-radius: var(--radius-sm);
			padding: 2px 6px;
			font-size: var(--font-size-xs);
			color: var(--text-secondary);
			pointer-events: none;
			user-select: none;
		}
		.mdv-logo-badge {
			background: linear-gradient(to bottom right, rgb(37, 99, 235), rgb(67, 56, 202));
		}

		/* ── Image Container with Delete Overlay & URL Bar ── */
		.mdv-image-container {
			position: relative;
			display: inline-block;
			max-width: 100%;
			margin: 0.75rem 0;
			border: 1px solid var(--border-default);
			border-radius: var(--radius-md);
			background-color: var(--bg-surface);
			overflow: hidden;
			vertical-align: middle;
			transition: border-color 0.2s;
		}

		.mdv-image-container img {
			display: block;
			max-width: 100%;
			height: auto;
			margin: 0 auto;
		}

		.mdv-image-highlight {
			border-color: var(--link-color) !important;
			box-shadow: 0 0 0 3px var(--link-color);
			animation: mdv-image-pulse 2s ease-out;
		}

		@keyframes mdv-image-pulse {
			0% {
				box-shadow: 0 0 0 4px var(--link-color);
			}
			70% {
				box-shadow: 0 0 0 3px var(--link-color);
			}
			100% {
				box-shadow: none;
			}
		}

		.mdv-image-delete-btn {
			position: absolute;
			top: 8px;
			right: 8px;
			z-index: 10;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 28px;
			height: 28px;
			padding: 0;
			border-radius: var(--radius-md);
			border: 1px solid var(--border-default);
			background-color: var(--bg-surface-raised);
			color: var(--text-secondary);
			cursor: pointer;
			transition: background-color 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
		}

		.mdv-image-delete-btn:hover {
			background-color: var(--danger);
			color: #ffffff;
			border-color: var(--danger);
			transform: scale(1.05);
		}

		.mdv-image-delete-btn:active {
			transform: scale(0.95);
		}

		.mdv-image-url-bar {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 4px 10px;
			background-color: var(--bg-surface-hover);
			border-top: 1px solid var(--border-default);
			font-size: 11px;
			font-family: var(--font-mono);
			color: var(--text-secondary);
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			max-width: 100%;
		}

		.mdv-image-url-icon {
			flex-shrink: 0;
			color: var(--text-tertiary);
		}

		.mdv-image-url-link {
			color: var(--link-color);
			text-decoration: none;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			flex: 1;
		}

		.mdv-image-url-link:hover {
			text-decoration: underline;
			color: var(--link-color-hover);
		}

		/* ── Sidebar Pictures Panel Thumbnail Grid ── */
		.sidebar-image-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 8px;
			padding: 8px;
			overflow-y: auto;
			max-height: 100%;
			box-sizing: border-box;
			width: 100%;
		}

		.sidebar-empty-state {
			grid-column: 1 / -1;
			color: var(--text-tertiary);
			font-size: 12px;
			font-style: italic;
			padding: 2rem 1rem;
			text-align: center;
		}

		.sidebar-image-card {
			position: relative;
			display: flex;
			flex-direction: column;
			background-color: var(--bg-surface-raised);
			border: 1px solid var(--border-default);
			border-radius: var(--radius-md);
			overflow: hidden;
			cursor: pointer;
			transition: border-color 0.15s, transform 0.1s;
			user-select: none;
			min-width: 0;
		}

		.sidebar-image-card:hover {
			border-color: var(--link-color);
			transform: translateY(-1px);
		}

		.sidebar-image-card:active {
			transform: translateY(0);
		}

		.sidebar-image-card.active {
			border-color: var(--link-color);
			box-shadow: 0 0 0 2px var(--link-color);
		}

		.sidebar-image-card-thumb {
			position: relative;
			width: 100%;
			height: 80px;
			background-color: var(--bg-surface);
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}

		.sidebar-image-card-thumb img {
			width: 100% !important;
			height: 100% !important;
			max-width: 100% !important;
			max-height: 80px !important;
			object-fit: cover !important;
			display: block;
		}

		.sidebar-image-card-badge {
			position: absolute;
			bottom: 4px;
			left: 4px;
			background-color: var(--bg-surface);
			color: var(--text-secondary);
			border: 1px solid var(--border-default);
			font-size: 10px;
			font-family: var(--font-mono);
			padding: 1px 4px;
			border-radius: var(--radius-sm);
			line-height: 1.2;
		}

		.sidebar-image-card-delete {
			position: absolute;
			top: 4px;
			right: 4px;
			z-index: 5;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 22px;
			height: 22px;
			padding: 0;
			border-radius: var(--radius-sm);
			border: 1px solid var(--border-default);
			background-color: var(--bg-surface);
			color: var(--text-secondary);
			cursor: pointer;
			transition: background-color 0.15s, color 0.15s, border-color 0.15s;
		}

		.sidebar-image-card-delete:hover {
			background-color: var(--danger);
			color: #ffffff;
			border-color: var(--danger);
		}

		.sidebar-image-card-meta {
			padding: 4px 6px;
			background-color: var(--bg-surface-raised);
			border-top: 1px solid var(--border-default);
			display: flex;
			flex-direction: column;
			gap: 2px;
			min-width: 0;
		}

		.sidebar-image-card-title {
			font-size: 11px;
			font-weight: 500;
			color: var(--text-primary);
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			line-height: 1.3;
		}

		.sidebar-image-card-sub {
			font-size: 9px;
			font-family: var(--font-mono);
			color: var(--text-tertiary);
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			line-height: 1.2;
		}
	</style>
</head>

<body class="h-screen flex flex-col overflow-hidden transition-colors duration-200">
	<header class="app-header z-50 shrink-0">

						<i class="ph ph-caret-down text-xs"></i>
					</button>
					<div id="open-dropdown-menu" class="save-dropdown-menu open-dropdown-menu">

						<i class="ph ph-floppy-disk text-base"></i>

						</button>

						<button class="save-dropdown-item" onclick="copyMarkdownWithComments()">

						</button>

		<!-- Sub-Toolbar (Row 2): Pinned Left & Right, Middle Scroll -->
		<div class="app-header-toolbar">
			<!-- Pinned Left Edge: Sidebar Toggle -->
			<div class="toolbar-pinned-left">
				<button id="sidebar-toggle-btn" class="btn-icon sidebar-toggle-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
					<i class="ph ph-sidebar-simple text-base"></i>
				</button>
			</div>

			<!-- Middle Scroll Track: Tool Buttons -->
			<div class="toolbar-middle-scroll">
				<div class="flex items-center border border-[var(--border-default)] rounded-md overflow-hidden bg-[var(--bg-surface-raised)] shrink-0 h-[32px]">
					<button onclick="changeZoom(-0.1)"
						class="w-7 h-full hover:bg-[var(--bg-surface-hover)] border-r border-[var(--border-default)] transition-colors flex items-center justify-center" title="Zoom Out" aria-label="Zoom Out">
						<i class="ph ph-magnifying-glass-minus text-xs"></i>

						<i class="ph ph-magnifying-glass-plus text-xs"></i>

	<script>
		const { EditorView, basicSetup, markdown, oneDark } = window.CM_MD;

		const openBtn = document.getElementById("open-btn");
		const pasteBtn = document.getElementById("paste-btn");
		const fileInput = document.getElementById("file-input");
		const fileListContainer = document.getElementById("file-list");
		const contentArea = document.getElementById("content");
		const editorContainer = document.getElementById("editor-container");
		const editorEl = document.getElementById("editor");
		const emptyState = document.getElementById("empty-state");
		const sidebar = document.getElementById("sidebar");
		const zoomLabel = document.getElementById("zoom-level");
		const editControls = document.getElementById("edit-controls");
		const toggleEditBtn = document.getElementById("toggle-edit-btn");
		const toggleText = document.getElementById("toggle-text");
		let loadedFiles = new Map();
		let currentZoom = 1.0;
		var isEditing = true;
		var currentFileName = "Untitled.md";
		var editor = null;
		let lineWrap = true;
		let currentFileHandle = null;
		let _isEditingWidgetCode = false;

		function updateMarkdownCodeBlock(blockIndex, newCode) {
			if (!editor) return;
			const text = editor.state.doc.toString();
			let currentIndex = 0;
			// Match code fences: ```html or ```xml
			const regex = /(^|\n)([`~]{3,})(html|xml)\s*\n([\s\S]*?)\n\2(?=\n|$)/g;
			let match;
			let found = false;

			while ((match = regex.exec(text)) !== null) {
				if (currentIndex === blockIndex) {
					const matchStart = match.index;
					const matchEnd = regex.lastIndex;
					// Reconstruct code block with the same delimiter and type
					const newBlock = match[1] + match[2] + match[3] + "\n" + newCode + "\n" + match[2];
					const replacedText = text.substring(0, matchStart) + newBlock + text.substring(matchEnd);
					
					_isEditingWidgetCode = true;
					const transaction = editor.state.update({
						changes: { from: 0, to: text.length, insert: replacedText }
					});
					editor.dispatch(transaction);
					_isEditingWidgetCode = false;
					found = true;
					break;
				}
				currentIndex++;
			}
		}

		function updateMarkdownFenceBlock(blockIndex, newCode) {
			if (!editor) return;
			const text = editor.state.doc.toString();
			let currentIndex = 0;
			// Match code fences: ```markdown, ```md, or bare ``` fences with no
			// language info-string at all (case-insensitive).
			const regex = /(^|\n)([`~]{3,})(markdown|md)?[ \t]*\n([\s\S]*?)\n\2(?=\n|$)/gi;
			let match;

			while ((match = regex.exec(text)) !== null) {
				if (currentIndex === blockIndex) {
					const matchStart = match.index;
					const matchEnd = regex.lastIndex;
					// Reconstruct code block with the same delimiter and type
					const newBlock = match[1] + match[2] + match[3] + "\n" + newCode + "\n" + match[2];
					const replacedText = text.substring(0, matchStart) + newBlock + text.substring(matchEnd);

					_isEditingWidgetCode = true;
					const transaction = editor.state.update({
						changes: { from: 0, to: text.length, insert: replacedText }
					});
					editor.dispatch(transaction);
					_isEditingWidgetCode = false;
					break;
				}
				currentIndex++;
			}
		}

		function convertToRunnable(container, preEl, blockIndex) {
			const codeEl = preEl.querySelector('code');
			const initialCode = codeEl ? codeEl.textContent : "";

			// Remove the floating button
			const runBtn = container.querySelector('.btn-run-code');
			if (runBtn) runBtn.remove();

			// Create the Tab header and panels viewport
			const header = document.createElement('div');
			header.className = 'runnable-header';
			header.innerHTML = `
				<div class="runnable-tabs">
					<button class="runnable-tab active" data-tab="0">Source</button>
					<button class="runnable-tab" data-tab="1">Editor</button>
					<button class="runnable-tab" data-tab="2">Preview</button>
				</div>
				<button class="runnable-close-btn" title="Revert to static code">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
					</svg>
				</button>
			`;

			const viewport = document.createElement('div');
			viewport.className = 'runnable-panels-viewport';
			viewport.innerHTML = `
				<div class="runnable-panels-wrapper">
					<div class="runnable-panel panel-source"></div>
					<div class="runnable-panel panel-editor">
						<div class="runnable-editor-el"></div>
					</div>
					<div class="runnable-panel panel-iframe">
						<iframe class="runnable-iframe-el" sandbox="allow-scripts"></iframe>
					</div>
				</div>
			`;

			container.appendChild(header);
			container.appendChild(viewport);

			const panelsWrapper = viewport.querySelector('.runnable-panels-wrapper');
			const panelSource = viewport.querySelector('.panel-source');
			const panelEditorEl = viewport.querySelector('.runnable-editor-el');
			const iframeEl = viewport.querySelector('.runnable-iframe-el');

			// Move the original preEl into panelSource
			panelSource.appendChild(preEl);

			// Initialize iframe content
			iframeEl.srcdoc = initialCode;

			// Set up tabs switching
			const tabs = header.querySelectorAll('.runnable-tab');
			tabs.forEach(tab => {
				tab.onclick = () => {
					tabs.forEach(t => t.classList.remove('active'));
					tab.classList.add('active');
					const tabIdx = parseInt(tab.getAttribute('data-tab'), 10);
					panelsWrapper.style.transform = `translateX(-${(tabIdx * 100) / 3}%)`;
				};
			});

			let innerEditor = null;

			// Set up close button to revert
			const closeBtn = header.querySelector('.runnable-close-btn');
			closeBtn.onclick = () => {
				// Revert container back to simple preEl
				container.innerHTML = "";
				container.appendChild(preEl);

				// Re-add floating run button
				const newRunBtn = document.createElement('button');
				newRunBtn.className = 'btn-run-code';
				newRunBtn.innerHTML = `
					<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
						<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
					</svg>
					<span>Run</span>
				`;
				container.appendChild(newRunBtn);
				newRunBtn.onclick = () => {
					convertToRunnable(container, preEl, blockIndex);
				};

				// Destroy CodeMirror instance if exists
				if (innerEditor) {
					innerEditor.destroy();
				}
			};

			// Initialize CodeMirror inside Panel 2 (Editor)
			const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
			innerEditor = new EditorView({
				doc: initialCode,
				extensions: [
					basicSetup,
					markdown(),
					isDark ? oneDark : [],
					EditorView.theme({
						"&": { height: "100%", fontSize: "var(--editor-font-size)", backgroundColor: "var(--bg-surface)" },
						".cm-scroller": { overflow: "auto", fontFamily: "var(--font-mono)" },
						".cm-content": { fontWeight: "400 !important", fontFamily: "var(--font-mono) !important" },
						".cm-line": { fontWeight: "400 !important" },
						".cm-gutters": { backgroundColor: "var(--bg-surface)", borderRightColor: "var(--border-subtle)", color: "var(--text-tertiary)" }
					}),
					EditorView.lineWrapping,
					EditorView.updateListener.of((update) => {
						if (update.docChanged) {
							const newCode = update.state.doc.toString();

							// 1. Update running iframe
							iframeEl.srcdoc = newCode;

							// 2. Update Tab 1 code and re-prism highlight
							if (codeEl) {
								codeEl.textContent = newCode;
								Prism.highlightElement(codeEl);
							}

							// 3. Update main editor document
							updateMarkdownCodeBlock(blockIndex, newCode);
						}
					})
				],
				parent: panelEditorEl
			});
		}

		function buildMdFenceToolbar(container, preEl, codeEl, blockIndex) {
			const toolbar = document.createElement('div');
			toolbar.className = 'md-fence-toolbar';
			toolbar.innerHTML = `
				<button class="btn-run-code" data-action="preview" title="Render as Markdown">
					<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
					</svg>
					<span>Preview</span>
				</button>
				<button class="btn-run-code" data-action="editor" title="Edit Markdown">
					<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
					</svg>
					<span>Editor</span>
				</button>
				<button class="btn-run-code" data-action="copy" title="Copy Markdown">
					<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
					</svg>
					<span>Copy</span>
				</button>
			`;
			container.appendChild(toolbar);

			toolbar.querySelector('[data-action="copy"]').onclick = () => {
				const text = codeEl.textContent;
				if (navigator.clipboard && window.isSecureContext) {
					navigator.clipboard.writeText(text).then(() => {
						if (window.MdvComments && typeof MdvComments.toast === "function") MdvComments.toast('Markdown copied');
					}).catch(() => { fallbackCopy(text); if (window.MdvComments && typeof MdvComments.toast === "function") MdvComments.toast('Markdown copied'); });
				} else {
					fallbackCopy(text);
					if (window.MdvComments && typeof MdvComments.toast === "function") MdvComments.toast('Markdown copied');
				}
			};
			toolbar.querySelector('[data-action="preview"]').onclick = () => {
				convertMarkdownToRunnable(container, preEl, blockIndex, 'preview');
			};
			toolbar.querySelector('[data-action="editor"]').onclick = () => {
				convertMarkdownToRunnable(container, preEl, blockIndex, 'editor');
			};

			return toolbar;
		}

		function convertMarkdownToRunnable(container, preEl, blockIndex, initialPanel) {
			const codeEl = preEl.querySelector('code');
			const initialCode = codeEl ? codeEl.textContent : "";

			// Remove the collapsed toolbar
			const toolbar = container.querySelector('.md-fence-toolbar');
			if (toolbar) toolbar.remove();

			// Create the tab header and panels viewport
			const header = document.createElement('div');
			header.className = 'runnable-header';
			header.innerHTML = `
				<div class="runnable-tabs">
					<button class="runnable-tab" data-tab="0">Editor</button>
					<button class="runnable-tab" data-tab="1">Preview</button>
					<button class="runnable-tab" data-tab="2">View</button>
				</div>
				<button class="btn-run-code" data-action="copy" title="Copy Markdown">
					<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
					</svg>
				</button>
				<button class="runnable-close-btn" title="Revert to static code">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
					</svg>
				</button>
			`;

			const viewport = document.createElement('div');
			viewport.className = 'runnable-panels-viewport';
			viewport.innerHTML = `
				<div class="runnable-panels-wrapper" style="width: 300%;">
					<div class="runnable-panel panel-editor" style="width: 33.3333%;">
						<div class="runnable-editor-el"></div>

				syncPostMessage({

					format: 'markdown',
					version: syncVersion,
					selection: p.selection

			}
		}

				syncPendingChange = null;
				syncDebounceTimer = null;

				const container = document.createElement('div');
				container.className = 'mdv-image-container';

				img.parentNode.insertBefore(container, img);
				container.appendChild(img);

				// Delete button overlay in top-right corner
				const delBtn = document.createElement('button');
				delBtn.type = 'button';
				delBtn.className = 'mdv-image-delete-btn';
				delBtn.title = 'Delete image from document';
				delBtn.setAttribute('aria-label', 'Delete image');
				delBtn.innerHTML = '<svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>';
				delBtn.onclick = (e) => {
					e.preventDefault();
					e.stopPropagation();
					deleteImageFromDoc(src, alt, imgIndex);
				};
				container.appendChild(delBtn);

				// If remote URL, render URL caption below the image
				if (isRemoteUrl) {
					const urlBar = document.createElement('div');
					urlBar.className = 'mdv-image-url-bar';
					urlBar.innerHTML = `
						<svg class="mdv-image-url-icon" viewBox="0 0 16 16" width="11" height="11" fill="currentColor"><path d="M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 .75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25zm-.55 9.45a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 1 1-2.83-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25z"/></svg>
						<a href="${escapeHtml(src)}" target="_blank" rel="noopener noreferrer" class="mdv-image-url-link" title="${escapeHtml(src)}">${escapeHtml(src)}</a>
					`;
					container.appendChild(urlBar);
				}
			});
		}

		function getMermaidTheme() {
			return window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'default';
		}

		function initMermaid() {
			if (typeof mermaid === 'undefined') {
				console.warn('[mermaid] library not loaded');
				return;
			}
			mermaid.initialize({
				startOnLoad: false,
				theme: getMermaidTheme(),
				securityLevel: 'strict'
			});
			window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
				mermaid.initialize({ theme: getMermaidTheme() });
				updatePreview();
				if (editor) {
					initEditor(editor.state.doc.toString());
				}
			});
		}

		async function renderMermaidDiagrams() {
			if (typeof mermaid === 'undefined') return;
			const codeBlocks = contentArea.querySelectorAll('pre code.language-mermaid');
			if (codeBlocks.length === 0) return;

			const items = [];
			codeBlocks.forEach((codeEl, index) => {
				const preEl = codeEl.parentElement;
				if (!preEl || preEl.tagName !== 'PRE') return;

				const source = codeEl.textContent;
				const wrapper = document.createElement('button');
				wrapper.type = 'button';
				wrapper.className = 'mermaid-wrapper';

				const diagramDiv = document.createElement('div');
				diagramDiv.className = 'mermaid';
				diagramDiv.id = 'mermaid-' + Date.now() + '-' + index;
				diagramDiv.textContent = source;

				const zoomHint = document.createElement('div');
				zoomHint.className = 'mermaid-zoom-hint';
				zoomHint.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path></svg><span>Click to zoom</span>`;

				wrapper.appendChild(diagramDiv);
				wrapper.appendChild(zoomHint);
				preEl.parentNode.insertBefore(wrapper, preEl);

				wrapper.addEventListener('click', () => {
					if (diagramDiv.querySelector('svg')) {
						openMermaidModal(diagramDiv);
					}
				});

				items.push({ preEl, diagramDiv, source });
			});

			// Remove original code blocks
			items.forEach(({ preEl }) => {
				if (preEl.parentNode) preEl.parentNode.removeChild(preEl);
			});

			try {
				await mermaid.run({ querySelector: '.mermaid', suppressErrors: true });
			} catch (err) {
				console.error('[mermaid] run failed:', err);
			}

			// Fallback for any block that didn't produce an SVG
			items.forEach(({ diagramDiv, source }) => {
				if (!diagramDiv.querySelector('svg')) {
					diagramDiv.innerHTML = '';
					const errorBox = document.createElement('div');
					errorBox.className = 'mermaid-error';
					errorBox.textContent = 'Mermaid diagram failed to render.';
					const pre = document.createElement('pre');
					const code = document.createElement('code');
					code.className = 'language-mermaid';
					code.textContent = source;
					pre.appendChild(code);
					diagramDiv.appendChild(errorBox);
					diagramDiv.appendChild(pre);
					Prism.highlightElement(code);

					// Disable zoom on failure
					const wrapper = diagramDiv.parentElement;
					if (wrapper && wrapper.classList.contains('mermaid-wrapper')) {
						wrapper.classList.add('no-zoom');
						const hint = wrapper.querySelector('.mermaid-zoom-hint');
						if (hint) hint.remove();
					}
				}
			});
		}

		function openMermaidModal(diagramDiv) {
			const modal = document.getElementById('mermaid-modal');
			const svgContainer = document.getElementById('mermaid-modal-svg-container');
			const viewport = document.getElementById('mermaid-modal-viewport');
			if (!modal || !svgContainer || !viewport) return;

			const svg = diagramDiv.querySelector('svg');
			if (!svg) return;

			// Clear previous content
			svgContainer.innerHTML = '';

			const clonedSvg = svg.cloneNode(true);
			// Remove explicit width/height constraints on the SVG itself so it fits the container
			clonedSvg.removeAttribute('width');
			clonedSvg.removeAttribute('style');
			svgContainer.appendChild(clonedSvg);

			// Calculate natural size from viewBox
			const viewBox = clonedSvg.getAttribute('viewBox');
			let naturalWidth = 800;
			let naturalHeight = 600;
			if (viewBox) {
				const parts = viewBox.split(/\s+/);
				if (parts.length === 4) {
					naturalWidth = parseFloat(parts[2]) || 800;
					naturalHeight = parseFloat(parts[3]) || 600;
				}
			}

			svgContainer.style.width = naturalWidth + 'px';
			svgContainer.style.height = naturalHeight + 'px';

			// State for zoom/pan
			let scale = 1;
			let translateX = 0;
			let translateY = 0;
			let isDragging = false;
			let startX = 0;
			let startY = 0;

			function applyTransform() {
				svgContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
			}

			function resetZoom() {
				const viewportRect = viewport.getBoundingClientRect();
				const scaleX = viewportRect.width / naturalWidth;
				const scaleY = viewportRect.height / naturalHeight;
				// Fit with some padding
				scale = Math.min(scaleX, scaleY, 1.5) * 0.9;
				translateX = (viewportRect.width - naturalWidth * scale) / 2;
				translateY = (viewportRect.height - naturalHeight * scale) / 2;
				applyTransform();
			}

			// Show modal
			modal.showModal();

			// Wait a tick for layout to stabilize, then reset zoom
			setTimeout(resetZoom, 50);

			// Add event listeners specific to this session
			const resetBtn = document.getElementById('mermaid-modal-reset');
			const closeBtn = document.getElementById('mermaid-modal-close');

			const onReset = () => resetZoom();
			const onClose = () => modal.close();

			resetBtn.addEventListener('click', onReset);
			closeBtn.addEventListener('click', onClose);

			// Wheel zooming
			const onWheel = (e) => {
				e.preventDefault();
				const zoomFactor = 1.1;
				const nextScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
				const boundedScale = Math.max(0.1, Math.min(10, nextScale));

				const rect = viewport.getBoundingClientRect();
				const mouseX = e.clientX - rect.left;
				const mouseY = e.clientY - rect.top;

				const factor = boundedScale / scale;
				translateX = mouseX - (mouseX - translateX) * factor;
				translateY = mouseY - (mouseY - translateY) * factor;
				scale = boundedScale;

				applyTransform();
			};
			viewport.addEventListener('wheel', onWheel, { passive: false });

			// Pointer panning/pinching
			let activePointers = [];
			let initialPinchDistance = 0;
			let initialPinchScale = 1;

			const onPointerDown = (e) => {
				viewport.setPointerCapture(e.pointerId);
				activePointers.push(e);

				if (activePointers.length === 1) {
					isDragging = true;
					startX = e.clientX - translateX;
					startY = e.clientY - translateY;
				} else if (activePointers.length === 2) {
					isDragging = false;
					initialPinchDistance = getDistance(activePointers[0], activePointers[1]);
					initialPinchScale = scale;
				}
			};

			const onPointerMove = (e) => {
				const index = activePointers.findIndex(p => p.pointerId === e.pointerId);
				if (index === -1) return;
				activePointers[index] = e;

				if (isDragging && activePointers.length === 1) {
					translateX = e.clientX - startX;
					translateY = e.clientY - startY;
					applyTransform();
				} else if (activePointers.length === 2) {
					const newDistance = getDistance(activePointers[0], activePointers[1]);
					if (initialPinchDistance > 0 && newDistance > 0) {
						const pinchFactor = newDistance / initialPinchDistance;
						const nextScale = Math.max(0.1, Math.min(10, initialPinchScale * pinchFactor));

						const midX = (activePointers[0].clientX + activePointers[1].clientX) / 2;
						const midY = (activePointers[0].clientY + activePointers[1].clientY) / 2;
						const rect = viewport.getBoundingClientRect();
						const viewportMidX = midX - rect.left;
						const viewportMidY = midY - rect.top;

						const factor = nextScale / scale;
						translateX = viewportMidX - (viewportMidX - translateX) * factor;
						translateY = viewportMidY - (viewportMidY - translateY) * factor;
						scale = nextScale;

						applyTransform();
					}
				}
			};

			const onPointerUp = (e) => {
				activePointers = activePointers.filter(p => p.pointerId !== e.pointerId);
				if (activePointers.length < 2) {
					initialPinchDistance = 0;
				}
				if (activePointers.length === 1) {
					isDragging = true;
					startX = activePointers[0].clientX - translateX;
					startY = activePointers[0].clientY - translateY;
				} else {
					isDragging = false;
				}
			};

			viewport.addEventListener('pointerdown', onPointerDown);
			viewport.addEventListener('pointermove', onPointerMove);
			viewport.addEventListener('pointerup', onPointerUp);
			viewport.addEventListener('pointercancel', onPointerUp);

			// iOS touch overrides to prevent native zoom/scrolling inside diagram modal
			const onTouchStart = (e) => {
				if (e.touches.length > 1) {
					e.preventDefault();
				}
			};
			const onTouchMove = (e) => {
				e.preventDefault();
			};
			viewport.addEventListener('touchstart', onTouchStart, { passive: false });
			viewport.addEventListener('touchmove', onTouchMove, { passive: false });

			function getDistance(p1, p2) {
				const dx = p1.clientX - p2.clientX;
				const dy = p1.clientY - p2.clientY;
				return Math.sqrt(dx * dx + dy * dy);
			}

			// Clean up when modal closes
			const onModalClose = () => {
				modal.removeEventListener('close', onModalClose);
				resetBtn.removeEventListener('click', onReset);
				closeBtn.removeEventListener('click', onClose);
				viewport.removeEventListener('wheel', onWheel);
				viewport.removeEventListener('pointerdown', onPointerDown);
				viewport.removeEventListener('pointermove', onPointerMove);
				viewport.removeEventListener('pointerup', onPointerUp);
				viewport.removeEventListener('pointercancel', onPointerUp);
				viewport.removeEventListener('touchstart', onTouchStart);
				viewport.removeEventListener('touchmove', onTouchMove);
				svgContainer.innerHTML = '';
			};
			modal.addEventListener('close', onModalClose);

			// Fallback for light-dismiss on non-supporting browsers
			if (!('closedBy' in HTMLDialogElement.prototype)) {
				const onBackdropClick = (event) => {
					if (event.target !== modal) return;
					const rect = modal.getBoundingClientRect();
					const isDialogContent = (
						rect.top <= event.clientY &&
						event.clientY <= rect.top + rect.height &&
						rect.left <= event.clientX &&
						event.clientX <= rect.left + rect.width
					);
					if (!isDialogContent) {
						modal.close();
						modal.removeEventListener('click', onBackdropClick);
					}
				};
				modal.addEventListener('click', onBackdropClick);
			}
		}

		function escapeHtml(str) {
			if (typeof str !== "string") return "";
			return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
		}

		function deleteImageFromDoc(targetSrc, targetAlt, globalImageIndex) {
			if (!editor) return;
			const doc = editor.state.doc;
			const text = doc.toString();

			const IMAGE_RE = /!\[((?:[^\[\]\\]|\\.)*)\]\(\s*(?:<([^>]+)>|((?:[^\s()\\]|\\.|\([^\s()]*\))+))(?:\s+(?:"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|\((?:[^)\\]|\\.)*\)))?\s*\)|<img\s+[^>]*src=["']([^"']+)["'][^>]*\/?>/gi;

			const matches = [];
			let m;
			while ((m = IMAGE_RE.exec(text)) !== null) {
				const matchedSrc = m[2] || m[3] || m[4] || '';
				const matchedAlt = m[1] || '';
				matches.push({
					from: m.index,
					to: m.index + m[0].length,
					fullMatch: m[0],
					src: matchedSrc,
					alt: matchedAlt
				});
			}

			let chosenMatch = null;
			if (globalImageIndex !== undefined && matches[globalImageIndex] && (matches[globalImageIndex].src === targetSrc || decodeURIComponent(matches[globalImageIndex].src) === decodeURIComponent(targetSrc))) {
				chosenMatch = matches[globalImageIndex];
			} else {
				chosenMatch = matches.find(item => item.src === targetSrc || decodeURIComponent(item.src) === decodeURIComponent(targetSrc));
			}

			if (!chosenMatch) {
				if (window.MdvComments && typeof window.MdvComments.toast === "function") {
					window.MdvComments.toast("Could not locate image in markdown source");
				}
				return;
			}

			let from = chosenMatch.from;
			let to = chosenMatch.to;

			const line = doc.lineAt(from);
			const lineText = line.text;
			const matchStartInLine = from - line.from;
			const matchEndInLine = to - line.from;

			const before = lineText.slice(0, matchStartInLine).trim();
			const after = lineText.slice(matchEndInLine).trim();

			if (!before && !after) {
				if (line.number < doc.lines) {
					from = line.from;
					to = line.to + 1;
				} else if (line.number > 1) {
					from = doc.line(line.number - 1).to;
					to = line.to;
				} else {
					from = line.from;
					to = line.to;
				}
			}

			editor.dispatch({
				changes: { from, to, insert: '' }
			});

			updatePreview();

			if (window.MdvComments && typeof window.MdvComments.toast === "function") {
				window.MdvComments.toast("Image removed from document");
			}
		}

		function updateImageList() {
			if (!editor) return;
			const text = editor.state.doc.toString();
			const imageList = document.getElementById("image-list");
			const countBadge = document.getElementById("sidebar-image-count");
			if (!imageList) return;

			const IMAGE_SCAN_RE = /!\[((?:[^\[\]\\]|\\.)*)\]\(\s*(?:<([^>]+)>|((?:[^\s()\\]|\\.|\([^\s()]*\))+))(?:\s+(?:"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|\((?:[^)\\]|\\.)*\)))?\s*\)|<img\s+[^>]*src=["']([^"']+)["'][^>]*\/?>/gi;

			const doc = editor.state.doc;
			const images = [];
			let m;
			while ((m = IMAGE_SCAN_RE.exec(text)) !== null) {
				const src = m[2] || m[3] || m[4] || '';
				const alt = m[1] || '';
				const line = doc.lineAt(m.index).number;
				images.push({
					index: images.length,
					src,
					alt,
					line,
					charOffset: m.index
				});
			}

			if (countBadge) {
				countBadge.textContent = images.length > 0 ? images.length : "";
			}

			if (images.length === 0) {
				imageList.innerHTML = '<div class="text-[var(--text-tertiary)] text-xs italic p-8 text-center">No pictures found.</div>';
				return;
			}

			imageList.innerHTML = images.map((img, i) => {
				const displayTitle = img.alt ? escapeHtml(img.alt) : (img.src.startsWith('data:') ? 'Image ' + (i + 1) : escapeHtml(img.src.split('/').pop()?.split('?')[0] || ('Picture ' + (i + 1))));
				const displaySub = img.src.startsWith('data:') ? 'Inline data' : escapeHtml(img.src.replace(/^https?:\/\//i, ''));
				return `
					<div class="sidebar-image-card" data-image-index="${i}" data-line="${img.line}" data-src="${escapeHtml(img.src)}" data-alt="${escapeHtml(img.alt)}" title="${displayTitle}">
						<div class="sidebar-image-card-thumb">
							<img src="${escapeHtml(img.src)}" alt="${escapeHtml(img.alt)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
							<div class="hidden w-full h-full items-center justify-center text-[var(--text-tertiary)] bg-[var(--bg-surface)]">
								<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
							</div>
							<span class="sidebar-image-card-badge">#${i + 1}</span>
							<button type="button" class="sidebar-image-card-delete" title="Delete image from document" aria-label="Delete image">
								<svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
							</button>
						</div>
						<div class="sidebar-image-card-meta">
							<div class="sidebar-image-card-title">${displayTitle}</div>
							<div class="sidebar-image-card-sub">${displaySub}</div>
						</div>
					</div>
				`;
			}).join('');

			imageList.querySelectorAll(".sidebar-image-card").forEach(item => {
				const idx = parseInt(item.getAttribute("data-image-index"), 10);
				const lineNum = parseInt(item.getAttribute("data-line"), 10);
				const src = item.getAttribute("data-src") || "";
				const alt = item.getAttribute("data-alt") || "";

				item.addEventListener("click", (e) => {
					if (e.target.closest(".sidebar-image-card-delete")) return;
					scrollToImage(idx, lineNum, src);
				});

				const delBtn = item.querySelector(".sidebar-image-card-delete");
				if (delBtn) {
					delBtn.addEventListener("click", (e) => {
						e.preventDefault();
						e.stopPropagation();
						deleteImageFromDoc(src, alt, idx);
					});
				}
			});
		}

		function scrollToImage(imageIndex, lineNum, src) {
			if (isEditing && editor) {
				const pos = editor.state.doc.line(lineNum).from;
				editor.dispatch({
					selection: { anchor: pos, head: pos },
					scrollIntoView: true
				});
				editor.focus();
			} else {
				const containers = contentArea.querySelectorAll(".mdv-image-container");
				let targetEl = containers[imageIndex];
				if (!targetEl) {
					const allImgs = contentArea.querySelectorAll("img");
					for (const img of allImgs) {
						if (img.getAttribute("src") === src) {
							targetEl = img.closest(".mdv-image-container") || img;
							break;
						}
					}
				}
				if (targetEl) {
					targetEl.scrollIntoView({ behavior: "smooth", block: "center" });
					targetEl.classList.remove("mdv-image-highlight");
					void targetEl.offsetWidth;
					targetEl.classList.add("mdv-image-highlight");
					setTimeout(() => {
						targetEl?.classList?.remove("mdv-image-highlight");
					}, 2000);
				}
			}
			if (window.innerWidth < 768) {
				const sidebar = document.getElementById("sidebar");
				if (sidebar && !sidebar.classList.contains("hidden")) {
					document.getElementById("toggle-sidebar")?.click();
				}
			}
		}

		function updatePreview() {
			if (editor) {
				const text = editor.state.doc.toString();
				contentArea.innerHTML = DOMPurify.sanitize(marked.parse(text));
				if (!isEditing) enhanceContent();
				updateOutline();
				updateImageList();
				Prism.highlightAllUnder(contentArea);
				renderMermaidDiagrams();
				if (window.MdvComments) MdvComments.applyHighlights();
				updateFooterInfo();
			}
		}

		function formatSize(bytes) {
			if (bytes < 1024) return bytes + ' B';
			if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
			return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
		}

		function updateFooterInfo() {
			const el = document.getElementById('footer-file-info');
			if (!el || !editor) return;
			const text = editor.state.doc.toString();
			const bytes = new TextEncoder().encode(text).length;
			const lines = editor.state.doc.lines;
			const parts = [];
			if (currentFileName) parts.push(currentFileName);
			parts.push(formatSize(bytes));
			parts.push(lines + ' line' + (lines !== 1 ? 's' : ''));
			el.textContent = parts.join(' · ');
		}

		function updateOutline() {
			if (!editor) return;
			const text = editor.state.doc.toString();
			const outlineList = document.getElementById("outline-list");
			const headings = [];

			const lines = text.split("\n");
			let inCodeBlock = false;
			let codeBlockLang = "";
			let currentHeadingLevel = 0;
			let codeBlockHeadingLevel = 1;

			lines.forEach((line, index) => {
				const trimmed = line.trim();
				// Check for code fence start/end
				if (trimmed.startsWith("```") || trimmed.startsWith("~~~")) {
					if (!inCodeBlock) {
						inCodeBlock = true;
						// Extract language
						const langMatch = trimmed.match(/^[`~]{3,}\s*(\w*)/);
						codeBlockLang = (langMatch && langMatch[1]) ? langMatch[1] : "code";
						const blockLevel = Math.min(currentHeadingLevel + 1, 6);
						headings.push({
							level: blockLevel,
							text: `Code (${codeBlockLang})`,
							line: index
						});
						codeBlockHeadingLevel = Math.min(blockLevel + 1, 6);
					} else {
						inCodeBlock = false;
					}
					return;
				}

				if (inCodeBlock) {
					// Check for comments or headings inside the code block
					const match = line.match(/^(#{1,6})\s+(.+)$/);
					if (match) {
						const innerLevel = match[1].length;
						const absoluteLevel = Math.min(codeBlockHeadingLevel + (innerLevel - 1), 6);
						headings.push({
							level: absoluteLevel,
							text: match[2].trim(),
							line: index
						});
					}
				} else {
					const match = line.match(/^(#{1,6})\s+(.+)$/);
					if (match) {
						const level = match[1].length;
						currentHeadingLevel = level;
						headings.push({
							level: level,
							text: match[2].trim(),
							line: index
						});
					}
				}
			});

			if (headings.length === 0) {
				outlineList.innerHTML = '<div class="text-gray-400 text-xs italic p-8 text-center">No headings found.</div>';
				return;
			}

			outlineList.innerHTML = headings.map((h, i) => `
				<button 
					data-index="${i}"
					data-line="${h.line}"
					data-text="${encodeURIComponent(h.text)}"
					class="outline-item w-full text-left px-3 py-1.5 rounded-md text-[11px] transition-all truncate hover:bg-[var(--bg-surface-hover)]"
					data-level="${h.level}"
				>

			`).join("");

			outlineList.querySelectorAll(".outline-item").forEach(btn => {
				btn.onclick = () => {

					const text = decodeURIComponent(btn.getAttribute("data-text"));

				};
			});
		}

		const mathExtension = {
			name: 'math',
			level: 'inline',
			start(src) { return src.indexOf('$'); },
			tokenizer(src, tokens) {
				const blockRule = /^\$\$\n?([\s\S]+?)\n?\$\$/;
				const inlineRule = /^\$((?:\S)|(?:\S[\s\S]*?\S))\$(?!\d)/;

				let match;
				if (match = blockRule.exec(src)) {
					return {
						type: 'math',
						raw: match[0],
						text: match[1].trim(),
						displayMode: true
					};
				} else if (match = inlineRule.exec(src)) {
					return {
						type: 'math',
						raw: match[0],
						text: match[1].trim(),
						displayMode: false
					};
				}
			},
			renderer(token) {
				// Repair common LaTeX commands that can be corrupted before rendering.
				// Scope this to math only so normal text and intentional tabs are untouched.
				const repairedText = token.text
					// \text and \times can become a tab followed by ext/imes when markdown

					.replace(/\t(?=(?:ext|imes)\b)/g, "\\t")

					// backslash. Only repair the command form immediately before `{...}`.
					.replace(/(^|[^\\\w])mathbf(?=\s*\{)/g, "$1\\mathbf");
				try {
					return katex.renderToString(repairedText, {
						displayMode: token.displayMode,
						throwOnError: false
					});

					console.error('KaTeX error:', e);

		function cleanMarkdownQuotesAndBackticks(text) {

				if (t.startsWith('"') && t.endsWith('"')) {
					t = t.slice(1, -1).trim();
					changed = true;
				}
				if (t.startsWith('```') && t.endsWith('```')) {

					const firstNewLine = t.indexOf('\n');

						if (/^[a-zA-Z0-9_-]+$/.test(firstLine)) {

			openMenu.style.width = `${width}px`;

			let left = r.right - width;
			if (left < 8) left = 8;
			if (left + width > vw - 8) left = Math.max(8, vw - width - 8);

			let top = r.bottom + 4;
			if (top + height > vh - 8 && r.top - height - 4 > 8) {

			let startY = 0;
			let startAboveH = 0;
			let startBelowH = 0;

			function getExpandedNeighbors(resizerEl) {
				let above = null, below = null;
				let prev = resizerEl.previousElementSibling;
				while (prev) {
					if (prev.classList.contains('sidebar-panel') && !prev.classList.contains('collapsed')) {
						above = prev; break;
					}
					prev = prev.previousElementSibling;
				}
				let next = resizerEl.nextElementSibling;
				while (next) {
					if (next.classList.contains('sidebar-panel') && !next.classList.contains('collapsed')) {
						below = next; break;
					}
					next = next.nextElementSibling;
				}
				return { above, below };
			}

			resizers.forEach(r => {
				r.addEventListener("pointerdown", (e) => {
					const neighbors = getExpandedNeighbors(r);
					if (!neighbors.above || !neighbors.below) return;
					activeResizer = r;
					resizerAbove = neighbors.above;
					resizerBelow = neighbors.below;
					startY = e.clientY;
					startAboveH = resizerAbove.getBoundingClientRect().height;
					startBelowH = resizerBelow.getBoundingClientRect().height;
					document.body.style.cursor = "ns-resize";
					document.body.classList.add("select-none");
					e.preventDefault();
				});
			});

			document.addEventListener("pointermove", (e) => {
				if (!activeResizer) return;
				const delta = e.clientY - startY;
				const newAbove = Math.max(40, startAboveH + delta);
				const newBelow = Math.max(40, startBelowH - delta);
				resizerAbove.style.flex = `0 0 ${newAbove}px`;
				resizerBelow.style.flex = `0 0 ${newBelow}px`;
			});

			document.addEventListener("pointerup", () => {
				if (activeResizer) {
					activeResizer = null;
					resizerAbove = null;
					resizerBelow = null;
					document.body.style.cursor = "";
					document.body.classList.remove("select-none");
				}
			});
		})();

		window.resolveNewlines = function () {
			if (editor) {
				const currentText = editor.state.doc.toString();
				const newText = currentText.replace(/\\n/g, '\n')
					.replace(/\\r/g, '\r')
					.replace(/\\t/g, '\t')
					.replace(/\\"/g, '"')
					.replace(/\\u([0-9a-fA-F]{4})/g, (match, grp) => {
						return String.fromCharCode(parseInt(grp, 16));
					});
				if (currentText !== newText) {
					editor.dispatch({

			}
		};

		window.copyEditorContents = function () {
			if (!editor) return;
			const text = editor.state.doc.toString();
			const toastMsg = 'Editor contents copied';
			if (navigator.clipboard && window.isSecureContext) {
				navigator.clipboard.writeText(text).then(() => {
					if (window.MdvComments && typeof window.MdvComments.toast === 'function') {
						window.MdvComments.toast(toastMsg);

				}).catch(() => {
					fallbackCopy(text);

						window.MdvComments.toast(toastMsg);

				if (window.MdvComments && typeof window.MdvComments.toast === 'function') {
					window.MdvComments.toast(toastMsg);
				}
			}
		};

		function fallbackCopy(text) {
			const ta = document.createElement("textarea");
			ta.value = text;
			ta.style.position = "fixed";
			ta.style.left = "-9999px";
			document.body.appendChild(ta);
			ta.select();
			try { document.execCommand("copy"); } catch { /* silent */ }
			document.body.removeChild(ta);
		}

		// Initial setup
		initEditor(loadMdvState());
		updateViewMode();
		updateTabTitle();

		// ── Iframe Embed Mode + Shared Sidebar Toggle ─────────────────────
		(function () {
			const urlParams = new URLSearchParams(window.location.search);
			const showChrome = urlParams.get('show_chrome') === '1';

			const isInsideFrame = window.parent && window.parent !== window;
			const iframeMode = isInsideFrame && !showChrome;

			if (iframeMode) {
				document.body.classList.add('iframe-mode');
			}

			const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
			const sidebarEl = document.getElementById('sidebar');
			if (!sidebarToggleBtn || !sidebarEl) return;

			function updateToggleIcon(collapsed) {
				const collapseIcon = sidebarToggleBtn.querySelector('.icon-collapse');
				const expandIcon = sidebarToggleBtn.querySelector('.icon-expand');
				if (collapseIcon) collapseIcon.style.display = collapsed ? 'none' : 'block';
				if (expandIcon) expandIcon.style.display = collapsed ? 'block' : 'none';
				sidebarToggleBtn.title = collapsed ? 'Show sidebar' : 'Hide sidebar';
			}

			if (iframeMode) {
				let collapsed = true;
				sidebarEl.classList.add('iframe-sidebar-collapsed');
				updateToggleIcon(collapsed);

				sidebarToggleBtn.addEventListener('click', () => {
					collapsed = !collapsed;
					sidebarEl.classList.toggle('iframe-sidebar-collapsed', collapsed);
					updateToggleIcon(collapsed);

			} else {
				if (localStorage.getItem('sidebar_collapsed') === 'true') {

				sidebarToggleBtn.onclick = () => {

					}

			}
		})();
