<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>JSON Explorer — Dylen Text Tools</title>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="icon" href="favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="vendor/tailwind.min.css">
	<script src="vendor/purify.min.js"></script>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="jsv.css">

	<style>
		/* ── Iframe Embed Mode ──────────────────────────────── */
		body.iframe-mode .app-header-row {
			display: none !important;
		}

		body.iframe-mode #files-panel {
			display: none !important;
		}

		/* Sidebar in iframe mode: always visible, animated collapse */
		body.iframe-mode #sidebar {
			display: flex !important;
			transition: width var(--transition-slow), min-width var(--transition-slow);
		}

		body.iframe-mode #sidebar.iframe-sidebar-collapsed {
			display: flex !important;
			width: 0 !important;
			min-width: 0 !important;
			overflow: hidden;
		}

		/* Hide editor syntax error highlights */
		.cm-invalidChar, .cm-error, .cm-invalid, .ͼ1 .cm-invalid {
			color: inherit !important;
			background: transparent !important;
			border: none !important;
			text-decoration: none !important;
		}

		/* ── Tree Action Repair Wrench ── */
		.tree-action-repair {
			color: var(--warning) !important;
		}

		.tree-action-repair:hover {
			color: var(--accent) !important;
			background: var(--bg-surface-hover) !important;
		}

		/* ── Tree View Error Display ── */
		.json-error-container {
			color: var(--danger);
			padding: 16px;
			border: 1px solid var(--danger);
			border-radius: var(--radius-md);
		}

		.json-error-title {
			margin-bottom: 4px;
			font-weight: 600;
		}

		.json-error-message {
			font-size: 11px;
			font-family: var(--font-mono);
			color: var(--text-secondary);
		}

		.json-error-btn {
			margin-top: 12px;
			padding: 4px 10px;
			background: rgb(239, 68, 68);
			color: rgb(255, 255, 255);
			border: none;
			border-radius: var(--radius-sm);
			font-size: 11px;
			cursor: pointer;
			transition: background-color var(--transition-fast);
		}

		.json-error-btn:hover {
			background: rgb(220, 38, 38);
		}

		/* ── Tree View Empty Display ── */
		.json-empty-message {
			color: var(--text-tertiary);
			padding: 32px;
			text-align: center;
			font-style: italic;
			font-size: 12px;
		}
	</style>


</head>


<body class="h-screen flex flex-col overflow-hidden transition-colors duration-200">

	<script>
		const { EditorView, basicSetup, javascript, json, oneDark, foldGutter, foldKeymap, keymap } = window.CM_JS;
		const fileListContainer = document.getElementById("file-list");
		const editorContainer = document.getElementById("editor-container");
		const treeContainer = document.getElementById("tree-container");
		const treeRoot = document.getElementById("json-tree-root");
		const treeMobile = document.getElementById("json-tree-mobile");
		const editorEl = document.getElementById("editor");
		const toggleViewBtn = document.getElementById("toggle-view-btn");
		const toggleText = document.getElementById("toggle-text");
		const downloadBtn = document.getElementById("download-btn");
		const saveChevronBtn = document.getElementById("save-chevron-btn");
		const saveDropdownMenu = document.getElementById("save-dropdown-menu");
		const copyToast = document.getElementById("copy-toast");
		const sourceBtn = document.getElementById("source-view-btn");
		const sidebar = document.getElementById("sidebar");

		const openBtn = document.getElementById("open-btn");
		const pasteBtn = document.getElementById("paste-btn");
		const newBtn = document.getElementById("new-btn");
		const fileInput = document.getElementById("file-input");

		if (pasteBtn) {
			pasteBtn.onclick = async () => {
				try {
					if (!navigator.clipboard || !window.isSecureContext) {
						throw new Error('Clipboard API unavailable');
					}
					const text = normalizePastedText(await navigator.clipboard.readText());
					if (text !== undefined && text !== null) {
						if (!editor) {
							initEditor(text, currentFileName?.endsWith(".json") ? "json" : "javascript");
						} else {
							const transaction = editor.state.update({
								changes: { from: 0, to: editor.state.doc.length, insert: text },
								selection: { anchor: text.length }
							});
							editor.dispatch(transaction);
							setTimeout(() => editor.focus(), 10);
						}

						copyToast.textContent = "Pasted from clipboard!";
						copyToast.style.opacity = "1";
						setTimeout(() => copyToast.style.opacity = "0", 2000);
					}
				} catch (err) {
					console.error('Failed to read clipboard contents: ', err);
					copyToast.textContent = "Use Ctrl+V / Cmd+V to paste";
					copyToast.style.background = "#ef4444";
					copyToast.style.opacity = "1";
					setTimeout(() => {
						copyToast.style.opacity = "0";
						setTimeout(() => copyToast.style.background = "#333", 300);
					}, 3000);
				}
			};
		}

		const toggleSidebar = () => {
			document.body.classList.toggle("mobile-sidebar-active");
		};

		let loadedFiles = new Map();
		let currentFileName = null;
		let editor = null;
		let sourceJSON = null; // Store the original JSON when in resolved view
		let viewMode = "editor"; // 'editor' or 'tree'
		let lineWrap = true;
		// ── Tree View (extracted to json-tree.js) ─────────────────────
		const treeView = window.createJsonTreeView({
			roots: [treeRoot, treeMobile],
			getEditor: () => editor,
			EditorView
		});

		function debouncedBuildTree(text) { treeView.debouncedBuildTree(text); }
		function buildTree(text) { treeView.buildTree(text); }

		// ── Two-way sync state ─────────────────────────────────────────────
		let syncVersion = 0;           // Monotonically increasing counter
		let syncTargetOrigin = '*';     // Target origin for outbound messages
		let syncPendingChange = null;   // Pending contentChange payload
		let syncDebounceTimer = null;   // Debounce timer for contentChange
		let _syncLoadingContent = false; // True while loadContent is in flight
		let _streaming = false; // True while an appendContent stream is in progress
		const SYNC_DEBOUNCE_MS = 300;   // Debounce interval for contentChange

		// Helper: post message to parent with proper origin handling
		function syncPostMessage(payload) {
			try {
				window.parent?.postMessage(payload, syncTargetOrigin);
			} catch (e) {
				console.error('[jsv] syncPostMessage failed:', e);
			}
		}

		// Flush any pending contentChange immediately (used on unload)
		function syncFlushImmediate() {
			if (syncDebounceTimer) {
				clearTimeout(syncDebounceTimer);
				syncDebounceTimer = null;
			}
			if (syncPendingChange) {
				syncVersion++;
				const p = syncPendingChange;
				syncPendingChange = null;
				syncPostMessage({
					type: 'contentChange',
					text: p.text,
					filename: p.filename,
					format: p.format,
					version: syncVersion,
					selection: p.selection
				});
			}
		}

		// Schedule a debounced contentChange post
		function syncScheduleChange(text, selection) {
			const format = currentFileName?.toLowerCase().endsWith('.json') ? 'json' : 'javascript';
			syncPendingChange = {
				text: text,
				filename: currentFileName || 'scratchpad.json',
				format: format,
				selection: selection
			};
			clearTimeout(syncDebounceTimer);
			syncDebounceTimer = setTimeout(() => {
				if (!syncPendingChange) return;
				syncVersion++;
				const p = syncPendingChange;
				syncPendingChange = null;
				syncDebounceTimer = null;
				syncPostMessage({
					type: 'contentChange',
					text: p.text,
					filename: p.filename,
					format: p.format,
					version: syncVersion,
					selection: p.selection
				});
			}, SYNC_DEBOUNCE_MS);
		}

		// Beforeunload: flush any pending changes
		window.addEventListener('beforeunload', () => {
			syncFlushImmediate();
		});

		// Dropdown handling
		const instanceDropdown = document.getElementById('instance-menu-dropdown');
		const instanceBtn = document.getElementById('instance-menu-btn');
		const toolsDropdown = document.getElementById('tools-menu-dropdown');
		const toolsBtn = document.getElementById('tools-menu-btn');

		function positionToolbarDropdown(menu, btn) {
			if (window.innerWidth >= 768) return;
			const r = btn.getBoundingClientRect();
			const vw = window.innerWidth;
			const width = menu.offsetWidth || 200;
			let left = r.left;

		function normalizePastedText(text) {
			if (typeof text !== 'string') return text;
			let result = text.trim();
			if (!result) return result;

			let prev;
			do {
				prev = result;
				// Trim spaces, actual newlines, and literal newlines (\n, \r, \t)
				result = result.replace(/^(?:\\n|\\r|\\t|\s)+|(?:\\n|\\r|\\t|\s)+$/gi, '');

				// 1. Handle markdown code fences
				const leadingFence = result.match(/^```(?:json|javascript|js|typescript|ts)?\s*/i);
				if (leadingFence) {
					result = result.slice(leadingFence[0].length);
					result = result.trimEnd();
					if (result.endsWith('```')) {
						result = result.slice(0, -3);
					}
					result = result.trim();
					continue;
				}

				// 2. Handle stringified double-quoted or single-quoted JS/JSON strings
				if ((result.startsWith('"') && result.endsWith('"')) || (result.startsWith("'") && result.endsWith("'"))) {
					try {
						if (result.startsWith('"')) {
							const parsed = JSON.parse(result);
							if (typeof parsed === 'string') {
								result = parsed;
								continue;
							}
						} else {
							const unescaped = result.slice(1, -1)
								.replace(/\\'/g, "'")
								.replace(/\\"/g, '"')
								.replace(/\\n/g, '\n')
								.replace(/\\r/g, '\r')
								.replace(/\\t/g, '\t')
								.replace(/\\\\/g, '\\');
							result = unescaped;
							continue;
						}
					} catch (e) {
						if (result.length >= 2) {
							result = result.slice(1, -1);
						}
					}
				}
			} while (result !== prev);

			// One final trim of literal and actual whitespace/newlines
			result = result.replace(/^(?:\\n|\\r|\\t|\s)+|(?:\\n|\\r|\\t|\s)+$/gi, '');
			return result;
		}

		function getSuggestedJsonFilename(defaultExt = '.json') {
			const text = (sourceJSON !== null ? sourceJSON : (editor ? editor.state.doc.toString() : '')).trim();
			let name = null;

			try {
				if (text && (text.startsWith('{') || text.startsWith('['))) {
					const data = JSON.parse(text);
					if (data && typeof data === 'object') {
						if (typeof data.title === 'string' && data.title.trim()) name = data.title.trim();
						else if (typeof data.heading === 'string' && data.heading.trim()) name = data.heading.trim();
						else if (typeof data.name === 'string' && data.name.trim()) name = data.name.trim();
						else if (typeof data.topic === 'string' && data.topic.trim()) name = data.topic.trim();
						else if (typeof data.main === 'string' && data.main.trim()) name = data.main.trim();
						else if (data.metadata && typeof data.metadata.title === 'string') name = data.metadata.title.trim();
					}
				}
			} catch (e) {
				const m = text.match(/"(?:title|heading|name|topic|main)"\s*:\s*"([^"]+)"/);
				if (m && m[1]) name = m[1].trim();
			}

			if (name) {
				let clean = name.replace(/[/\\:*?"<>|]/g, '').trim();
				if (clean) {
					if (!clean.toLowerCase().endsWith(defaultExt.toLowerCase())) {
						clean += defaultExt;
					}
					return clean;
				}
			}

				const base = currentFileName.replace(/\.[^.]+$/, '');
				return `${base}${defaultExt}`;
			}
			return `data${defaultExt}`;
		}

				const input = document.getElementById("save-modal-input");
				const titleEl = document.getElementById("save-modal-title");

				if (!modal || !input || !form) {

					resolve(res ? res.trim() : null);
					return;
				}

				if (titleEl) titleEl.textContent = titleText;
				input.value = suggestedName || "data.json";

				let settled = false;
				function finish(val) {
					if (settled) return;
					settled = true;
					modal.close();
					cleanup();
					resolve(val);
				}

				function onSubmit(e) {
					e.preventDefault();
					const val = input.value.trim();
					finish(val || suggestedName);
				}

				function onCancel() {
					finish(null);
				}

				function onModalClose() {
					finish(null);
				}

				function cleanup() {
					form.removeEventListener("submit", onSubmit);
					if (cancelBtn) cancelBtn.removeEventListener("click", onCancel);
					if (closeBtn) closeBtn.removeEventListener("click", onCancel);
					modal.removeEventListener("close", onModalClose);
				}

				form.addEventListener("submit", onSubmit);
				if (cancelBtn) cancelBtn.addEventListener("click", onCancel);
				if (closeBtn) closeBtn.addEventListener("click", onCancel);
				modal.addEventListener("close", onModalClose);

				modal.showModal();
				input.focus();
				const dotIdx = input.value.lastIndexOf('.');
				if (dotIdx > 0) {
					input.setSelectionRange(0, dotIdx);
				} else {
					input.select();
				}
			});
		}

		// ── postMessage API: receive content from parent frame ─────────────
		// Shared origin validation for the postMessage sync API, mirroring the

		// event.origin values ("null"/"") that are not valid postMessage

		function _syncResolveTargetOrigin(event, msg) {

				if (!editor) {
					_syncLoadingContent = true;

					initEditor(text, currentFileName?.toLowerCase().endsWith('.json') ? 'json' : 'javascript');

					_syncLoadingContent = false;
					_streaming = true;
					return;
				}

				if (!_streaming) {

				}

				if (typeof msg.filename === 'string') currentFileName = msg.filename;

				if (text) {
					_syncLoadingContent = true;
					const end = editor.state.doc.length;
					editor.dispatch({

						effects: EditorView.scrollIntoView(end + text.length)

				syncDebounceTimer = null;
				syncPendingChange = null;

				const rawFinal = editor ? editor.state.doc.toString() : '';
				const finalText = cleanLiteralNewlinesIfJson(normalizePastedText(rawFinal), currentFileName || '');
				if (editor && finalText !== rawFinal) {
					_syncLoadingContent = true;

					_syncLoadingContent = false;
				}
				const isJson = (currentFileName || '').toLowerCase().endsWith('.json');
				const trimmed = finalText.trim();
				if (isJson || !trimmed || trimmed.startsWith('{') || trimmed.startsWith('[')) {
					// Re-arm the pending debounce with the correct text so a
					// stale mid-stream rebuild can't overwrite this tree.
					debouncedBuildTree(finalText);
					buildTree(finalText);
				} else {
					treeRoot.innerHTML = '<div class="text-gray-400 p-8 text-center italic">Not currently showing tree for non-JSON content.</div>';
				}
				// Streamed appends bypass the updateListener, so instances[]
				// still holds pre-stream content; sync it before persisting.
				instances[currentInstance].content = finalText;
				if (currentFileName) instances[currentInstance].fileName = currentFileName;
				saveJsvState();

						format: format,

				}
				return;
			}

			if (msg.type !== 'loadContent') return;

			// Binary payload: jsv.html is a text/JSON editor and does not
			// render PDFs. Surface a red toast and bail.
			if (msg.bytes && !(typeof msg.text === 'string' && msg.text.length > 0)) {
				toast('jsv.html does not accept PDF bytes — load PDFs in pdf.html');
				copyToast.style.background = '#ef4444';
				setTimeout(() => { copyToast.style.opacity = '0'; setTimeout(() => copyToast.style.background = '#333', 300); }, 3000);
				syncPostMessage({
					type: 'error',
					code: 'load_failed',
					message: 'jsv.html does not accept PDF bytes — load PDFs in pdf.html'
				});
				return;
			}

			const text = typeof msg.text === 'string' ? msg.text : '';
			const filename = typeof msg.filename === 'string' ? msg.filename : `scratchpad-${currentInstance + 1}.json`;

			// Store targetOrigin for outbound messages (default to event.origin)
			if (msg.options?.targetOrigin) {
				syncTargetOrigin = msg.options.targetOrigin;
			} else {
				syncTargetOrigin = event.origin || '*';
			}

			// A plain loadContent always supersedes any in-progress stream.
			_streaming = false;

			// Cancel any pending contentChange (content is being replaced)
			clearTimeout(syncDebounceTimer);
			syncDebounceTimer = null;
			syncPendingChange = null;

			// Set loading flag to skip change events from initEditor
			_syncLoadingContent = true;

			// Update state
			currentFileName = filename;
			sourceJSON = null;
			sourceBtn.classList.add('hidden');
			const normalizedText = normalizePastedText(text);
			const cleanedText = cleanLiteralNewlinesIfJson(normalizedText, filename);
			instances[currentInstance].content = cleanedText;
			instances[currentInstance].fileName = filename;

			// Auto-detect language from filename extension
			const isJson = filename.toLowerCase().endsWith('.json');
			const lang = isJson ? 'json' : 'javascript';
			initEditor(cleanedText, lang);
			updateTabTitle();
			saveJsvState();

			// Rebuild tree for JSON-shaped content; otherwise show the
			// existing "not JSON" hint used in displayFile()
			const trimmed = cleanedText.trim();
			if (isJson || !trimmed || trimmed.startsWith('{') || trimmed.startsWith('[')) {
				buildTree(cleanedText);
			} else {
				treeRoot.innerHTML = '<div class="text-gray-400 p-8 text-center italic">Not currently showing tree for non-JSON content.</div>';
			}

			// Increment version and acknowledge back to sender
			syncVersion++;
			const replyVersion = syncVersion;
			if (event.source) {
				event.source.postMessage({
					type: 'loadContentAck',
					filename: filename,
					format: lang,
					version: replyVersion
				}, syncTargetOrigin);
			}

			// Show visual feedback for successful load
			toast(`Loaded: ${filename}`);

			// Clear loading flag
			_syncLoadingContent = false;
		});
		// ── Iframe Embed Mode + Shared Sidebar Toggle ─────────────────────
		(function () {
			const urlParams = new URLSearchParams(window.location.search);
			const showChrome = urlParams.get('show_chrome') === '1';

			const isInsideFrame = window.parent && window.parent !== window;
			const iframeMode = isInsideFrame && !showChrome;

			if (iframeMode) {
				document.body.classList.add('iframe-mode');
			}

			const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
			const sidebarEl = document.getElementById('sidebar');
			if (!sidebarToggleBtn || !sidebarEl) return;

			function updateToggleIcon(collapsed) {
				const collapseIcon = sidebarToggleBtn.querySelector('.icon-collapse');
				const expandIcon = sidebarToggleBtn.querySelector('.icon-expand');
				if (collapseIcon) collapseIcon.style.display = collapsed ? 'none' : 'block';
				if (expandIcon) expandIcon.style.display = collapsed ? 'block' : 'none';
				sidebarToggleBtn.title = collapsed ? 'Show sidebar' : 'Hide sidebar';
			}

			if (iframeMode) {
				let collapsed = true;
				sidebarEl.classList.add('iframe-sidebar-collapsed');
				updateToggleIcon(collapsed);

				sidebarToggleBtn.addEventListener('click', () => {
					collapsed = !collapsed;
					sidebarEl.classList.toggle('iframe-sidebar-collapsed', collapsed);
					updateToggleIcon(collapsed);
				});
			} else {
				if (localStorage.getItem('sidebar_collapsed') === 'true') {
					document.body.classList.add('sidebar-collapsed');
				}
				sidebarToggleBtn.onclick = () => {
					if (window.innerWidth < 768) {
						toggleSidebar();
					} else {
						const collapsed = document.body.classList.toggle('sidebar-collapsed');
						localStorage.setItem('sidebar_collapsed', collapsed ? 'true' : 'false');
					}
				};
			}
		})();
	</script>

	<!-- Save Filename Modal -->
	<dialog id="save-filename-modal" class="save-modal" aria-labelledby="save-modal-title">
		<div class="save-modal-card">
			<div class="save-modal-header">
				<h3 id="save-modal-title" class="save-modal-heading">Save File</h3>
				<button type="button" id="save-modal-close-btn" class="save-modal-close-btn" aria-label="Close">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
					</svg>
				</button>
			</div>
			<form id="save-modal-form" method="dialog" class="save-modal-form">
				<label for="save-modal-input" class="save-modal-label">File name</label>
				<input type="text" id="save-modal-input" class="save-modal-input" autocomplete="off" spellcheck="false" required />
				<div class="save-modal-actions">
					<button type="button" id="save-modal-cancel-btn" class="btn btn-secondary btn-sm">Cancel</button>
					<button type="submit" id="save-modal-submit-btn" class="btn btn-primary btn-sm">Save</button>
				</div>
			</form>
		</div>
	</dialog>
