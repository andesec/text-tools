<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Explorer — Dylen Text Tools</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="vendor/tailwind.min.css">
    <script src="vendor/pdf-lib.min.js"></script>
    <script src="vendor/pdf.min.js"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="pdf.css">
</head>
<body class="h-screen flex flex-col overflow-hidden transition-colors duration-200">
    <header class="app-header z-50 shrink-0">
        <div class="app-header-row">
            <!-- Left Edge: Home navigation icon -->
            <div class="flex items-center gap-2">
                <a href="index.html" class="btn-icon" title="Home" aria-label="Home">
                    <i class="ph ph-house text-base"></i>
                </a>
            </div>

            <!-- Center: Tool Logo Badge + Tool Title -->
            <div class="app-header-row-center">
                <div class="app-header-logo-badge" style="background: linear-gradient(to bottom right, #dc2626, #991b1b);">
                    <i class="ph ph-file-pdf text-lg text-white"></i>
                </div>
                <h1 class="text-base sm:text-lg font-bold tracking-tight text-[var(--text-primary)]">PDF Explorer</h1>
            </div>

            <!-- Right Edge: New PDF Button -->
            <div class="flex items-center gap-1.5 justify-end">
                <button id="new-pdf-btn" class="btn btn-sm" style="display:none" title="Start over with a new PDF">
                    <i class="ph ph-plus text-base"></i>
                    <span class="btn-text">New PDF</span>
                </button>
            </div>
        </div>

        <!-- Sub-Toolbar (Row 2) -->
        <div class="app-header-toolbar">
            <div class="toolbar-pinned-left">
                <button id="sidebar-toggle-btn" class="btn-icon sidebar-toggle-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
                    <i class="ph ph-sidebar-simple text-base"></i>
                </button>
            </div>
            <div class="toolbar-middle-scroll">
                <span id="page-count" class="badge" style="display:none">0 Pages</span>
                <span id="preview-status" class="badge-ghost" style="display:none"></span>
                <button id="add-range-btn" class="btn btn-sm" style="display:none">
                    <i class="ph ph-plus text-base"></i>
                    <span class="btn-text">Add Range</span>
                </button>
            </div>
            <div class="toolbar-pinned-right"></div>
        </div>
    </header>


    <div class="flex-1 flex overflow-hidden relative">
        <aside id="sidebar" class="w-72 app-sidebar flex flex-col shrink-0">
            <!-- File Info Panel -->
            <div id="file-info-panel" class="sidebar-panel">
                <div class="sidebar-panel-header" data-panel="file-info">
                    <i class="ph ph-caret-down sidebar-panel-caret text-xs"></i>
                    <span class="sidebar-panel-title">File Info</span>
                </div>
                <div class="sidebar-panel-body">
                    <p id="file-info-placeholder" class="file-info empty-placeholder">No file loaded.<br>Drop a PDF to begin.</p>
                    <div id="file-info" class="file-info">
                        <div class="file-details">
                            <span class="file-icon">📄</span>
                            <div style="min-width:0;">
                                <div id="file-name" class="file-name">document.pdf</div>
                                <div id="file-size" class="file-meta">0 MB</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-resizer" data-resizer="0"></div>

            <!-- Ranges Panel -->
            <div id="ranges-panel" class="sidebar-panel">
                <div class="sidebar-panel-header" data-panel="ranges">
                    <i class="ph ph-caret-down sidebar-panel-caret text-xs"></i>
                    <span class="sidebar-panel-title">Ranges</span>
                    <span id="range-count" class="sidebar-panel-badge" style="display:none">0</span>
                </div>
                <div class="sidebar-panel-body">
                    <div id="range-list" class="range-list">
                        <!-- Range items will be added here -->
                    </div>
                    <p class="range-hint">Tip: Combine multiple ranges with commas — <b>1-3, 5, 8-10</b>. Pages are 1-indexed.</p>
                </div>
            </div>
        </aside>

        <div id="sidebar-h-resizer" class="sidebar-h-resizer border-r border-[var(--border-default)]"></div>

        <main class="flex-1 overflow-hidden bg-[var(--bg-root)] relative flex flex-col">
            <div id="drop-zone" class="upload-area">
                <span class="upload-icon">📄</span>
                <p class="upload-text">Drag and drop your PDF here or <b>browse files</b></p>
                <input type="file" id="file-input" accept=".pdf">
            </div>

            <div id="preview-section" class="preview-section">
                <div class="section-header">
                    <h2>Page Preview</h2>
                </div>
                <div id="preview-container" class="preview-container">
                    <div class="preview-loading">
                        <div class="spinner"></div>
                        <p>Rendering pages...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="large-preview-modal" class="modal-overlay">
        <button id="modal-close" class="modal-close" title="Close">
            <i class="ph ph-x text-lg"></i>
        </button>
        <div class="modal-content">
            <div id="modal-canvas-container">
                <canvas id="modal-canvas"></canvas>
            </div>
            <div id="modal-page-info" class="modal-page-info">Page 1</div>
        </div>
    </div>

    <div id="postmsg-toast" class="toast"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const fileInfoPlaceholder = document.getElementById('file-info-placeholder');
        const addRangeBtn = document.getElementById('add-range-btn');
        const newPdfBtn = document.getElementById('new-pdf-btn');
        const rangeList = document.getElementById('range-list');
        const rangeCountBadge = document.getElementById('range-count');
        const fileNameEl = document.getElementById('file-name');
        const fileSizeEl = document.getElementById('file-size');
        const pageCountEl = document.getElementById('page-count');
        const previewSection = document.getElementById('preview-section');
        const previewContainer = document.getElementById('preview-container');
        const previewStatus = document.getElementById('preview-status');
        const modal = document.getElementById('large-preview-modal');
        const modalCanvas = document.getElementById('modal-canvas');
        const modalPageInfo = document.getElementById('modal-page-info');
        const modalClose = document.getElementById('modal-close');

        // Configure PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
        }

        let originalPdfDoc = null;
        let originalPdfBytes = null;
        let totalPages = 0;
        let cachedPdfJsDoc = null;

        // ── Two-way sync state ─────────────────────────────────────────────
        let syncVersion = 0;
        let syncTargetOrigin = '*';
        let syncPendingChange = null;
        let syncDebounceTimer = null;
        const SYNC_DEBOUNCE_MS = 300;

        function syncPostMessage(payload) {
            try {
                window.parent?.postMessage(payload, syncTargetOrigin);
            } catch (e) {
                console.error('[pdf] syncPostMessage failed:', e);
            }
        }

        function syncFlushImmediate() {
            if (syncDebounceTimer) {
                clearTimeout(syncDebounceTimer);
                syncDebounceTimer = null;
            }
            if (syncPendingChange) {
                syncVersion++;
                const p = syncPendingChange;
                syncPendingChange = null;
                syncPostMessage({
                    type: 'contentChange',
                    filename: p.filename,
                    format: 'pdf',
                    version: syncVersion,
                    selection: p.selection
                });
            }
        }

        function syncScheduleRangeChange(filename) {
            syncPendingChange = {
                filename: filename || 'document.pdf',
                selection: buildPageSelection()
            };
            clearTimeout(syncDebounceTimer);
            syncDebounceTimer = setTimeout(() => {
                if (!syncPendingChange) return;
                syncVersion++;
                const p = syncPendingChange;
                syncPendingChange = null;
                syncDebounceTimer = null;
                syncPostMessage({
                    type: 'contentChange',
                    filename: p.filename,
                    format: 'pdf',
                    version: syncVersion,
                    selection: p.selection
                });
            }, SYNC_DEBOUNCE_MS);
        }

        function buildPageSelection() {
            const rangeItems = rangeList.querySelectorAll('.range-item');
            const ranges = [];
            rangeItems.forEach(item => {
                const input = item.querySelector('.range-input');
                const val = input.value.trim();
                if (val) {
                    const parsed = parseRange(val);
                    if (parsed) {
                        ranges.push({ from: parsed[0], to: parsed[parsed.length - 1] });
                    }
                }
            });
            if (ranges.length === 0 && totalPages > 0) {
                return { page: 0, from: 0, to: totalPages - 1 };
            }
            if (ranges.length > 0) {
                const first = ranges[0];
                const last = ranges[ranges.length - 1];
                return { page: first.from - 1, from: first.from, to: last.to };
            }
            return null;
        }

        window.addEventListener('beforeunload', () => {
            syncFlushImmediate();
        });

        // --- File Handling ---

        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        };

        dropZone.ondragleave = () => {
            dropZone.classList.remove('drag-over');
        };

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        };

        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        };

        async function handleFile(file) {
            if (file.type !== 'application/pdf') {
                alert('Please upload a PDF file.');
                return;
            }

            fileNameEl.textContent = file.name;
            fileSizeEl.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';

            try {
                originalPdfBytes = await file.arrayBuffer();
                originalPdfDoc = await PDFLib.PDFDocument.load(originalPdfBytes);
                totalPages = originalPdfDoc.getPageCount();

                pageCountEl.textContent = totalPages + (totalPages === 1 ? ' Page' : ' Pages');
                pageCountEl.style.display = 'inline-block';
                previewStatus.style.display = 'inline-block';
                addRangeBtn.style.display = 'inline-flex';
                newPdfBtn.style.display = 'inline-flex';

                // Show UI
                document.body.classList.remove('sidebar-collapsed');
                localStorage.setItem('sidebar_collapsed', 'false');
                fileInfo.style.display = 'flex';
                fileInfoPlaceholder.style.display = 'none';
                previewSection.style.display = 'flex';
                dropZone.style.display = 'none';

                // Render Preview
                renderPreview(originalPdfBytes);

                // Clear previous ranges if any
                rangeList.innerHTML = '';
                addRangeRow();
            } catch (err) {
                console.error(err);
                alert('Error loading PDF. It might be encrypted or corrupted.');
            }
        }

        // Reset to drop zone (start over)
        function resetToDropZone() {
            originalPdfDoc = null;
            originalPdfBytes = null;
            totalPages = 0;
            cachedPdfJsDoc = null;
            rangeList.innerHTML = '';
            previewContainer.innerHTML = '';
            previewStatus.textContent = '';
            pageCountEl.textContent = '0 Pages';
            fileNameEl.textContent = 'document.pdf';
            fileSizeEl.textContent = '0 MB';
            fileInfo.style.display = 'none';
            fileInfoPlaceholder.style.display = 'block';
            previewSection.style.display = 'none';
            dropZone.style.display = 'block';
            pageCountEl.style.display = 'none';
            previewStatus.style.display = 'none';
            addRangeBtn.style.display = 'none';
            newPdfBtn.style.display = 'none';
            rangeCountBadge.style.display = 'none';
            fileInput.value = '';
            syncScheduleRangeChange('document.pdf');
        }

        newPdfBtn.onclick = () => resetToDropZone();

        // --- Range Management ---

        function updateRangeCount() {
            const count = rangeList.children.length;
            if (count > 0) {
                rangeCountBadge.textContent = count;
                rangeCountBadge.style.display = 'inline-block';
            } else {
                rangeCountBadge.style.display = 'none';
            }
        }

        function addRangeRow() {
            const row = document.createElement('div');
            row.className = 'range-item';

            row.innerHTML = `
                <div class="range-input-wrapper">
                    <input type="text" class="range-input" placeholder="e.g. 1-3, 5, 8-10" value="">
                </div>
                <button class="range-remove-btn" title="Remove Range">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
                    </svg>
                </button>
                <a href="#" class="range-download-btn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                    </svg>
                    Download
                </a>
            `;

            const input = row.querySelector('.range-input');
            const downloadBtn = row.querySelector('.range-download-btn');
            const removeBtn = row.querySelector('.range-remove-btn');

            input.oninput = () => {
                const val = input.value.trim();
                if (validateRange(val)) {
                    downloadBtn.classList.add('active');
                    input.classList.remove('invalid');
                } else {
                    downloadBtn.classList.remove('active');
                    if (val !== '') {
                        input.classList.add('invalid');
                    } else {
                        input.classList.remove('invalid');
                    }
                }
                syncScheduleRangeChange(fileNameEl.textContent);
            };

            downloadBtn.onclick = async (e) => {
                e.preventDefault();
                const val = input.value.trim();
                if (!val) {
                    postMsgToast('Enter a page range (e.g. 1-3, 5, 8-10)', true);
                    input.focus();
                    return;
                }
                if (!validateRange(val)) {
                    postMsgToast(`Invalid range "${val}" — PDF has ${totalPages} pages. Use comma-separated ranges like 1-3, 5, 8-10.`, true);
                    input.classList.add('invalid');
                    input.focus();
                    return;
                }
                const range = parseRange(val);
                if (range) {
                    await extractAndDownload(range, val);
                }
            };

            removeBtn.onclick = () => {
                row.remove();
                updateRangeCount();
                if (rangeList.children.length === 0) {
                    addRangeRow();
                }
                syncScheduleRangeChange(fileNameEl.textContent);
            };

            rangeList.appendChild(row);
            updateRangeCount();
            input.focus();
        }

        addRangeBtn.onclick = () => {
            addRangeRow();
            syncScheduleRangeChange(fileNameEl.textContent);
        };

        // --- Logic ---

        // Accepts comma-separated ranges: "1-2, 8-9, 23" or "1-3, 5" or "5"
        function validateRange(str) {
            if (!str) return false;
            const parts = str.split(',').map(p => p.trim()).filter(p => p.length > 0);
            if (parts.length === 0) return false;
            const regex = /^(\d+)(?:-(\d+))?$/;
            for (const part of parts) {
                const match = part.match(regex);
                if (!match) return false;
                const start = parseInt(match[1]);
                const end = match[2] ? parseInt(match[2]) : start;
                if (isNaN(start) || isNaN(end)) return false;
                if (start < 1 || end < 1) return false;
                if (start > totalPages || end > totalPages) return false;
                if (start > end) return false;
            }
            return true;
        }

        // Parses comma-separated ranges into a deduplicated, sorted 0-indexed array.
        // "1-2, 8-9, 23" → [0, 1, 7, 8, 22]
        function parseRange(str) {
            const parts = str.split(',').map(p => p.trim()).filter(p => p.length > 0);
            const indices = [];
            const regex = /^(\d+)(?:-(\d+))?$/;
            for (const part of parts) {
                const match = part.match(regex);
                if (!match) return null;
                const start = parseInt(match[1]);
                const end = match[2] ? parseInt(match[2]) : start;
                for (let i = start; i <= end; i++) {
                    indices.push(i - 1);
                }
            }
            return [...new Set(indices)].sort((a, b) => a - b);
        }

        async function extractAndDownload(pageIndices, rangeStr) {
            try {
                const subDoc = await PDFLib.PDFDocument.create();
                const copiedPages = await subDoc.copyPages(originalPdfDoc, pageIndices);
                copiedPages.forEach((page) => subDoc.addPage(page));

                const pdfBytes = await subDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                const baseName = fileNameEl.textContent.replace(/\.pdf$/i, '');
                a.download = `${baseName}_pages_${rangeStr}.pdf`;
                a.click();

                setTimeout(() => URL.revokeObjectURL(url), 100);
            } catch (err) {
                console.error(err);
                alert('Error processing PDF extraction.');
            }
        }

        async function renderPreview(pdfBytes) {
            previewContainer.innerHTML = '';
            previewStatus.textContent = 'Initializing...';

            try {
                if (!cachedPdfJsDoc || (pdfBytes !== originalPdfBytes)) {
                    const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
                    cachedPdfJsDoc = await loadingTask.promise;
                }
                const pdf = cachedPdfJsDoc;
                const numPages = pdf.numPages;

                previewStatus.textContent = `Rendering 1 of ${numPages}...`;

                for (let i = 1; i <= numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 0.5 });

                    const card = document.createElement('button');
                    card.className = 'page-card';
                    card.type = 'button';
                    card.setAttribute('aria-label', `View page ${i}`);
                    card.innerHTML = `
                        <div class="page-thumbnail-wrapper">
                            <canvas></canvas>
                        </div>
                        <div class="page-number-badge">Page ${i}</div>
                    `;

                    const canvas = card.querySelector('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    card.addEventListener('click', (e) => {
                        e.stopPropagation();
                        showLargePreview(i);
                    });

                    previewContainer.appendChild(card);
                    previewStatus.textContent = `Rendering ${i} of ${numPages}...`;
                }

                previewStatus.textContent = `${numPages} Pages Loaded`;
            } catch (err) {
                console.error('Error rendering preview:', err);
                previewContainer.innerHTML = `<p style="color: var(--danger); width: 100%; text-align: center;">Failed to load preview cards.</p>`;
                previewStatus.textContent = 'Preview error';
            }
        }

        async function showLargePreview(pageIndex) {
            try {
                modal.style.display = 'block';
                modalPageInfo.textContent = `Page ${pageIndex}`;

                if (!cachedPdfJsDoc) return;
                const pdf = cachedPdfJsDoc;
                const page = await pdf.getPage(pageIndex);

                const viewport = page.getViewport({ scale: 1.5 });
                const context = modalCanvas.getContext('2d');

                modalCanvas.height = viewport.height;
                modalCanvas.width = viewport.width;

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
            } catch (err) {
                console.error('Error in large preview:', err);
                alert('Could not load larger preview.');
                modal.style.display = 'none';
            }
        }

        modalClose.onclick = () => {
            modal.style.display = 'none';
        }

        window.onclick = (event) => {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // ── Inline toast (for postMessage feedback) ─────────────────────────
        const postMsgToastEl = document.getElementById('postmsg-toast');
        function postMsgToast(msg, isError) {
            if (!postMsgToastEl) { console.warn(msg); return; }
            postMsgToastEl.textContent = msg;
            postMsgToastEl.style.background = isError ? 'var(--danger)' : 'var(--bg-surface-raised)';
            postMsgToastEl.style.color = isError ? '#fff' : 'var(--text-primary)';
            postMsgToastEl.classList.add('visible');
            clearTimeout(postMsgToastEl._timer);
            postMsgToastEl._timer = setTimeout(() => {
                postMsgToastEl.classList.remove('visible');
            }, 3000);
        }

        // ── postMessage API: receive content from parent frame ─────────────
        window.addEventListener('message', function (event) {
            const msg = event.data;
            if (!msg || msg.type !== 'loadContent') return;

            if (!msg.bytes) {
                postMsgToast('pdf.html requires binary PDF bytes — use ArrayBuffer for the "bytes" field', true);
                syncPostMessage({
                    type: 'error',
                    code: 'load_failed',
                    message: 'pdf.html requires binary PDF bytes — use ArrayBuffer for the "bytes" field'
                });
                return;
            }

            const bytes = msg.bytes;
            const filename = typeof msg.filename === 'string' && msg.filename ? msg.filename : 'document.pdf';

            if (msg.options?.targetOrigin) {
                syncTargetOrigin = msg.options.targetOrigin;
            } else {
                syncTargetOrigin = event.origin || '*';
            }

            const file = new File([bytes], filename, { type: 'application/pdf' });
            handleFile(file);

            syncVersion++;
            const replyVersion = syncVersion;
            if (event.source) {
                event.source.postMessage({
                    type: 'loadContentAck',
                    filename: filename,
                    format: 'pdf',
                    version: replyVersion
                }, syncTargetOrigin);
            }

            postMsgToast(`Loaded: ${filename}`, false);
        });

        if (window.parent && window.parent !== window) {
            window.parent.postMessage({
                type: 'toolSelection',
                url: window.location.pathname.split('/').pop() + window.location.search
            }, '*');
            setTimeout(() => {
                syncPostMessage({
                    type: 'ready',
                    format: 'pdf',
                    version: syncVersion
                });
            }, 100);
        }

        // ── Sidebar panel collapse (click header to toggle) ─────────────────
        document.querySelectorAll('.sidebar-panel-header').forEach(h => {
            h.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                h.parentElement.classList.toggle('collapsed');
            });
        });

        // ── Mobile sidebar toggle ───────────────────────────────────────────
        const toggleSidebar = () => {
            document.body.classList.toggle("mobile-sidebar-active");
        };

        // ── Iframe Embed Mode + Shared Sidebar Toggle ─────────────────────
        (function setupIframeMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const showChrome = urlParams.get('show_chrome') === '1';
            const isInsideFrame = window.parent && window.parent !== window;
            const iframeMode = isInsideFrame && !showChrome;

            if (iframeMode) {
                document.body.classList.add('iframe-mode');
            }

            const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
            const sidebarEl = document.getElementById('sidebar');
            if (!sidebarToggleBtn || !sidebarEl) return;

            function updateToggleIcon(collapsed) {
                const collapseIcon = sidebarToggleBtn.querySelector('.icon-collapse');
                const expandIcon = sidebarToggleBtn.querySelector('.icon-expand');
                if (collapseIcon) collapseIcon.style.display = collapsed ? 'none' : 'block';
                if (expandIcon) expandIcon.style.display = collapsed ? 'block' : 'none';
                sidebarToggleBtn.title = collapsed ? 'Show sidebar' : 'Hide sidebar';
            }

            if (iframeMode) {
                let collapsed = true;
                sidebarEl.classList.add('iframe-sidebar-collapsed');
                updateToggleIcon(collapsed);

                sidebarToggleBtn.addEventListener('click', () => {
                    collapsed = !collapsed;
                    sidebarEl.classList.toggle('iframe-sidebar-collapsed', collapsed);
                    updateToggleIcon(collapsed);
                });
            } else {
                if (localStorage.getItem('sidebar_collapsed') === 'true') {
                    document.body.classList.add('sidebar-collapsed');
                }
                sidebarToggleBtn.onclick = () => {
                    if (window.innerWidth < 768) {
                        toggleSidebar();
                    } else {
                        const collapsed = document.body.classList.toggle('sidebar-collapsed');
                        localStorage.setItem('sidebar_collapsed', collapsed ? 'true' : 'false');
                    }
                };
            }
        })();
    </script>
    <script src="footer.js"></script>
</body>

</html>
