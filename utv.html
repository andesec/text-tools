<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Base64 & URI Utility — Dylen Text Tools</title>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="icon" href="favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="vendor/tailwind.min.css">
	<link rel="stylesheet" href="theme.css">
	<style>
		body {
			background-color: var(--bg-root);
			color: var(--text-primary);
		}

		textarea {
			font-family: var(--font-mono);
		}
	</style>
</head>

<body class="h-screen flex flex-col overflow-hidden transition-colors duration-200">
	<header class="app-header z-50 shrink-0">
		<div class="app-header-row">
			<!-- Left Edge: Home navigation icon -->
			<div class="flex items-center gap-2">
				<a href="index.html" class="btn-icon" title="Home" aria-label="Home">
					<i class="ph ph-house text-base"></i>
				</a>
			</div>

			<!-- Center: Tool Logo Badge + Tool Title -->
			<div class="app-header-row-center">
				<div class="app-header-logo-badge" style="background: linear-gradient(to bottom right, #6366f1, #a855f7);">
					<i class="ph ph-arrows-left-right text-lg text-white"></i>
				</div>
				<h1 class="text-base sm:text-lg font-bold tracking-tight text-[var(--text-primary)]">Base64 & URI</h1>
			</div>

			<!-- Right Edge: Quick Actions -->
			<div class="flex items-center gap-1.5 justify-end">
				<button onclick="clearText('input'); clearText('output')" class="btn btn-sm" title="Clear all input and output fields">
					<i class="ph ph-trash text-base"></i>
					<span class="btn-text">Clear All</span>
				</button>
				<button onclick="copyOutput()" class="btn btn-primary btn-sm" title="Copy output text to clipboard">
					<i class="ph ph-copy text-base"></i>
					<span class="btn-text">Copy Output</span>
				</button>
			</div>
		</div>

		<!-- Sub-Toolbar (Row 2) -->
		<div class="app-header-toolbar">
			<div class="toolbar-pinned-left">
				<button onclick="swap()" class="btn-icon" title="Swap Input and Output" aria-label="Swap Input and Output">
					<i class="ph ph-arrows-down-up text-base"></i>
				</button>
			</div>

			<div class="toolbar-middle-scroll">
				<button onclick="transform('b64e')" class="btn btn-sm" title="Base64 Encode input text">
					<i class="ph ph-lock-key text-base text-[var(--accent-text)]"></i>
					<span class="btn-text">Base64 Encode</span>
				</button>
				<button onclick="transform('b64d')" class="btn btn-sm" title="Base64 Decode input text">
					<i class="ph ph-lock-key-open text-base text-[var(--accent-text)]"></i>
					<span class="btn-text">Base64 Decode</span>
				</button>
				<button onclick="transform('urie')" class="btn btn-sm" title="URI Encode input text">
					<i class="ph ph-link text-base text-[var(--info)]"></i>
					<span class="btn-text">URI Encode</span>
				</button>
				<button onclick="transform('urid')" class="btn btn-sm" title="URI Decode input text">
					<i class="ph ph-link-break text-base text-[var(--info)]"></i>
					<span class="btn-text">URI Decode</span>
				</button>
				<button onclick="transform('resolve')" class="btn btn-sm" title="Resolve Unicode and escape sequences">
					<i class="ph ph-magic-wand text-base text-[var(--warning)]"></i>
					<span class="btn-text">Resolve Escapes</span>
				</button>
			</div>

			<div class="toolbar-pinned-right">
				<button onclick="pasteText('input')" class="btn btn-sm" title="Paste text from clipboard into input">
					<i class="ph ph-clipboard-text text-base"></i>
					<span class="btn-text">Paste</span>
				</button>
			</div>
		</div>
	</header>

	<!-- Main Layout -->
	<main class="flex-1 overflow-y-auto p-4 sm:p-6 bg-[var(--bg-root)]">
		<div class="max-w-6xl mx-auto space-y-6">
			<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 relative">
				<!-- Input Panel -->
				<section class="bg-[var(--bg-surface)] border border-[var(--border-default)] rounded-xl p-4 sm:p-5 flex flex-col gap-3">
					<div class="flex items-center justify-between">
						<div class="flex items-center gap-2">
							<i class="ph ph-text-align-left text-sm text-[var(--text-tertiary)]"></i>
							<h2 class="text-xs font-semibold uppercase tracking-wider text-[var(--text-secondary)]">Input</h2>
						</div>
						<div class="flex items-center gap-2">
							<button onclick="clearText('input')" class="btn btn-ghost btn-sm text-xs text-[var(--text-tertiary)] hover:text-[var(--danger)]">Clear</button>
							<button onclick="pasteText('input')" class="btn btn-ghost btn-sm text-xs text-[var(--accent-text)]">Paste</button>
						</div>
					</div>
					<textarea id="input" class="w-full h-80 sm:h-[calc(100vh-280px)] p-3 rounded-lg font-mono text-sm leading-relaxed bg-[var(--code-bg)] border border-[var(--border-default)] text-[var(--text-primary)] focus:outline-none focus:border-[var(--accent)] transition-colors resize-none" placeholder="Paste or type text here..."></textarea>
				</section>

				<!-- Swap Overlay Button -->
				<div class="flex lg:flex-col items-center justify-center gap-4 lg:absolute lg:inset-y-0 lg:left-1/2 lg:-translate-x-1/2 z-10 py-2 lg:py-0 pointer-events-none">
					<button onclick="swap()" class="pointer-events-auto btn-icon bg-[var(--bg-surface-raised)] border border-[var(--border-strong)] hover:bg-[var(--bg-surface-hover)] shadow-lg rounded-full w-10 h-10 text-[var(--accent-text)] transition-transform active:scale-95 flex items-center justify-center" title="Swap Input and Output">
						<i class="ph ph-arrows-down-up text-lg"></i>
					</button>
				</div>

				<!-- Output Panel -->
				<section class="bg-[var(--bg-surface)] border border-[var(--border-default)] rounded-xl p-4 sm:p-5 flex flex-col gap-3">
					<div class="flex items-center justify-between">
						<div class="flex items-center gap-2">
							<i class="ph ph-check-circle text-sm text-[var(--text-tertiary)]"></i>
							<h2 class="text-xs font-semibold uppercase tracking-wider text-[var(--text-secondary)]">Output</h2>
						</div>
						<div class="flex items-center gap-2">
							<button onclick="clearText('output')" class="btn btn-ghost btn-sm text-xs text-[var(--text-tertiary)] hover:text-[var(--danger)]">Clear</button>
							<button onclick="copyOutput()" class="btn btn-ghost btn-sm text-xs text-[var(--accent-text)]">Copy</button>
						</div>
					</div>
					<textarea id="output" class="w-full h-80 sm:h-[calc(100vh-280px)] p-3 rounded-lg font-mono text-sm leading-relaxed bg-[var(--code-bg)] border border-[var(--border-default)] text-[var(--text-primary)] focus:outline-none focus:border-[var(--accent)] transition-colors resize-none" placeholder="Result will appear here..."></textarea>
				</section>
			</div>
		</div>
	</main>

	<div id="toast" class="toast">Copied to clipboard!</div>

	<script>
		const inputEl = document.getElementById('input');
		const outputEl = document.getElementById('output');
		const toastEl = document.getElementById('toast');

		const UTV_STORAGE_KEY = window.name && window.name.startsWith('tab_') 
			? `utv_state_${window.name}` 
			: 'utv_state_default';

		function loadState() {
			try {
				const stored = localStorage.getItem(UTV_STORAGE_KEY);
				if (stored) {
					const data = JSON.parse(stored);
					inputEl.value = data.input || '';
					outputEl.value = data.output || '';
				}
			} catch (e) {}
		}

		function saveState() {
			try {
				localStorage.setItem(UTV_STORAGE_KEY, JSON.stringify({
					input: inputEl.value,
					output: outputEl.value
				}));
			} catch (e) {}
		}

		inputEl.addEventListener('input', saveState);
		outputEl.addEventListener('input', saveState);

		function transform(type) {
			const text = inputEl.value;
			if (!text) return;

			try {
				let result = '';
				switch (type) {
					case 'b64e': result = btoa(unescape(encodeURIComponent(text))); break;
					case 'b64d': result = decodeURIComponent(escape(atob(text))); break;
					case 'urie': result = encodeURIComponent(text); break;
					case 'urid': result = decodeURIComponent(text); break;
					case 'resolve':
						result = text.replace(/\\n/g, "\n")
							.replace(/\\r/g, "\r")
							.replace(/\\t/g, "\t")
							.replace(/\\"/g, '"')
							.replace(/\\u([0-9a-fA-F]{4})/g, (match, grp) => {
								return String.fromCharCode(parseInt(grp, 16));
							});
						break;
				}
				outputEl.value = result;
				saveState();
				showToast('Transformation successful!');
			} catch (e) {
				alert('Operation failed: ' + e.message);
			}
		}

		function swap() {
			const temp = inputEl.value;
			inputEl.value = outputEl.value;
			outputEl.value = temp;
			saveState();
		}

		function clearText(target) {
			document.getElementById(target).value = '';
			saveState();
		}

		function fallbackCopy(text) {
			const ta = document.createElement("textarea");
			ta.value = text;
			ta.style.position = "fixed";
			ta.style.left = "-9999px";
			document.body.appendChild(ta);
			ta.select();
			try { document.execCommand("copy"); } catch { /* silent */ }
			document.body.removeChild(ta);
		}

		function copyOutput() {
			if (!outputEl.value) return;
			if (navigator.clipboard && window.isSecureContext) {
				navigator.clipboard.writeText(outputEl.value).then(() => {
					showToast('Copied to clipboard!');
				}).catch(() => { fallbackCopy(outputEl.value); showToast('Copied to clipboard!'); });
			} else {
				fallbackCopy(outputEl.value);
				showToast('Copied to clipboard!');
			}
		}

		async function pasteText(target) {
			try {
				if (!navigator.clipboard || !window.isSecureContext) {
					throw new Error('Clipboard API unavailable');
				}
				const text = await navigator.clipboard.readText();
				if (text !== undefined && text !== null) {
					const el = document.getElementById(target);
					el.value = text;
					saveState();
					showToast('Pasted from clipboard!');
				}
			} catch (err) {
				console.error('Failed to read clipboard: ', err);
				showToast('Use Ctrl+V / Cmd+V to paste');
			}
		}

		function showToast(msg) {
			toastEl.textContent = msg;
			toastEl.classList.add('visible');
			setTimeout(() => toastEl.classList.remove('visible'), 2000);
		}

		loadState();
		if (window.parent && window.parent !== window) {
			window.parent.postMessage({
				type: 'toolSelection',
				url: window.location.pathname.split('/').pop() + window.location.search
			}, '*');
		}
	</script>
	<script src="footer.js"></script>
</body>

</html>
